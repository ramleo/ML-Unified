name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # On a pull request, gitleaks lists that PR's commits so it scans only what
    # the PR adds. Listing them reads pull-request data, which this repo's
    # default token scope (contents, metadata and packages, all read) does not
    # cover — so every PR failed with "Resource not accessible by integration"
    # while main passed, because main has no PR to list.
    #
    # ml-portfolio was fixed for this on 2026-09-12 and this repo was not, so
    # its Dependabot PRs kept failing after the other repo's were unblocked.
    # Same bug, same fix, two workflow files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Posting findings as PR comments would need pull-requests: WRITE,
          # and GitHub hands Dependabot-triggered runs a read-only token
          # whatever the workflow asks for — so comments would reintroduce the
          # same 403 on exactly the PRs this fixes. The job passing or failing
          # is the signal that matters; the finding is in the log.
          GITLEAKS_ENABLE_COMMENTS: false

  # D5: every commit ever made, not only the ones a pull request adds.
  #
  # `secret-scan` above hands gitleaks the PR's own commits, which answers
  # "does this change introduce a secret". Useful, and not the question that
  # matters before a repository goes public: a key committed in March and
  # deleted in April is invisible to it and perfectly visible to anyone who
  # clones. Until now the only full-history evidence was a local run somebody
  # did by hand once, which stops being true the moment the next commit lands.
  #
  # Demonstrated rather than assumed. In a throwaway repository, a
  # github-PAT-shaped token committed and then deleted is caught by
  # `gitleaks git` (exit 1, "leaks found: 1") and missed entirely by a
  # working-tree scan (exit 0, "no leaks found").
  #
  # The whole history is 997 commits and takes about a second, so there is no
  # argument for running this on a schedule instead of every time.
  #
  # Pinned by version and run as a binary rather than through the action,
  # because the action's job is the PR-scoped scan the other job already does.
  secret-scan-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan every commit in the history
        run: /tmp/gitleaks git --no-banner --redact --exit-code 1 .

  # The 400-line limit used to be a rule someone had to remember, which meant
  # it was skipped exactly when following it was inconvenient. Now it fails the
  # build. See scripts/check-file-length.sh for what the baseline does.
  file-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file lengths
        run: ./scripts/check-file-length.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/ml-api/requirements-base.txt
            services/ml-api/requirements.txt
            services/ml-vision/requirements.txt
            requirements-dev.txt

      # The runner ships ~25GB of toolchains this job never touches, and the
      # ml-api install needs every byte of it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Nothing pins torch, so pip resolves the default PyPI build — which
      # drags in the whole CUDA runtime (nvidia-*, triton, cuda-toolkit) on a
      # runner that has no GPU and tests that never ask for one. That is what
      # filled the disk. Installing the CPU wheels first satisfies sam2's
      # torch>=2.5.1 floor, so the requirements steps below leave torch alone.
      - name: Install CPU-only PyTorch
        run: |
          pip install --no-cache-dir torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install ml-api base dependencies
        run: pip install -r services/ml-api/requirements-base.txt

      - name: Install ml-api dependencies
        run: pip install -r services/ml-api/requirements.txt

      - name: Install ml-vision dependencies
        run: pip install -r services/ml-vision/requirements.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Lint ml-api
        run: ruff check services/ml-api/app.py

      - name: Lint ml-vision
        run: ruff check services/ml-vision/vision_app.py

      - name: Test ml-api
        run: pytest services/ml-api/tests/ -v --tb=short

      - name: Test ml-vision
        run: pytest services/ml-vision/tests/ -v --tb=short


  model-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ml-api/requirements.txt

      - name: Install ml-api dependencies
        run: pip install -r services/ml-api/requirements.txt

      - name: Model quality gate
        run: python scripts/check_model_quality.py

  # There was a deploy job here that curled three Render deploy hooks. The
  # ml-api service behind the first one no longer exists — the host does not
  # answer at all — so it failed every push to main while deploying nothing.
  # ml-api now lives on the HF Space (wram1708/ml-unified) and is deployed by
  # uploading the changed files with a write token, deliberately by hand: see
  # rule 4 in CLAUDE.md. Rule 5 is why it stays by hand — each upload costs a
  # 2-5 minute rebuild serving 500s, so changes are batched and deployed once,
  # which a job firing on every push cannot do.
