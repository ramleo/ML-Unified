name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The 400-line limit used to be a rule someone had to remember, which meant
  # it was skipped exactly when following it was inconvenient. Now it fails the
  # build. See scripts/check-file-length.sh for what the baseline does.
  file-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check file lengths
        run: ./scripts/check-file-length.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/ml-api/requirements-base.txt
            services/ml-api/requirements.txt
            services/ml-vision/requirements.txt
            requirements-dev.txt

      # The runner ships ~25GB of toolchains this job never touches, and the
      # ml-api install needs every byte of it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Nothing pins torch, so pip resolves the default PyPI build — which
      # drags in the whole CUDA runtime (nvidia-*, triton, cuda-toolkit) on a
      # runner that has no GPU and tests that never ask for one. That is what
      # filled the disk. Installing the CPU wheels first satisfies sam2's
      # torch>=2.5.1 floor, so the requirements steps below leave torch alone.
      - name: Install CPU-only PyTorch
        run: |
          pip install --no-cache-dir torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install ml-api base dependencies
        run: pip install -r services/ml-api/requirements-base.txt

      - name: Install ml-api dependencies
        run: pip install -r services/ml-api/requirements.txt

      - name: Install ml-vision dependencies
        run: pip install -r services/ml-vision/requirements.txt

      - name: Install ml-eda dependencies
        run: pip install -r services/ml-eda/requirements.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Lint ml-api
        run: ruff check services/ml-api/app.py

      - name: Lint ml-vision
        run: ruff check services/ml-vision/app.py

      - name: Lint ml-eda
        run: ruff check services/ml-eda/app.py

      - name: Test ml-api
        run: pytest services/ml-api/tests/ -v --tb=short

      - name: Test ml-vision
        run: pytest services/ml-vision/tests/ -v --tb=short

      - name: Test ml-eda
        run: pytest services/ml-eda/tests/ -v --tb=short

  model-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ml-api/requirements.txt

      - name: Install ml-api dependencies
        run: pip install -r services/ml-api/requirements.txt

      - name: Model quality gate
        run: python scripts/check_model_quality.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger ml-api deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | grep -q "^2" \
            && echo "ml-api deploy triggered." \
            || (echo "ml-api deploy hook failed." && exit 1)

      - name: Trigger ml-vision deploy
        env:
          VISION_HOOK: ${{ secrets.RENDER_VISION_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VISION_HOOK" ]; then
            echo "RENDER_VISION_DEPLOY_HOOK_URL not set — skipping ml-vision deploy."
            exit 0
          fi
          curl -s -o /dev/null -w "%{http_code}" \
            "$VISION_HOOK" | grep -q "^2" \
            && echo "ml-vision deploy triggered." \
            || (echo "ml-vision deploy hook failed." && exit 1)

      - name: Trigger ml-eda deploy
        env:
          EDA_HOOK: ${{ secrets.RENDER_EDA_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$EDA_HOOK" ]; then
            echo "RENDER_EDA_DEPLOY_HOOK_URL not set — skipping ml-eda deploy."
            exit 0
          fi
          curl -s -o /dev/null -w "%{http_code}" \
            "$EDA_HOOK" | grep -q "^2" \
            && echo "ml-eda deploy triggered." \
            || (echo "ml-eda deploy hook failed." && exit 1)
