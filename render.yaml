services:
  - type: web
    name: ml-api
    env: docker
    rootDir: services/ml-api
    healthCheckPath: /health
    envVars:
      - key: ML_VISION_URL
        sync: false   # set via Render dashboard once ml-vision is deployed

  - type: web
    name: ml-vision
    env: docker
    rootDir: services/ml-vision
    healthCheckPath: /health
