    <div style="padding:2.5rem 1.5rem;text-align:center">
      ${_progressBarHTML('segFill','segMsg','segPct')}
      <div style="font-size:0.7rem;color:var(--text3);margin-top:0.7rem;opacity:0.75">First call downloads ~4.4 MB — may take ~30 s on free tier cold start</div>
    </div>`;

  try {
    const res = await fetch(`${VISION_API}/segment-image`, { method: 'POST', body: form });
    if (!res.ok) {
      const raw = await res.text();
      let msg;
      try { const j = JSON.parse(raw); msg = j.detail || raw; } catch { msg = raw; }
      if (res.status === 503) { showSegRetry(msg); return; }
      throw new Error(msg);
    }
    let data = null;
    for await (const ev of _sseStream(res)) {
      if (ev.error) throw new Error(ev.error);
      if (ev.pct !== undefined) _updateProgressBar('segFill','segMsg','segPct', ev.pct, ev.msg);
      if (ev.result) data = ev.result;
    }
    if (!data) throw new Error('No result received from server.');
    renderSegmentationResult(data);
  } catch(e) {
    document.getElementById('segResult').innerHTML = '';
    errEl.innerHTML = `<div class="js-err-box">${e.message}</div>`;
  } finally {
    btn.innerHTML = 'Segment Image →';
    btn.disabled  = false;
  }
}

function showSegRetry(msg) {
  const errEl = document.getElementById('segErr');
  const btn   = document.getElementById('segRunBtn');
  btn.innerHTML = 'Segment Image →'; btn.disabled = false;
  if (_segRetryCount >= 3) {
    _segRetryCount = 0;
    errEl.innerHTML = `<div class="js-err-box">✗ Model unavailable after 3 attempts. Please try again later.</div>`;
    return;
  }
  _segRetryCount++;
  let secs = 30;
  const tick = () => {
    errEl.innerHTML = `<div class="js-warn-box">
      <span>⏳ Vision service is warming up — please try again in ~30 seconds. Auto-retrying in ${secs}s… (attempt ${_segRetryCount}/3)</span>
      <button onclick="cancelSegRetry()" style="padding:0.2rem 0.6rem;border:1px solid #fbbf2466;border-radius:6px;background:transparent;color:#fbbf24;cursor:pointer;font-size:0.78rem;flex-shrink:0">Stop</button>
    </div>`;
    if (secs-- > 0) { _segRetryTimer = setTimeout(tick, 1000); } else { runSegmentation(); }
  };
  tick();
}

function countUpMetricPill() {
  const el = document.querySelector('.metric-val');
  if (!el) return;
  const raw = el.textContent.trim();
  const num = parseFloat(raw.replace(/[^0-9.]/g, ''));
  if (isNaN(num)) return;
  const prefix = raw.match(/^[^0-9]*/)?.[0] || '';
  const suffix = raw.match(/[^0-9.]+$/)?.[0] || '';
  const dec    = (raw.replace(/[^0-9.]/g,'').split('.')[1] || '').length;
  const start  = performance.now();
  const dur    = 600;
  (function tick(now) {
    const t = Math.min((now - start) / dur, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    el.textContent = prefix + (num * ease).toFixed(dec) + suffix;
    if (t < 1) requestAnimationFrame(tick);
  })(performance.now());
}

function countUp(el, endVal, prefix, duration) {
  const dec = endVal % 1 === 0 ? 0 : 0;
  const start = performance.now();
  (function tick(now) {
    const t    = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    const cur  = endVal * ease;
    el.textContent = prefix + cur.toLocaleString('en-IN', { maximumFractionDigits: 0 });
    if (t < 1) requestAnimationFrame(tick);
  })(performance.now());
}

// ── Particle background ────────────────────────────────────────
(function initParticles() {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, pts;
  const N = 65, CONN = 130, REPEL = 110;
  const mouse = { x: -999, y: -999 };

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function spawn() {
    pts = Array.from({ length: N }, () => {
      const x = Math.random() * W, y = Math.random() * H;
      return { x, y, ox: x, oy: y, vx: 0, vy: 0, r: Math.random() * 1.2 + 0.5 };
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const dark = document.documentElement.getAttribute('data-theme') !== 'light';
    const dotColor  = dark ? '129,140,248' : '99,102,241';
    const lineColor = dark ? '129,140,248' : '99,102,241';

    pts.forEach(p => {
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d < REPEL && d > 0) {
        const f = ((REPEL - d) / REPEL) * 1.2;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }
      p.vx += (p.ox - p.x) * 0.018;
      p.vy += (p.oy - p.y) * 0.018;
      p.vx *= 0.82; p.vy *= 0.82;
      p.x  += p.vx;  p.y  += p.vy;
    });

    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < CONN) {
          ctx.globalAlpha = (1 - d / CONN) * (dark ? 0.35 : 0.28);
          ctx.strokeStyle = `rgba(${lineColor},1)`;
          ctx.lineWidth   = 0.8;
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.stroke();
        }
      }
    }

    pts.forEach(p => {
      ctx.globalAlpha = dark ? 0.65 : 0.55;
      ctx.fillStyle   = `rgba(${dotColor},1)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }

  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('resize',    () => { resize(); spawn(); });
  resize(); spawn(); draw();
})();

// Paths that are internal infrastructure — never shown in Details
const _METRICS_SKIP = new Set([
  '/models', '/image-models', '/detect-models', '/seg-models',
  '/imagenet-classes', '/image-operations',
]);

// Known items always shown in Details, even with 0 activity
const _METRICS_KNOWN = {
  ml:     ['Iris', 'Titanic', 'Diabetes', 'Insurance', 'Training', 'Clustering'],
  vision: ['Classifier', 'Processing', 'Detection', 'Segmentation'],
  eda:    ['EDA Analysis'],
};

function _friendlyEndpoints(endpoints, key) {
  const NAME = {
    '/train':          'Training',
    '/analyze':        'CSV Analysis',
    '/unsupervised':   'Clustering',
    '/eda':            'EDA Analysis',
    '/classify-image': 'Classifier',
    '/process-image':  'Processing',
    '/detect-objects': 'Detection',
    '/segment-image':  'Segmentation',
  };
  function toName(path) {
    if (NAME[path]) return NAME[path];
    const m = path.match(/\/(?:schemas|predict)\/(.+)/);
    if (m) return m[1].charAt(0).toUpperCase() + m[1].slice(1);
    const seg = path.split('/').filter(Boolean).pop() || path;
    return seg.charAt(0).toUpperCase() + seg.slice(1).replace(/-/g, ' ');
  }
  // Pre-populate with known items so they always appear
  const groups = {};
  for (const name of (_METRICS_KNOWN[key] || [])) {
    groups[name] = { name, count: 0, totalMs: 0, p95_ms: 0 };
  }
  // Merge actual data — strict mode (eda) only updates pre-seeded known items
  const strict = key === 'eda';  // eda shares ml-api but should only show its own endpoints
  for (const e of endpoints) {
    if (_METRICS_SKIP.has(e.path)) continue;
    const name = toName(e.path);
    if (!groups[name]) {
      if (strict) continue;  // eda/known-only mode: ignore endpoints not in METRICS_KNOWN
      groups[name] = { name, count: 0, totalMs: 0, p95_ms: 0 };
    }
    groups[name].count   += e.count;
    groups[name].totalMs += e.avg_ms * e.count;
    groups[name].p95_ms   = Math.max(groups[name].p95_ms, e.p95_ms);
  }
  return Object.values(groups)
    .map(g => ({
      name:   g.name,
      count:  g.count,
      avg_ms: g.count > 0 ? Math.round(g.totalMs / g.count * 10) / 10 : 0,
      p95_ms: g.p95_ms,
    }))
    .sort((a, b) => b.count - a.count);
}

function _fmtUptime(s) {
  if (s < 60)   return `${s}s`;
  if (s < 3600) return `${Math.floor(s/60)}m ${s%60}s`;
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
}

function _latencyBar(ms, maxMs) {
  const pct   = Math.min((ms / Math.max(maxMs, 1)) * 100, 100);
  const color = ms < 200 ? '#34d399' : ms < 800 ? '#fbbf24' : '#f87171';
  return `<div style="height:6px;border-radius:3px;background:var(--border2);flex:1;overflow:hidden">
    <div style="height:100%;width:${pct}%;background:${color};border-radius:3px;transition:width 0.4s"></div>
  </div>`;
}

    };

        ${[

                      background:${statBg(c)};border:1px solid ${statBorder(c)}">

  };

  if (APP_MODE === 'vision') {

  } else if (APP_MODE === 'ml' || APP_MODE === 'eda') {

async function _fetchMetrics() {
  let api = null, vision = null;
  if (APP_MODE === 'vision') {
    vision = VISION_API
      ? await fetch(`${VISION_API}/metrics`).then(r => r.ok ? r.json() : null).catch(() => null)
      : null;
  } else if (APP_MODE === 'ml' || APP_MODE === 'eda') {
    api = await fetch(`${API}/metrics`).then(r => r.ok ? r.json() : null).catch(() => null);
  } else {
    [api, vision] = await Promise.all([
      fetch(`${API}/metrics`).then(r => r.ok ? r.json() : null).catch(() => null),
      VISION_API ? fetch(`${VISION_API}/metrics`).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null),
    ]);
  }
  _metricsCache = { api, vision, ts: new Date() };
  _renderMetrics(api, vision);
  const ts = document.getElementById('metricsTs');
  if (ts) ts.textContent = 'Updated ' + _metricsCache.ts.toLocaleTimeString();
}

async function runUnsupervisedAnalysis(id) {
  const btn = document.getElementById('uRunBtn');
  btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Running…';
  document.getElementById('uErr').innerHTML = '';
  document.getElementById('uResult').innerHTML = `
    <div style="text-align:center;padding:2rem 1rem">
      <div style="font-size:0.9rem;font-weight:600;margin-bottom:1rem;color:var(--text2)">Running analysis…</div>
      ${_progressBarHTML('uFill','uMsg','uPct')}
    </div>`;

  const nDims = parseInt(
    (document.querySelector('input[name="uKmDim"]:checked') ||
     document.querySelector('input[name="uDbDim"]:checked') ||
     document.querySelector('input[name="uTsneDim"]:checked') ||
     document.querySelector('input[name="uPcaDim"]:checked') ||
     {value:'2'}).value
  ) || 2;

  const form = new FormData();
  form.append('file',      uFile);
  form.append('algorithm', UNSUPERVISED_META[id].label);
  form.append('color_col', document.getElementById('uColorCol') ? document.getElementById('uColorCol').value : '');
  form.append('n_dims',    nDims);
  if (id === 'kmeans')  form.append('n_clusters',  document.getElementById('uNK')?.value || 3);
  if (id === 'dbscan') { form.append('eps', document.getElementById('uEps')?.value || 0.5); form.append('min_samples', document.getElementById('uMinSamples')?.value || 5); }
  if (id === 'tsne')    form.append('perplexity',   document.getElementById('uPerplexity')?.value || 30);

  try {
    const res = await fetch(API + '/unsupervised', { method: 'POST', body: form });
    if (!res.ok) { const t = await res.text(); throw new Error(t); }

    let data = null;
    for await (const ev of _sseStream(res)) {
      if (ev.error) throw new Error(ev.error);
      if (ev.pct !== undefined) _updateProgressBar('uFill','uMsg','uPct', ev.pct, ev.msg);
      if (ev.result) data = ev.result;
    }
    if (!data) throw new Error('No result received from server.');
    renderUnsupervisedResult(id, data);
  } catch(e) {
    document.getElementById('uResult').innerHTML = '';
    document.getElementById('uErr').innerHTML = '<div class="js-err-box">' + e.message + '</div>';
  } finally {
    const meta = UNSUPERVISED_META[id];
    btn.disabled = false; btn.style.opacity = '1'; btn.textContent = 'Run ' + meta.label;
  }
}

      <div class="u-stat-row"><span>Silhouette score</span><strong style="color:${accent}">${stats.silhouette}</strong></div>
      <div class="u-stat-divider"></div>
      ${Object.entries(sizes).map(([k,v]) => `<div class="u-stat-row"><span>Cluster ${parseInt(k)+1}</span><strong>${v} points</strong></div>`).join('')}`;
  } else if (id === 'dbscan') {
    statsHtml = `
      <div class="u-stat-row"><span>Clusters found</span><strong style="color:${accent}">${stats.n_clusters}</strong></div>
      <div class="u-stat-row"><span>Outliers (noise)</span><strong style="color:#f87171">${stats.n_noise}</strong></div>
      <div class="u-stat-row"><span>Silhouette score</span><strong style="color:${accent}">${stats.silhouette}</strong></div>`;
  } else if (id === 'tsne') {
    statsHtml = `
      <div class="u-stat-row"><span>Perplexity used</span><strong style="color:${accent}">${stats.perplexity}</strong></div>
      <div class="u-stat-row"><span>KL divergence</span><strong>${stats.kl_divergence}</strong></div>
      <div class="u-stat-row"><span style="color:var(--text3);font-size:0.78rem">Lower KL = better fit</span></div>`;
  } else if (id === 'pca') {
    const ev = stats.explained_variance || [];
    statsHtml = `
      <div class="u-stat-row"><span>PC1 variance</span><strong style="color:${accent}">${ev[0] || 0}%</strong></div>
      <div class="u-stat-row"><span>PC2 variance</span><strong style="color:${accent}">${ev[1] || 0}%</strong></div>
      <div class="u-stat-row"><span>Total explained</span><strong style="color:${accent}">${stats.total_variance || 0}%</strong></div>`;
  }

  const xLabel = id === 'pca' ? `PC1 (${(stats.explained_variance||[0])[0]}%)` : (id === 'tsne' ? 't-SNE 1' : 'Component 1');
  const yLabel = id === 'pca' ? `PC2 (${(stats.explained_variance||[0,0])[1]}%)` : (id === 'tsne' ? 't-SNE 2' : 'Component 2');

  const is3d     = data.plot_data && data.plot_data[0] && data.plot_data[0].z !== undefined;
  const dbHint   = (id === 'dbscan' && stats.n_clusters === 0)

    : '';

  document.getElementById('uResult').innerHTML = `
    <div class="u-result">
      <div class="u-result-plot">
        ${is3d
          ? '<div id="uPlot3d" style="width:100%;height:400px;border-radius:12px;overflow:hidden"></div>'
          : `<div class="u-axis-label u-axis-y">${yLabel}</div>
             <canvas id="uScatterCanvas" width="480" height="340" style="max-width:100%;border-radius:12px;background:var(--bg-input)"></canvas>

        ${dbHint}
        ${statsHtml}

  }
}

function drawScatterPlot(canvasId, plotData, accent, colorLabels, showNoise) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !plotData || !plotData.length) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, PAD = 40;

  const COLORS = ['#818cf8','#38bdf8','#34d399','#fbbf24','#f87171','#fb923c','#a78bfa','#4ade80','#f472b6','#2dd4bf','#facc15','#fb7185'];
  const NOISE_COLOR = '#6b7280';

  // Build label→index map when Color By is active
  const labelMap = {};
  if (colorLabels) colorLabels.forEach((l, i) => { labelMap[l] = i; });
  const hasLabels = colorLabels && colorLabels.length > 0;

  const xs = plotData.map(p => p.x), ys = plotData.map(p => p.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const xR = xMax - xMin || 1, yR = yMax - yMin || 1;
  const toX = x => PAD + ((x - xMin) / xR) * (W - PAD*2);
  const toY = y => H - PAD - ((y - yMin) / yR) * (H - PAD*2);

  ctx.clearRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = 'rgba(128,128,128,0.1)'; ctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    const gx = PAD + (i/5)*(W-PAD*2), gy = PAD + (i/5)*(H-PAD*2);
    ctx.beginPath(); ctx.moveTo(gx, PAD); ctx.lineTo(gx, H-PAD); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD, gy); ctx.lineTo(W-PAD, gy); ctx.stroke();
  }

  // Points — color by label if Color By is set, else by cluster
  plotData.forEach(p => {
    const isNoise   = showNoise && p.cluster === -1 && !hasLabels;
    const labelIdx  = hasLabels && p.label ? labelMap[p.label] : -1;
    const color     = isNoise   ? NOISE_COLOR :
                      labelIdx >= 0 ? COLORS[labelIdx % COLORS.length] :
                      p.cluster >= 0 ? COLORS[p.cluster % COLORS.length] : accent;
    ctx.beginPath();
    ctx.arc(toX(p.x), toY(p.y), isNoise ? 2.5 : 3.5, 0, Math.PI*2);
    ctx.fillStyle = color + (isNoise ? '88' : 'cc');
    ctx.fill();
  });

  // Legend
  const legendItems = hasLabels
    ? colorLabels.map((l, i) => ({ color: COLORS[i % COLORS.length], label: l }))
    : [...new Set(plotData.map(p => p.cluster))].sort((a,b)=>a-b).slice(0,12).map(id => ({
        color: (showNoise && id === -1) ? NOISE_COLOR : COLORS[id % COLORS.length],
        label: (showNoise && id === -1) ? 'Noise' : 'Cluster ' + (id+1)
      }));

  if (legendItems.length > 1 && legendItems.length <= 15) {
    let lx = PAD + 8, ly = PAD + 8;
    legendItems.forEach(item => {
      ctx.beginPath(); ctx.arc(lx+5, ly+5, 4, 0, Math.PI*2);
      ctx.fillStyle = item.color + 'cc'; ctx.fill();
      ctx.fillStyle = 'rgba(200,200,200,0.85)'; ctx.font = '11px sans-serif';
      ctx.fillText(item.label, lx+14, ly+9);
      ly += 18;
    });
  }
}

function draw3dPlot(divId, plotData, accent, colorLabels, showNoise, xLabel, yLabel, zLabel) {
  if (typeof Plotly === 'undefined') {
    document.getElementById(divId).innerHTML = '<div style="padding:2rem;color:var(--text3);font-size:0.85rem">Plotly.js loading — please wait a moment and re-run.</div>';
    return;
  }
  const COLORS = ['#818cf8','#38bdf8','#34d399','#fbbf24','#f87171','#fb923c','#a78bfa','#4ade80','#f472b6','#2dd4bf','#facc15','#fb7185'];
  const NOISE = '#6b7280';

  const labelMap = {};
  if (colorLabels) colorLabels.forEach((l, i) => { labelMap[l] = i; });
  const hasLabels = colorLabels && colorLabels.length > 0;

  const pointColor = plotData.map(p => {
    if (showNoise && p.cluster === -1 && !hasLabels) return NOISE;
    const li = hasLabels && p.label ? labelMap[p.label] : -1;
    return li >= 0 ? COLORS[li % COLORS.length] : (p.cluster >= 0 ? COLORS[p.cluster % COLORS.length] : accent);
  });

  const trace = {
    type: 'scatter3d', mode: 'markers',
    x: plotData.map(p => p.x),
    y: plotData.map(p => p.y),
    z: plotData.map(p => p.z || 0),
    marker: { size: 3.5, color: pointColor, opacity: 0.8 },
    hovertemplate: hasLabels ? '%{text}<extra></extra>' : 'Cluster %{marker.color}<extra></extra>',
    text: hasLabels ? plotData.map(p => p.label) : undefined,
  };

  const layout = {
    paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
    scene: {
      xaxis: { title: xLabel, gridcolor: 'rgba(128,128,128,0.2)', color: '#9ca3af' },
      yaxis: { title: yLabel, gridcolor: 'rgba(128,128,128,0.2)', color: '#9ca3af' },
      zaxis: { title: zLabel, gridcolor: 'rgba(128,128,128,0.2)', color: '#9ca3af' },
      bgcolor: 'rgba(30,30,46,0.6)',
    },
    margin: { l:0, r:0, t:0, b:0 },
    font: { color: '#9ca3af', size: 11 },
  };

  Plotly.newPlot(divId, [trace], layout, { responsive: true, displayModeBar: 'hover', scrollZoom: true });
}

        <div class="upload-zone-icon"><svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="3" y="3" width="38" height="38" rx="10" stroke="#818cf8" stroke-width="1.3" opacity="0.2"/><rect x="9" y="26" width="7" height="11" rx="2" fill="#818cf8" opacity="0.65"/><rect x="18.5" y="19" width="7" height="18" rx="2" fill="#38bdf8" opacity="0.65"/><rect x="28" y="22" width="7" height="15" rx="2" fill="#34d399" opacity="0.65"/><path d="M7 37h30" stroke="#64748b" stroke-width="1" stroke-linecap="round" opacity="0.35"/></svg></div>
        <div class="upload-zone-text">Drop a CSV file here, or click to browse</div>
        <div class="upload-zone-sub">Any tabular CSV — columns are auto-detected</div>
      </div>
      <div id="edaErr" class="err-state" style="margin-bottom:1rem"></div>
      <div id="edaResults"></div>
    </div>`;
}

function _edaDrop(e) {
  e.preventDefault();
  document.getElementById('edaUploadZone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) _runEDA(file);
}

function _edaFileSelected(input) {
  if (input.files[0]) _runEDA(input.files[0]);
}

async function _runEDA(file) {
  const errEl = document.getElementById('edaErr');
  const resEl = document.getElementById('edaResults');
  errEl.style.display = 'none';

  if (!EDA_API) {
    resEl.innerHTML = '';
    errEl.textContent = 'EDA service is not configured. Set ML_EDA_URL on the server.';
    errEl.style.display = 'block';
    return;
  }

  resEl.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text3)"><span class="spinner" style="border-color:var(--border2);border-top-color:var(--color-success);width:20px;height:20px;border-width:3px"></span><div style="margin-top:0.75rem;font-size:0.85rem">Analysing dataset…</div></div>';

  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch(`${EDA_API}/eda`, { method: 'POST', body: fd });
    if (!r.ok) {
      const msg = await r.json().catch(() => ({ detail: 'Upload failed' }));
      throw new Error(msg.detail || 'Upload failed');
    }
    const data = await r.json();
    _edaCurrentData     = data;
    _edaCurrentFilename = file.name;
    _edaCurrentFile     = file;
    resEl.innerHTML = _renderEDA(data, file.name);
    setTimeout(() => { _renderEDAPlots(data); _edaInitAnimations(data); }, 0);
  } catch (e) {
    resEl.innerHTML = '';
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function _cleanDrop(e) {

  const file = e.dataTransfer.files[0];
  if (file) _cleanReadFile(file);
}

function _cleanFileSelected(input) {
  if (input.files[0]) _cleanReadFile(input.files[0]);
}

async function _cleanReadFile(file) {
  _cleanCurrentFile = file;
  const optEl = document.getElementById('cleanOptions');
  if (!optEl) return;
  if (!EDA_API) {
    optEl.innerHTML = `<div class="eda-section-card eda-visible" style="margin-top:1.25rem;font-size:0.82rem;color:#f87171">EDA service not configured (ML_EDA_URL missing).</div>`;
    return;
  }
  const steps = ['Parsing CSV', 'Profiling columns', 'Computing statistics', 'Detecting outliers', 'Generating insights'];
  const stepPcts = [12, 35, 58, 78, 92];
  let stepIdx = 0;
  optEl.innerHTML = `
    <div style="padding:2.5rem 2rem;max-width:380px;margin:0 auto">
      <div style="font-size:0.78rem;font-weight:600;color:#22d3ee;margin-bottom:0.6rem;min-height:1.2em" id="_cp-label">${steps[0]}</div>
      <div style="height:6px;border-radius:6px;background:var(--border2);overflow:hidden;position:relative">
        <div id="_cp-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#0e7490,#22d3ee);border-radius:6px;transition:width 0.55s cubic-bezier(.4,0,.2,1)"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:0.4rem">
        <span style="font-size:0.62rem;color:var(--text3)">${file.name}</span>
        <span id="_cp-pct" style="font-size:0.62rem;color:var(--text3);font-variant-numeric:tabular-nums">0%</span>
      </div>
    </div>`;
  const setProgress = (pct, label) => {
    const bar = document.getElementById('_cp-bar');
    const lbl = document.getElementById('_cp-label');
    const pctEl = document.getElementById('_cp-pct');
    if (bar) bar.style.width = pct + '%';
    if (lbl && label) lbl.textContent = label;
    if (pctEl) pctEl.textContent = pct + '%';
  };
  setProgress(stepPcts[0], steps[0]);
  const iv = setInterval(() => {
    stepIdx = Math.min(stepIdx + 1, steps.length - 1);
    setProgress(stepPcts[stepIdx], steps[stepIdx]);
    if (stepIdx === steps.length - 1) clearInterval(iv);
  }, 900);
  try {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(`${EDA_API}/eda`, { method: 'POST', body: fd });
    clearInterval(iv);
    if (!r.ok) throw new Error('Analysis failed');
    setProgress(100, 'Done');
    await new Promise(res => setTimeout(res, 280));
    const d = await r.json();
    _buildCleanOptions(d, file.name);
  } catch (e) {
    clearInterval(iv);
    optEl.innerHTML = `<div class="eda-section-card eda-visible" style="margin-top:1.25rem;font-size:0.82rem;color:#f87171">Failed to analyse file: ${e.message}</div>`;
  }
}

function _buildCleanOptions(d, filename) {
  const optEl = document.getElementById('cleanOptions');
  if (!optEl) return;

  const stats    = d.stats    || {};
  const columns  = d.columns  || [];
  const readiness = d.readiness || [];
  const overview  = d.overview  || {};
  const rows      = overview.rows || 1;
  const duplicateRows = d.duplicate_rows || null;

  // Problem columns for drop section
  const dropCandidates = readiness
    .filter(r => r.verdict === 'fail')
    .map(r => ({ name: r.name, reason: r.reason }));

  // Columns with missing values (sorted desc)
  const missingCols = columns
    .filter(c => c.missing > 0)
    .sort((a, b) => b.missing_pct - a.missing_pct);

  // Numeric columns with outliers (sorted desc)
  const outlierCols = Object.entries(stats)
    .filter(([, s]) => s.outliers > 0)
    .sort(([, a], [, b]) => b.outliers - a.outliers)
    .map(([col, s]) => ({ name: col, count: s.outliers, pct: Math.round(s.outliers / rows * 1000) / 10 }));

  // Numeric columns with |skew| > 0.5 (sorted by abs skew desc)
  const skewedCols = Object.entries(stats)
    .filter(([, s]) => Math.abs(s.skew) > 0.5)
    .sort(([, a], [, b]) => Math.abs(b.skew) - Math.abs(a.skew))
    .map(([col, s]) => ({ name: col, skew: s.skew }));

  const maxOutlierPct  = outlierCols.length  ? outlierCols[0].pct                : 1;
  const maxMissingPct  = missingCols.length  ? missingCols[0].missing_pct         : 1;
  const maxAbsSkew     = skewedCols.length   ? Math.abs(skewedCols[0].skew)       : 1;

  const sectionTitle = (text, sub) => `
    <div style="font-size:0.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.6rem;display:flex;align-items:center;gap:0.5rem">
      ${text}${sub ? `<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text3);opacity:0.7">${sub}</span>` : ''}
    </div>`;

  const colRow = (checkClass, accentColor, checked, name, barPct, isNeg, valStr, leftAnchor = false) => {
    const pct48 = Math.min(barPct / 100 * 48, 48);
    const dir = isNeg ? 'neg' : 'pos';
    const fillStyle = leftAnchor
      ? `left:0%;width:0%;background:${accentColor}`
      : `${isNeg ? 'right:50%' : 'left:50%'};width:0%;background:${accentColor}`;
    return `
    <label style="display:grid;grid-template-columns:18px 160px 1fr 56px;align-items:center;gap:0.75rem;cursor:pointer;padding:0.25rem 0">
      <input type="checkbox" class="${checkClass}" value="${name}" ${checked ? 'checked' : ''} style="accent-color:${accentColor};width:14px;height:14px;flex-shrink:0">
      <div class="shap-feat-name" style="text-align:left" title="${name}">${name}</div>
      <div class="shap-bar-wrap">
        ${leftAnchor ? '' : '<div class="shap-bar-center"></div>'}
        <div class="shap-bar-fill ${dir}" data-pct="${pct48}" style="${fillStyle}"></div>
      </div>
      <span class="shap-val" style="color:${accentColor}">${valStr}</span>
    </label>`;
  };

  optEl.innerHTML = `
    <div class="eda-section-card eda-visible" style="margin-top:1.25rem;background:transparent;box-shadow:none">
      <div class="shap-header" style="margin:-1.35rem -1.35rem 1.25rem;border-radius:16px 16px 0 0">
        <div style="display:flex;flex-direction:column;gap:0.2rem">
          <span class="shap-title" style="display:flex;align-items:center;gap:0.45rem"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2 L14 7 L7 14 L2 14 L2 9 Z"/><path d="M9 2 L14 7"/><path d="M6 11 L11 6"/><path d="M2 14 L5 11"/></svg>Clean &amp; Export</span>
          <span style="font-size:0.75rem;font-weight:600;color:#22d3ee;opacity:0.9;letter-spacing:0.01em;display:flex;align-items:center;gap:0.3rem;overflow:hidden;max-width:340px" title="${filename}"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6z"/><path d="M9 2v4h4"/></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${filename}</span></span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:1.5rem">

        <!-- DEDUP -->
        <div>
          ${sectionTitle('Duplicate rows')}
          <label style="display:flex;align-items:center;gap:0.6rem;cursor:pointer">
            <input type="checkbox" id="sc-dedup" ${overview.duplicates > 0 ? 'checked' : ''} style="width:15px;height:15px;accent-color:var(--color-success)">
            <span style="font-size:0.82rem;color:var(--text)">Remove duplicates</span>
            <span style="padding:0.15rem 0.55rem;border-radius:20px;font-size:0.7rem;font-weight:700;background:${overview.duplicates > 0 ? 'rgba(251,191,36,0.15)' : 'rgba(52,211,153,0.12)'};color:${overview.duplicates > 0 ? '#fbbf24' : '#34d399'}">
              ${overview.duplicates ?? 0} found
            </span>
          </label>
          ${duplicateRows && duplicateRows.rows.length > 0 ? (() => {
            const cols = duplicateRows.columns;
            const dupRows = duplicateRows.rows;
            const totalDups = overview.duplicates;
            const showing = dupRows.length;
            const moreNote = totalDups > showing ? ` (showing first ${showing} of ${totalDups})` : '';
            const headerCells = cols.map(c =>
              `<th style="padding:0.3rem 0.6rem;font-size:0.65rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;border-bottom:1px solid var(--border2);text-align:left">${c}</th>`
            ).join('');
            const bodyRows = dupRows.map(r =>
              `<tr>${r.map(v =>
                `<td style="padding:0.28rem 0.6rem;font-size:0.72rem;color:var(--text2);white-space:nowrap;border-bottom:1px solid rgba(255,255,255,0.04)">${v === null ? '<span style="color:var(--text3);font-style:italic">null</span>' : v}</td>`
              ).join('')}</tr>`
            ).join('');
            return `
              <div style="margin-top:0.55rem">
                <button onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.textContent=this.textContent.includes('Show')?'Hide duplicate rows':'Show duplicate rows'" style="font-size:0.72rem;color:#38bdf8;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px">Show duplicate rows${moreNote}</button>
                <div style="display:none;margin-top:0.5rem;overflow-x:auto;border-radius:8px;border:1px solid var(--border2);background:var(--bg-card)">
                  <table style="border-collapse:collapse;width:max-content;min-width:100%">
                    <thead><tr>${headerCells}</tr></thead>
                    <tbody>${bodyRows}</tbody>
                  </table>
                </div>
              </div>`;
          })() : ''}
        </div>

        <!-- DROP COLUMNS -->
        <div>
          ${sectionTitle('Columns to drop', '— flagged as problematic')}
          ${dropCandidates.length === 0
            ? `<div style="font-size:0.75rem;color:var(--text3)">No problematic columns detected</div>`
            : `<div style="display:flex;flex-direction:column;gap:0.4rem" id="sc-dropcol-list">
                ${dropCandidates.map(c => `
                  <label style="display:grid;grid-template-columns:18px 160px 1fr;align-items:center;gap:0.75rem;cursor:pointer;padding:0.25rem 0">
                    <input type="checkbox" class="sc-dropcol" value="${c.name}" style="accent-color:#f87171;width:14px;height:14px">
                    <div class="shap-feat-name" style="text-align:left;color:#f87171" title="${c.name}">${c.name}</div>
                    <span style="font-size:0.68rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.reason}</span>
                  </label>`).join('')}
              </div>`
          }
          <div style="margin-top:0.6rem;display:flex;align-items:center;gap:0.5rem">
            <select id="sc-addcol" style="padding:0.3rem 0.5rem;border-radius:8px;border:1px solid var(--border2);background:var(--bg-card);color:var(--text2);font-size:0.75rem;max-width:200px">
              <option value="">+ Add any column to drop</option>
              ${columns.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
            </select>
            <button onclick="_scAddDropCol()" style="padding:0.2rem 0.55rem;border-radius:8px;font-size:0.72rem;font-weight:600;cursor:pointer;background:rgba(248,113,113,0.12);color:#f87171;border:1px solid rgba(248,113,113,0.3)">Add</button>
          </div>
        </div>

        <!-- IMPUTATION -->
        <div>
          ${sectionTitle('Missing value imputation')}
          ${(() => {
            if (missingCols.length === 0) return `<div style="font-size:0.75rem;color:var(--text3)">No missing values detected</div>`;
            const missingNum = missingCols.filter(c => c.is_numeric);
            const missingCat = missingCols.filter(c => !c.is_numeric);
            const dropStyle = 'padding:0.4rem 0.6rem;border-radius:8px;border:1px solid var(--border2);background:var(--bg-card);color:var(--text2);font-size:0.8rem;width:100%;max-width:280px';
            const labelStyle = 'font-size:0.68rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.3rem';
            return `
              <div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.75rem">
                ${missingCols.map(c => {
                  const mc = c.missing_pct > 20 ? '#f87171' : c.missing_pct > 5 ? '#fbbf24' : '#38bdf8';
                  return colRow('sc-imputecol', mc, c.missing_pct > 5, c.name, c.missing_pct / maxMissingPct * 100, false, c.missing_pct + '%', true);
                }).join('')}
              </div>
              <div style="display:flex;flex-direction:column;gap:0.85rem">
                ${missingNum.length ? `
                <div>
                  <div style="${labelStyle}">Numeric columns</div>
                  <select id="sc-impute-num" onchange="_scImpute_onChange()" style="${dropStyle}">
                    <option value="none">None — leave as-is</option>
                    <option value="median" selected>Median</option>
                    <option value="mean">Mean</option>
                    <option value="knn">KNN (k=5)</option>
                    <option value="mice">MICE / IterativeImputer</option>
                    <option value="interpolate">Interpolate</option>
                    <option value="ffill">Forward fill</option>
                    <option value="bfill">Backward fill</option>
                    <option value="constant">Constant value</option>
                  </select>
                  <div id="sc-knn-opts" style="display:none;margin-top:0.5rem;align-items:center;gap:0.5rem">
                    <label style="font-size:0.75rem;color:var(--text3)">k:</label>
                    <input type="number" id="sc-knn-k" value="5" min="1" max="20" style="width:55px;padding:0.25rem;border-radius:6px;border:1px solid var(--border2);background:var(--bg-card);color:var(--text);font-size:0.8rem">
                  </div>
                  <div id="sc-const-num-opts" style="display:none;margin-top:0.5rem;align-items:center;gap:0.5rem">
                    <label style="font-size:0.75rem;color:var(--text3)">Fill value:</label>
                    <input type="number" id="sc-const-num-val" value="0" style="width:80px;padding:0.25rem;border-radius:6px;border:1px solid var(--border2);background:var(--bg-card);color:var(--text);font-size:0.8rem">
                  </div>
                  <div id="sc-slow-warn" style="display:none;margin-top:0.4rem;font-size:0.72rem;color:#fbbf24">⚠ This method can be slow on large datasets.</div>
                </div>` : ''}
                ${missingCat.length ? `
                <div>
                  <div style="${labelStyle}">Categorical columns</div>
                  <select id="sc-impute-cat" onchange="_scImpute_onChange()" style="${dropStyle}">
                    <option value="none">None — leave as-is</option>
                    <option value="mode" selected>Mode (most frequent)</option>
                    <option value="constant">Constant value</option>
                    <option value="ffill">Forward fill</option>
                    <option value="bfill">Backward fill</option>
                  </select>
                  <div id="sc-const-cat-opts" style="display:none;margin-top:0.5rem;align-items:center;gap:0.5rem">
                    <label style="font-size:0.75rem;color:var(--text3)">Fill value:</label>
                    <input type="text" id="sc-const-cat-val" value="Unknown" style="width:100px;padding:0.25rem;border-radius:6px;border:1px solid var(--border2);background:var(--bg-card);color:var(--text);font-size:0.8rem">
                  </div>
                </div>` : ''}
              </div>`;
          })()}
        </div>

        <!-- OUTLIER REMOVAL -->
        <div>
          ${sectionTitle('Outlier removal', '— check columns to clean')}
          ${outlierCols.length === 0
            ? `<div style="font-size:0.75rem;color:var(--text3)">No outliers detected</div>`
            : `<div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.75rem">
                ${outlierCols.map(c => colRow('sc-outliercol', '#fbbf24', c.pct > 5, c.name, c.pct / maxOutlierPct * 100, false, c.pct + '%', true)).join('')}
              </div>
              <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
                <select id="sc-outlier-method" onchange="_scOutlier_onChange()" style="padding:0.3rem 0.5rem;border-radius:8px;border:1px solid var(--border2);background:var(--bg-card);color:var(--text2);font-size:0.78rem">
                  <option value="iqr">IQR (multiplier, default 1.5)</option>
                  <option value="zscore">Z-score (std devs, default 3)</option>
                  <option value="winsorize">Winsorize (percentile%, default 5)</option>
                </select>
                <div style="display:flex;align-items:center;gap:0.4rem">
                  <label style="font-size:0.75rem;color:var(--text3)">Threshold:</label>
                  <input type="number" id="sc-outlier-thresh" value="1.5" step="0.1" min="0" style="width:65px;padding:0.25rem;border-radius:6px;border:1px solid var(--border2);background:var(--bg-card);color:var(--text);font-size:0.8rem">
                </div>
              </div>`
          }
        </div>

        <!-- POWER TRANSFORM -->
        <div>
          ${sectionTitle('Power transform (Yeo-Johnson)', '— check skewed columns')}
          ${skewedCols.length === 0
            ? `<div style="font-size:0.75rem;color:var(--text3)">No significantly skewed columns</div>`
            : `<div style="display:flex;flex-direction:column;gap:0.5rem">
                ${skewedCols.map(c => {
                  const abs = Math.abs(c.skew);
                  const col = abs > 2 ? '#f87171' : abs > 1 ? '#fbbf24' : '#a78bfa';
                  return colRow('sc-skewtcol', col, abs > 1, c.name, abs / maxAbsSkew * 100, c.skew < 0, (c.skew > 0 ? '+' : '') + c.skew);
                }).join('')}
              </div>`
          }
        </div>

        <!-- SUBMIT -->
        <div style="padding-top:0.75rem;border-top:1px solid var(--border)">
          <button onclick="_submitClean()" id="sc-btn" style="padding:0.5rem 1.5rem;border-radius:20px;font-size:0.85rem;font-weight:700;cursor:pointer;background:rgba(34,211,238,0.15);color:#22d3ee;border:1px solid rgba(34,211,238,0.35);transition:all 0.2s">
            Clean &amp; Download CSV
          </button>
          <div id="sc-progress" style="display:none;margin-top:0.75rem;max-width:340px">

async function _submitClean() {
  if (!_cleanCurrentFile) return;
  if (!EDA_API) {
    const e = document.getElementById('sc-err');
    if (e) { e.textContent = 'EDA service not configured (ML_EDA_URL missing).'; e.style.display = 'block'; }
    return;
  }
  const btn        = document.getElementById('sc-btn');
  const progressEl = document.getElementById('sc-progress');
  const barEl      = document.getElementById('sc-progress-bar');
  const pctEl      = document.getElementById('sc-progress-pct');
  const labelEl    = document.getElementById('sc-progress-label');
  const errEl      = document.getElementById('sc-err');
  const summaryEl  = document.getElementById('sc-summary');

  const setProgress = (pct, label) => {
    if (barEl)   barEl.style.width = pct + '%';
    if (pctEl)   pctEl.textContent = pct + '%';
    if (labelEl && label) labelEl.textContent = label;
  };

  btn.disabled = true;
  progressEl.style.display = 'block';
  errEl.style.display = 'none';
  summaryEl.style.display = 'none';
  setProgress(5, 'Uploading…');

  // Fake progress — crawls to 85% while waiting for server
  const steps = [[15,'Uploading…'],[35,'Cleaning…'],[55,'Imputing…'],[72,'Removing outliers…'],[85,'Finalising…']];
  let si = 0;
  const iv = setInterval(() => {
    if (si < steps.length) { setProgress(...steps[si]); si++; }
    else clearInterval(iv);
  }, 600);

  const dropCols    = [...document.querySelectorAll('.sc-dropcol:checked')].map(el => el.value);
  const imputeCols  = [...document.querySelectorAll('.sc-imputecol:checked')].map(el => el.value);
  const outlierCols = [...document.querySelectorAll('.sc-outliercol:checked')].map(el => el.value);
  const skewCols    = [...document.querySelectorAll('.sc-skewtcol:checked')].map(el => el.value);
  const numMethod   = document.getElementById('sc-impute-num')?.value || 'none';
  const catMethod   = document.getElementById('sc-impute-cat')?.value || 'none';

  const config = {
    dedup: document.getElementById('sc-dedup')?.checked ?? true,
    drop_cols: dropCols,
    imputation: {
      numeric_method: numMethod,
      cat_method:     catMethod,
      cols: imputeCols.length ? imputeCols : null,
      knn_k: parseInt(document.getElementById('sc-knn-k')?.value || '5'),
      constant_value:     numMethod === 'constant' ? (document.getElementById('sc-const-num-val')?.value ?? '0') : null,
      cat_constant_value: catMethod === 'constant' ? (document.getElementById('sc-const-cat-val')?.value ?? 'Unknown') : null,
    },
    outliers: {
      enabled: outlierCols.length > 0,
      cols: outlierCols,
      method: document.getElementById('sc-outlier-method')?.value || 'iqr',
      threshold: parseFloat(document.getElementById('sc-outlier-thresh')?.value || '1.5'),
    },
    power_transform: { enabled: skewCols.length > 0, cols: skewCols },
  };

  try {
    const fd = new FormData();
    fd.append('file', _cleanCurrentFile);
    fd.append('config', JSON.stringify(config));
    const r = await fetch(`${EDA_API}/eda/clean`, { method: 'POST', body: fd });
    clearInterval(iv);
    if (!r.ok) {
      const msg = await r.json().catch(() => ({ detail: 'Request failed' }));
      throw new Error(msg.detail || 'Request failed');
    }
    setProgress(95, 'Preparing download…');
    const result = await r.json();
    setProgress(100, 'Done');
    const s = result.summary;
    summaryEl.style.display = 'block';
    summaryEl.innerHTML = `
      <div style="font-size:0.82rem;font-weight:700;color:#22d3ee;margin-bottom:0.6rem">Done — downloading now</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.5rem;font-size:0.78rem;color:var(--text2)">
        <div>Rows: <strong>${s.rows_before.toLocaleString()} → ${s.rows_after.toLocaleString()}</strong>${s.rows_removed > 0 ? ` <span style="color:#34d399">(−${s.rows_removed})</span>` : ''}</div>
        <div>Columns: <strong>${s.cols_before} → ${s.cols_after}</strong>${s.cols_dropped.length ? ` <span style="color:#f87171">(dropped: ${s.cols_dropped.join(', ')})</span>` : ''}</div>
        <div>Missing: <strong>${s.missing_before.toLocaleString()} → ${s.missing_after.toLocaleString()}</strong></div>
        ${s.outliers_removed > 0 ? `<div>Outliers removed: <strong style="color:#fbbf24">${s.outliers_removed.toLocaleString()}</strong></div>` : ''}
      </div>`;
    const bytes = atob(result.csv);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    const blob = new Blob([arr], { type: 'text/csv' });
    _lastCleanedFile = new File([blob], result.filename, { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = result.filename; a.click();
    URL.revokeObjectURL(url);
    summaryEl.innerHTML += `
      <div id="cleanAutoMLPrompt" style="margin-top:1rem;padding:0.85rem 1rem;border:1px solid var(--border2);border-radius:8px;background:var(--bg-input)">
        <div style="font-size:0.82rem;font-weight:600;color:var(--active-accent,#818cf8);margin-bottom:0.65rem">Would you like to train a model with this cleaned data using AutoML?</div>
        <div style="display:flex;gap:0.6rem;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="_launchAutoMLFromClean()" style="font-size:0.82rem;padding:0.45rem 1.1rem">Yes, Train with AutoML</button>
          <button class="btn btn-clear" onclick="document.getElementById('cleanAutoMLPrompt').remove()" style="font-size:0.82rem;padding:0.45rem 1.1rem">No, Stay Here</button>
        </div>
      </div>`;
    await new Promise(res => setTimeout(res, 800));
  } catch (e) {
    clearInterval(iv);
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    progressEl.style.display = 'none';
    setProgress(0, 'Cleaning…');
  }
}

  const knnK = parseInt(document.getElementById('eda-clean-knn-k')?.value || '5');
  const constVal = document.getElementById('eda-clean-const-val')?.value ?? '0';
  const outlierEnabled = document.getElementById('eda-clean-outlier-enabled').checked;
  const outlierMethod = document.getElementById('eda-clean-outlier-method')?.value || 'iqr';
  const outlierThresh = parseFloat(document.getElementById('eda-clean-outlier-thresh')?.value || '1.5');

  const idColEls = document.querySelectorAll('.eda-clean-idcol:checked');

    imputation: {
      method: impMethod,
      constant_value: impMethod === 'constant' ? (isNaN(Number(constVal)) ? constVal : Number(constVal)) : null,
      knn_k: knnK,
    },
    outliers: { enabled: outlierEnabled, method: outlierMethod, threshold: outlierThresh },
    power_transform: document.getElementById('eda-clean-power-transform').checked,
  };

  try {
    const fd = new FormData();
    fd.append('file', _edaCurrentFile);
    fd.append('config', JSON.stringify(config));
    const r = await fetch(`${EDA_API}/eda/clean`, { method: 'POST', body: fd });
    if (!r.ok) {
      const msg = await r.json().catch(() => ({ detail: 'Clean failed' }));

      <div style="font-size:0.82rem;font-weight:700;color:#34d399;margin-bottom:0.6rem">Cleaning complete</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0.5rem;font-size:0.78rem;color:var(--text2)">
        <div>Rows: <strong>${s.rows_before.toLocaleString()} → ${s.rows_after.toLocaleString()}</strong>${s.rows_removed > 0 ? ` <span style="color:#34d399">(−${s.rows_removed})</span>` : ''}</div>
        <div>Columns: <strong>${s.cols_before} → ${s.cols_after}</strong>${s.cols_dropped.length ? ` <span style="color:#f87171">(dropped: ${s.cols_dropped.join(', ')})</span>` : ''}</div>
        <div>Missing: <strong>${s.missing_before.toLocaleString()} → ${s.missing_after.toLocaleString()}</strong></div>
        ${s.outliers_removed > 0 ? `<div>Outliers removed: <strong style="color:#fbbf24">${s.outliers_removed.toLocaleString()}</strong></div>` : ''}
      </div>`;

    // Trigger CSV download
    const bytes = atob(result.csv);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    const blob = new Blob([arr], { type: 'text/csv' });
    _lastCleanedFile = new File([blob], result.filename, { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = result.filename; a.click();
    URL.revokeObjectURL(url);
    summaryEl.innerHTML += `
      <div id="cleanAutoMLPrompt" style="margin-top:1rem;padding:0.85rem 1rem;border:1px solid var(--border2);border-radius:8px;background:var(--bg-input)">
        <div style="font-size:0.82rem;font-weight:600;color:var(--active-accent,#818cf8);margin-bottom:0.65rem">Would you like to train a model with this cleaned data using AutoML?</div>
        <div style="display:flex;gap:0.6rem;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="_launchAutoMLFromClean()" style="font-size:0.82rem;padding:0.45rem 1.1rem">Yes, Train with AutoML</button>
          <button class="btn btn-clear" onclick="document.getElementById('cleanAutoMLPrompt').remove()" style="font-size:0.82rem;padding:0.45rem 1.1rem">No, Stay Here</button>
        </div>
      </div>`;
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}

function _renderEDA(d, filename) {
  const missingColor = d.overview.missing_pct > 10 ? '#f87171' : d.overview.missing_pct > 0 ? '#fbbf24' : '#34d399';
  const qScore = d.quality_score ?? 100;
  const qColor = qScore >= 80 ? '#34d399' : qScore >= 60 ? '#fbbf24' : '#f87171';

  // Quality ring SVG — arc draws itself via JS after render
  const R = 22, C = 2 * Math.PI * R, startScore = 0;
  const qualityRing = `
    <div class="eda-quality-ring">
      <svg width="54" height="54" viewBox="0 0 54 54">
        <circle class="eda-ring-track" cx="27" cy="27" r="${R}"/>
        <circle class="eda-ring-fill" id="eda-ring-arc" cx="27" cy="27" r="${R}"
          stroke="${qColor}"
          stroke-dasharray="${C}"

          <thead><tr>${d.sample.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${d.sample.rows.map(row => `<tr>${row.map(v =>
            `<td>${v === null ? '<span style="color:var(--text3);font-style:italic">NaN</span>' : v}</td>`
          ).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    </div>` : '';

  const colsHTML = `
    <div class="eda-section-card" id="eda-s-columns">
      <div class="eda-section-title">🗂 Columns
        <span style="font-weight:400;color:var(--text3);font-size:0.7rem">${d.columns.length} total · missing %</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.5rem">
        ${d.columns.map(c => {
          const pct = c.missing_pct;
          const barColor = pct > 20 ? '#f87171' : pct > 5 ? '#fbbf24' : pct > 0 ? '#38bdf8' : '#34d399';
          const typeColor = c.is_numeric ? '#818cf8' : '#34d399';
          return `
          <div>
            <div style="display:grid;grid-template-columns:180px 1fr 52px;align-items:center;gap:0.75rem">
              <div style="display:flex;align-items:center;gap:0.35rem;overflow:hidden;justify-content:flex-end">
                <span style="font-size:0.58rem;padding:0.1rem 0.35rem;border-radius:10px;background:${typeColor}22;color:${typeColor};font-weight:700;flex-shrink:0">${c.is_numeric ? 'num' : 'cat'}</span>
                <span style="font-size:0.75rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${c.name}">${c.name}</span>
              </div>
              <div style="height:8px;border-radius:4px;background:var(--border2);overflow:hidden">
                <div style="height:100%;width:${Math.min(100,pct)}%;background:${barColor};border-radius:4px;transition:width 0.5s ease"></div>
              </div>
              <span style="font-size:0.72rem;font-weight:700;color:${pct > 0 ? barColor : 'var(--text3)'};text-align:right;font-variant-numeric:tabular-nums">${pct}%</span>
            </div>
            <div style="display:grid;grid-template-columns:180px 1fr 52px;gap:0.75rem;margin-top:1px">
              <span style="font-size:0.6rem;color:var(--text3);text-align:right">${c.dtype}</span>
              <span style="font-size:0.6rem;color:var(--text3)">${pct === 0 ? 'complete' : `${c.missing} missing`}</span>
              <span style="font-size:0.6rem;color:var(--text3);text-align:right">${c.nunique}u</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;

  const numCols = Object.keys(d.stats);
  const _statRows = d.overview.rows || 1;
  const _outlierCols2 = numCols.filter(c => d.stats[c].outliers > 0).sort((a,b) => d.stats[b].outliers - d.stats[a].outliers);
  const _skewCols2    = [...numCols].sort((a,b) => Math.abs(d.stats[b].skew) - Math.abs(d.stats[a].skew));
  const _maxOutliers2 = _outlierCols2.length ? d.stats[_outlierCols2[0]].outliers : 1;
  const _maxSkew2     = _skewCols2.length ? Math.abs(d.stats[_skewCols2[0]].skew) || 1 : 1;

  const _barRow = (name, barPct, isNeg, accentColor, valStr) => {
    const pct48 = Math.min(barPct / 100 * 48, 48);
    const dir = isNeg ? 'neg' : 'pos';
    return `
    <div class="shap-row">
      <div class="shap-feat-name" title="${name}">${name}</div>
      <div class="shap-bar-wrap">
        <div class="shap-bar-center"></div>
        <div class="shap-bar-fill ${dir}" data-pct="${pct48}" style="${isNeg ? 'right:50%' : 'left:50%'};width:0%;background:${accentColor}"></div>
      </div>
      <span class="shap-val" style="color:${accentColor}">${valStr}</span>
    </div>`;
  };

  const statsHTML = numCols.length ? `
    <div class="eda-section-card" id="eda-s-stats">
      <div class="eda-section-title">📊 Statistics</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:1.5rem">
        <div>
          <div style="font-size:0.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.6rem">Outliers (IQR)</div>
          ${_outlierCols2.length
            ? _outlierCols2.map(col => {
                const pct = Math.round(d.stats[col].outliers / _statRows * 1000) / 10;
                return _barRow(col, d.stats[col].outliers / _maxOutliers2 * 100, false, '#fbbf24', pct + '%');
              }).join('')
            : `<div style="font-size:0.75rem;color:var(--text3)">No outliers detected</div>`}
        </div>
        <div>
          <div style="font-size:0.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.6rem">Skewness</div>
          ${_skewCols2.map(col => {
              const s = d.stats[col];
              const abs = Math.abs(s.skew);
              const sc = abs > 2 ? '#f87171' : abs > 1 ? '#fbbf24' : 'var(--active-accent)';
              const sign = s.skew >= 0 ? '+' : '';
              return _barRow(col, abs / _maxSkew2 * 100, s.skew < 0, sc, sign + s.skew);
            }).join('')}
        </div>
      </div>
      <div style="font-size:0.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.6rem">Full detail</div>
      <div style="overflow-x:auto">
        <table class="eda-table">
          <thead><tr>
            <th>Column</th>
            <th style="text-align:right">Mean</th><th style="text-align:right">Median</th>
            <th style="text-align:right">Std</th><th style="text-align:right">Min</th>
            <th style="text-align:right">Max</th>
            <th style="text-align:right">Skew</th><th style="text-align:right">Kurtosis</th>
            <th style="text-align:right">Outliers</th>
          </tr></thead>
          <tbody>${numCols.map(col => {
            const s = d.stats[col];
            const skewColor = Math.abs(s.skew) > 2 ? '#f87171' : Math.abs(s.skew) > 1 ? '#fbbf24' : 'var(--text2)';
            return `<tr>
              <td style="font-weight:600;color:var(--text)">${col}</td>
              <td style="text-align:right">${s.mean}</td>
              <td style="text-align:right">${s.median}</td>
              <td style="text-align:right">${s.std}</td>
              <td style="text-align:right">${s.min}</td>
              <td style="text-align:right">${s.max}</td>
              <td style="text-align:right;color:${skewColor}">${s.skew}</td>
              <td style="text-align:right">${s.kurtosis}</td>
              <td style="text-align:right;color:${s.outliers > 0 ? '#fbbf24' : 'var(--text3)'}">${s.outliers}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>` : '';

  const lvSet = new Set(d.low_variance_cols || []);
  const distKeys = Object.keys(d.distributions);
  const distHTML = distKeys.length ? `
    <div class="eda-section-card" id="eda-s-distributions">
      <div class="eda-section-title">📈 Distributions</div>
      <div class="eda-dist-grid">${distKeys.map((col, i) => {
        const isNum = d.distributions[col].type === 'histogram';
        const isLV  = lvSet.has(col);
        return `<div class="eda-dist-card">
          <div class="eda-dist-title">${col}
            <span style="font-size:0.58rem;color:var(--text3);margin-left:4px">${isNum ? 'numeric' : 'categorical'}</span>
            ${isLV ? '<span style="font-size:0.58rem;color:#fbbf24;margin-left:4px;font-weight:700">⚠ low variance</span>' : ''}
          </div>
          <div id="eda-dist-${i}" class="eda-dist-plot"></div>
        </div>`;
      }).join('')}
      </div>
    </div>` : '';

  const boxHTML = numCols.length ? `
    <div class="eda-section-card" id="eda-s-boxplots">
      <div class="eda-section-title">📦 Box Plots
        <span style="font-weight:400;color:var(--text3);font-size:0.7rem">IQR fences · outliers as dots</span>
      </div>
      <div id="eda-box-plot"></div>
    </div>` : '';

  const miHTML = (d.mi && d.mi.labels.length > 1) ? `
    <div class="eda-section-card" id="eda-s-mi">
      <div class="eda-section-title">Mutual Information
        <span style="font-weight:400;color:var(--text3);font-size:0.7rem">normalized 0–1 · captures non-linear + categorical relationships</span>
      </div>
      <div id="eda-mi-hm" class="eda-corr-plot"></div>
    </div>` : '';

  const pcaHTML = d.pca ? (() => {
    const ev = d.pca.explained_variance;
    const catOpts = (d.pca.cat_cols || []).map(c => `<option value="${c}"${c === d.pca.color_col ? ' selected' : ''}>${c}</option>`).join('');
    const colorDropdown = catOpts ? `
      <div style="margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem">
        <span style="font-size:0.75rem;color:var(--text3)">Color by:</span>
        <select id="eda-pca-color" onchange="_recolorPCA(this.value)"
          style="background:var(--bg-card,#1e293b);border:1px solid rgba(255,255,255,0.14);border-radius:6px;color:var(--text,#e2e8f0);font-size:0.75rem;padding:0.25rem 0.6rem;cursor:pointer;outline:none">
          <option value="">— none —</option>
          ${catOpts}
        </select>
      </div>` : '';
    return `
    <div class="eda-section-card" id="eda-s-pca">
      <div class="eda-section-title">PCA 3D Scatter
        <span style="font-weight:400;color:var(--text3);font-size:0.7rem">PC1 ${ev[0]}% · PC2 ${ev[1]}% · PC3 ${ev[2]}% explained variance</span>
      </div>
      ${colorDropdown}
      <div id="eda-pca-3d" style="height:480px;background:rgba(8,15,30,0.4);border-radius:10px"></div>
    </div>`;
  })() : '';

  const splomHTML = d.splom ? (() => {
    const colorOpts = Object.keys(d.splom.color_map || {})
      .map(c => `<option value="${c}"${c === d.splom.color_col ? ' selected' : ''}>${c}</option>`).join('');
    const colorDropdown = colorOpts ? `
      <div style="margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem">
        <span style="font-size:0.75rem;color:var(--text3)">Color by:</span>
        <select id="eda-splom-color" onchange="_recolorSPLOM(this.value)"
          style="background:var(--bg-card,#1e293b);border:1px solid rgba(255,255,255,0.14);border-radius:6px;color:var(--text,#e2e8f0);font-size:0.75rem;padding:0.25rem 0.6rem;cursor:pointer;outline:none">
          <option value="">— none —</option>
          ${colorOpts}
        </select>
      </div>` : '';
    return `
    <div class="eda-section-card" id="eda-s-splom">
      <div class="eda-section-title">Scatter Plot Matrix
        <span style="font-weight:400;color:var(--text3);font-size:0.7rem">${d.splom.cols.length} features · ${d.splom.n} samples · pairwise relationships</span>
      </div>
      ${colorDropdown}
      <div id="eda-splom-plot" style="min-height:500px"></div>
    </div>`;
  })() : '';

  const corrHTML = (d.correlations && d.correlations.labels.length > 1) ? `
    <div class="eda-section-card" id="eda-s-correlations">
      <div class="eda-section-title">🔥 Correlation Heatmap
        <span style="font-weight:400;color:var(--text3);font-size:0.7rem">Pearson · blue = positive · red = negative</span>
      </div>
      <div id="eda-corr-hm" class="eda-corr-plot"></div>
    </div>` : '';

  return overviewHTML + narrativeHTML + readinessHTML + insightsHTML + navHTML + sampleHTML + colsHTML + statsHTML + distHTML + boxHTML + miHTML + pcaHTML + splomHTML + corrHTML;
}

function _renderEDAPlots(d) {
  if (typeof Plotly === 'undefined') return;
  const cs  = getComputedStyle(document.documentElement);
  const tc  = cs.getPropertyValue('--text3').trim()   || '#64748b';
  const gc  = cs.getPropertyValue('--border').trim()  || 'rgba(255,255,255,0.07)';
  const cfg = { displayModeBar: 'hover', scrollZoom: true, responsive: true, modeBarButtonsToRemove: ['select2d', 'lasso2d'] };
  const baseLayout = {
    paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
    font: { color: tc, size: 10 }, showlegend: false,
    margin: { l: 35, r: 5, t: 5, b: 40 }, bargap: 0.05,
    doubleclick: 'reset+autosize',
    xaxis: { gridcolor: gc, zerolinecolor: gc, tickfont: { size: 8 } },
    yaxis: { gridcolor: gc, zerolinecolor: gc, tickfont: { size: 9 } },
  };

  const distKeys = Object.keys(d.distributions);
  distKeys.forEach((col, i) => {
    const el = document.getElementById(`eda-dist-${i}`);
    if (!el) return;
    const dist = d.distributions[col];
    const isHist = dist.type === 'histogram';
    const rawVals = d.stats[col]?.raw_vals;

    if (isHist && rawVals && rawVals.length > 0) {
      // Use Plotly's native histogram type with raw values — much better auto-binning
      // than numpy's fixed-width bins which produce giant bars for clustered data
      Plotly.newPlot(el, [{
        type: 'histogram', x: rawVals, autobinx: true,
        marker: { color: '#34d399', opacity: 0.82, line: { color: 'rgba(52,211,153,0.3)', width: 0.5 } },
        hovertemplate: 'Range: %{x}<br>Count: %{y}<extra></extra>',
      }], { ...baseLayout, bargap: 0.04 }, cfg);
    } else {
      // Categorical bar chart (top-10 values)
      Plotly.newPlot(el, [{
        type: 'bar',
        x: isHist ? dist.bins : dist.labels,
        y: dist.counts,
        marker: { color: '#a78bfa', opacity: 0.82 },
        hovertemplate: '%{x}: %{y}<extra></extra>',
      }], { ...baseLayout }, cfg);
    }
  });

  const boxEl = document.getElementById('eda-box-plot');
  if (boxEl) {
    const numCols = Object.keys(d.stats).filter(c => d.stats[c].raw_vals);
    if (numCols.length) {
      const traces = numCols.map(col => ({
        type: 'box', name: col,
        y: d.stats[col].raw_vals,
        boxpoints: 'outliers',
        marker: { color: '#34d399', size: 3, opacity: 0.7 },
        line:   { color: '#34d399', width: 1.5 },
        fillcolor: 'rgba(52,211,153,0.12)',
      }));
      Plotly.newPlot(boxEl, traces, {
        paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
        font: { color: tc, size: 10 }, showlegend: false,
        height: 340, margin: { l: 50, r: 20, t: 10, b: 90 },
        xaxis: { tickangle: -35, tickfont: { size: 9 }, gridcolor: gc },
        yaxis: { gridcolor: gc, zerolinecolor: gc },
      }, cfg);
    }
  }

  if (d.mi && d.mi.labels.length > 1) {
    const miEl = document.getElementById('eda-mi-hm');
    if (miEl) {
      const { labels, matrix } = d.mi;
      const miCellSize = labels.length > 10 ? 38 : 48;
      const miH = Math.min(780, Math.max(420, labels.length * miCellSize + 160));
      Plotly.newPlot(miEl, [{
        type: 'heatmap', z: matrix, x: labels, y: labels,
        colorscale: 'Viridis', zmin: 0, zmax: 1,
        text: matrix.map(r => r.map(v => v === null ? '' : v.toFixed(2))),
        texttemplate: '%{text}', textfont: { size: labels.length > 10 ? 7 : 9, color: '#ffffff' },
        showscale: true,
        colorbar: { thickness: 12, len: 0.85, tickfont: { size: 9, color: tc }, title: { text: 'MI', font: { size: 9, color: tc } } },
      }], {
        paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
        font: { color: tc, size: 10 }, showlegend: false,
        margin: { l: 90, r: 60, t: 20, b: 120 },
        height: miH,
        xaxis: { tickangle: -45, tickfont: { size: 9 }, gridcolor: gc },
        yaxis: { tickfont: { size: 9 }, gridcolor: gc },
      }, cfg);
    }
  }

  if (d.pca) {
    const pcaEl = document.getElementById('eda-pca-3d');
    if (pcaEl) {
      window._edaPCAData = d.pca;
      const initColorVals = (d.pca.cat_color_map && d.pca.color_col)
        ? d.pca.cat_color_map[d.pca.color_col] || null
        : null;
      _drawPCA3D(d.pca, d.pca.color_col, initColorVals, cfg, tc);
    }
  }

  if (d.splom) {
    const initColorVals = (d.splom.color_map && d.splom.color_col)
      ? d.splom.color_map[d.splom.color_col] || null : null;
    _drawSPLOM(d.splom, d.splom.color_col, initColorVals, cfg, tc, gc);
  }

  if (d.correlations && d.correlations.labels.length > 1) {
    const el = document.getElementById('eda-corr-hm');
    if (!el) return;
    const { labels, matrix } = d.correlations;
    const corrCellSize = labels.length > 10 ? 38 : 48;
    const corrH = Math.min(780, Math.max(420, labels.length * corrCellSize + 160));
    Plotly.newPlot(el, [{
      type: 'heatmap', z: matrix, x: labels, y: labels,
      colorscale: 'RdBu', reversescale: true, zmid: 0, zmin: -1, zmax: 1,
      text: matrix.map(r => r.map(v => v !== null ? v.toFixed(2) : '')),
      texttemplate: '%{text}', textfont: { size: labels.length > 10 ? 7 : 9, color: '#ffffff' },
      showscale: true,
      colorbar: { thickness: 12, len: 0.85, tickfont: { size: 9, color: tc } },
    }], {
      paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
      font: { color: tc, size: 10 }, showlegend: false,
      margin: { l: 90, r: 60, t: 20, b: 120 },
      height: corrH,
      xaxis: { tickangle: -45, tickfont: { size: 9 }, gridcolor: gc },
      yaxis: { tickfont: { size: 9 }, gridcolor: gc },
    }, cfg);
  }
}

// ── PCA 3D helpers ───────────────────────────────────────────
function _drawPCA3D(pca, colorCol, colorVals, cfg, tc) {
  const pcaEl = document.getElementById('eda-pca-3d');
  if (!pcaEl || typeof Plotly === 'undefined') return;
  const ev = pca.explained_variance;
  const xs = pca.coords.map(r => r[0]);
  const ys = pca.coords.map(r => r[1]);
  const zs = pca.coords.map(r => r[2]);

  // Plotly scatter3d needs numeric color values — convert strings to integer codes
  let colorData, hoverText, showScale, colorbarCfg;
  if (colorVals && colorVals.length > 0) {
    const unique = [...new Set(colorVals)];
    colorData  = colorVals.map(v => unique.indexOf(v));
    hoverText  = colorVals;
    showScale  = true;
    colorbarCfg = {
      thickness: 10, len: 0.6,
      tickfont: { size: 9, color: tc },
      tickvals: unique.map((_, i) => i),
      ticktext: unique.length <= 12 ? unique : unique.slice(0, 12).concat(['…']),
      title: { text: colorCol, font: { size: 9, color: tc } },
    };
  } else {
    colorData  = xs;
    hoverText  = [];
    showScale  = false;
    colorbarCfg = undefined;
  }

  const trace = {
    type: 'scatter3d', mode: 'markers',
    x: xs, y: ys, z: zs,
    text: hoverText,
    marker: {
      size: 4, opacity: 0.82,
      color: colorData,
      colorscale: 'Turbo',
      showscale: showScale,
      colorbar: colorbarCfg,
    },
    hovertemplate: colorCol
      ? `PC1: %{x:.2f}<br>PC2: %{y:.2f}<br>PC3: %{z:.2f}<br>${colorCol}: %{text}<extra></extra>`
      : 'PC1: %{x:.2f}<br>PC2: %{y:.2f}<br>PC3: %{z:.2f}<extra></extra>',
  };
  const gc = 'rgba(255,255,255,0.08)';
  const layout = {
    paper_bgcolor: 'transparent',
    font: { color: tc, size: 10 }, showlegend: false,
    height: 480, margin: { l: 0, r: 0, t: 10, b: 0 },
    scene: {
      xaxis: { title: { text: `PC1 (${ev[0]}%)`, font: { size: 10 } }, tickfont: { size: 8 }, gridcolor: gc, zerolinecolor: 'rgba(255,255,255,0.14)', backgroundcolor: 'rgba(0,0,0,0)' },
      yaxis: { title: { text: `PC2 (${ev[1]}%)`, font: { size: 10 } }, tickfont: { size: 8 }, gridcolor: gc, zerolinecolor: 'rgba(255,255,255,0.14)', backgroundcolor: 'rgba(0,0,0,0)' },
      zaxis: { title: { text: `PC3 (${ev[2]}%)`, font: { size: 10 } }, tickfont: { size: 8 }, gridcolor: gc, zerolinecolor: 'rgba(255,255,255,0.14)', backgroundcolor: 'rgba(0,0,0,0)' },
      bgcolor: 'rgba(8,15,30,0.5)',
    },
  };
  Plotly.newPlot(pcaEl, [trace], layout, { ...cfg, scrollZoom: true });
}

function _drawSPLOM(splom, colorCol, colorVals, cfg, tc, gc) {
  const el = document.getElementById('eda-splom-plot');
  if (!el || typeof Plotly === 'undefined') return;
  window._edaSPLOMData = splom;

  let colorData;
  if (colorVals && colorVals.length > 0) {
    const unique = [...new Set(colorVals)];
    colorData = colorVals.map(v => unique.indexOf(v));
  } else {
    colorData = null;
  }

  const dim = splom.cols.length;
  const sz  = Math.max(120, Math.min(220, Math.floor(900 / dim)));
  const trace = {
    type: 'splom',
    dimensions: splom.cols.map(col => ({ label: col, values: splom.data[col] })),
    marker: {
      size: 3, opacity: 0.55,
      color: colorData || splom.data[splom.cols[0]],
      colorscale: 'Turbo',
      showscale: false,
      line: { width: 0 },
    },
    diagonal: { visible: true },
    showupperhalf: false,
    text: colorVals || [],
    hovertemplate: colorCol ? `${colorCol}: %{text}<extra></extra>` : undefined,
  };
  const layout = {
    paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
    font: { color: tc, size: 9 }, showlegend: false,
    height: dim * sz + 60,
    margin: { l: 80, r: 20, t: 20, b: 80 },
  };
  // Override each axis pair for dark theme
  splom.cols.forEach((_, i) => {
    const k = `xaxis${i > 0 ? i+1 : ''}`;
    const k2 = `yaxis${i > 0 ? i+1 : ''}`;
    layout[k]  = { gridcolor: gc, zerolinecolor: gc, tickfont: { size: 7 } };
    layout[k2] = { gridcolor: gc, zerolinecolor: gc, tickfont: { size: 7 } };
  });
  Plotly.newPlot(el, [trace], layout, cfg);
}

function _recolorSPLOM(colName) {
  const splom = window._edaSPLOMData;
  if (!splom) return;
  const cs = getComputedStyle(document.documentElement);
  const tc = cs.getPropertyValue('--text3').trim() || '#64748b';
  const gc = cs.getPropertyValue('--border').trim() || 'rgba(255,255,255,0.07)';
  const cfg = { displayModeBar: 'hover', scrollZoom: true, responsive: true, modeBarButtonsToRemove: ['select2d', 'lasso2d'] };
  const colorVals = (colName && splom.color_map && splom.color_map[colName]) || null;
  _drawSPLOM(splom, colName || null, colorVals, cfg, tc, gc);
}

function _recolorPCA(colName) {

// ── EDA Animations ───────────────────────────────────────────
function _edaInitAnimations(d) {
  // 1. Staggered section card entrance via IntersectionObserver
  const cards = document.querySelectorAll('#edaResults .eda-section-card');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('eda-visible');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          entry.target.querySelectorAll('.shap-bar-fill[data-pct]').forEach(bar => {
            bar.style.width = bar.dataset.pct + '%';
          });
        }));
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.05 });
  cards.forEach((card, i) => {
    card.style.transitionDelay = `${i * 60}ms`;
    io.observe(card);
  });

  // 2. Nav active-section highlight via a persistent IntersectionObserver
  const navSections = document.querySelectorAll('#edaResults .eda-section-card[id]');
  const navIO = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const btn = document.querySelector(`.eda-nav-tab[data-section="${entry.target.id}"]`);
      if (btn) btn.classList.toggle('eda-nav-active', entry.isIntersecting);
    });
  }, { threshold: 0.25, rootMargin: '-60px 0px -40% 0px' });
  navSections.forEach(s => navIO.observe(s));

  // 4. Count-up animation on chip values
  document.querySelectorAll('[data-countup]').forEach(el => {
    const target  = parseFloat(el.dataset.countup);
    const suffix  = el.dataset.suffix || '';
    const isFloat = !!el.dataset.float;
    const dur = 900, start = performance.now();
    const tick = now => {
      const pct = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - pct, 3);
      const val  = target * ease;
      el.textContent = (isFloat ? val.toFixed(1) : Math.round(val).toLocaleString()) + suffix;
      if (pct < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });

  // 5. Quality ring draw animation
  const arc = document.getElementById('eda-ring-arc');
  const num = document.getElementById('eda-ring-num');
  if (arc && num) {
    const qScore = d.quality_score ?? 100;
    const R = 22, C = 2 * Math.PI * R;
    const target = C * (1 - qScore / 100);
    // Trigger CSS transition
    requestAnimationFrame(() => {
      arc.style.strokeDashoffset = target;
    });
    // Count up the number inside the ring
    const dur = 1200, start = performance.now();
    const tick = now => {
      const pct = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - pct, 3);
      num.textContent = Math.round(qScore * ease);
      if (pct < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}

function _edaShortNum(n) {
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1)+'K';
  return Number.isInteger(n) ? n : parseFloat(n.toFixed(2));
}

async function _captureAllEDACharts() {
  const d = _edaCurrentData;
  const gc = 'rgba(255,255,255,0.08)';

  // Render a fresh off-screen Plotly chart and capture it as PNG.
  // Off-screen avoids all ResizeObserver interference with live charts.
  const offscreen = async (traces, layout, w, h) => {
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px;height:${h}px;visibility:hidden;`;
    document.body.appendChild(el);
    try {
      await Plotly.newPlot(el, traces, { ...layout, width: w, height: h }, { staticPlot: true, responsive: false });
      return await Plotly.toImage(el, { format: 'png', scale: 2, width: w, height: h });
    } catch(e) {
      console.error('[EDA export] capture failed:', e);
      return null;
    } finally {
      try { Plotly.purge(el); } catch {}
      document.body.removeChild(el);
    }
  };

  const darkBase = {
    paper_bgcolor: '#111827', plot_bgcolor: '#111827',
    font: { color: '#e2e8f0', size: 10 }, showlegend: false,
    margin: { l: 40, r: 10, t: 10, b: 45 }, bargap: 0.04,
    xaxis: { gridcolor: gc, zerolinecolor: gc, tickfont: { size: 8 } },
    yaxis: { gridcolor: gc, zerolinecolor: gc, tickfont: { size: 9 } },
  };

  // Distributions
  const distKeys = Object.keys(d.distributions);
  const distImgs = [];
  for (const col of distKeys) {
    const rawVals = d.stats[col]?.raw_vals;
    const dist    = d.distributions[col];
    const traces  = (dist.type === 'histogram' && rawVals?.length)
      ? [{ type: 'histogram', x: rawVals, autobinx: true, marker: { color: '#34d399', opacity: 0.82, line: { color: 'rgba(52,211,153,0.3)', width: 0.5 } } }]
      : [{ type: 'bar', x: dist.labels || dist.bins, y: dist.counts, marker: { color: '#a78bfa', opacity: 0.82 } }];
    distImgs.push(await offscreen(traces, darkBase, 700, 280));
  }

  // Box plots
  const boxCols   = Object.keys(d.stats).filter(c => d.stats[c].raw_vals);
  const boxTraces = boxCols.map(col => ({
    type: 'box', name: col, y: d.stats[col].raw_vals, boxpoints: 'outliers',
    marker: { color: '#34d399', size: 3, opacity: 0.7 }, line: { color: '#34d399', width: 1.5 },
    fillcolor: 'rgba(52,211,153,0.12)',
  }));
  const boxImg = boxTraces.length
    ? await offscreen(boxTraces, { ...darkBase, margin: { l: 50, r: 20, t: 10, b: 90 }, xaxis: { tickangle: -35, tickfont: { size: 9 }, gridcolor: gc }, yaxis: { gridcolor: gc } }, 900, 400)
    : null;

  // Correlation heatmap
  const corrImg = d.correlations
    ? await offscreen(
        [{ type: 'heatmap', z: d.correlations.matrix, x: d.correlations.labels, y: d.correlations.labels,
           colorscale: 'RdBu', zmid: 0, zmin: -1, zmax: 1, showscale: true,
           text: d.correlations.matrix.map(r => r.map(v => v !== null ? v.toFixed(2) : '')),
           texttemplate: '%{text}', textfont: { size: 8, color: '#ffffff' } }],
        { ...darkBase, margin: { l: 90, r: 60, t: 20, b: 120 }, xaxis: { tickangle: -45, gridcolor: gc }, yaxis: { gridcolor: gc } }, 800, 750)
    : null;

  // MI matrix
  const miImg = d.mi
    ? await offscreen(
        [{ type: 'heatmap', z: d.mi.matrix, x: d.mi.labels, y: d.mi.labels,
           colorscale: 'Viridis', zmin: 0, zmax: 1, showscale: true,
           text: d.mi.matrix.map(r => r.map(v => v.toFixed(2))),
           texttemplate: '%{text}', textfont: { size: 8, color: '#ffffff' } }],
        { ...darkBase, margin: { l: 90, r: 60, t: 20, b: 120 }, xaxis: { tickangle: -45, gridcolor: gc }, yaxis: { gridcolor: gc } }, 800, 750)
    : null;

  // SPLOM
  const splomImg = d.splom
    ? await offscreen(
        [{ type: 'splom', dimensions: d.splom.cols.map(c => ({ label: c, values: d.splom.data[c] })), showupperhalf: false, marker: { size: 3, color: '#38bdf8', opacity: 0.6 } }],
        { ...darkBase, margin: { l: 10, r: 10, t: 10, b: 10 } }, 900, 900)
    : null;

  return { distKeys, distImgs, boxImg, corrImg, miImg, splomImg };
}

async function _exportEDAReport() {
  if (!_edaCurrentData || !_edaCurrentFilename) return;
  const btn = document.getElementById('eda-export-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Exporting…'; }
  try {
    const charts  = await _captureAllEDACharts();
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const html = _buildExportHTML(_edaCurrentData, _edaCurrentFilename, charts.distKeys, charts.distImgs, charts.boxImg, charts.corrImg, charts.miImg, false, charts.splomImg, isLight);
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: _edaCurrentFilename.replace(/\.csv$/i, '') + '_eda_report.html' });
    a.click();
    URL.revokeObjectURL(url);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '⬇ HTML'; }
  }
}

  <div class="rpt-logo">EDA Explorer · AIRaML</div>

  <div class="rpt-meta">${filename} &nbsp;·&nbsp; ${now}</div>
  <div class="rpt-badges">
    <span class="rpt-badge" style="background:var(--color-success-bg);color:var(--color-success);border:1px solid color-mix(in srgb,var(--color-success) 25%,transparent)">${d.overview.rows.toLocaleString()} rows</span>
    <span class="rpt-badge" style="background:var(--color-info-bg);color:var(--color-info);border:1px solid color-mix(in srgb,var(--color-info) 25%,transparent)">${d.overview.cols} columns</span>
    <span class="rpt-badge" style="background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)">Quality ${qScore}/100</span>
    ${d.overview.duplicates > 0 ? `<span class="rpt-badge" style="background:var(--color-danger-bg);color:var(--color-danger);border:1px solid color-mix(in srgb,var(--color-danger) 25%,transparent)">${d.overview.duplicates} duplicates</span>` : ''}
  </div>
</div>

<div class="rpt-body">

  ${sec('Overview', '📋', chipsHTML, 'var(--color-info)')}

  ${narrativeHTML ? sec('Analyst Summary', '📝', narrativeHTML, 'var(--accent)') : ''}

  ${insightsHTML ? sec('Smart Insights', '💡', insightsHTML, 'var(--color-warning)') : ''}

  ${readinessHTML ? sec('ML Readiness', '⚙', readinessHTML, 'var(--color-success)') : ''}

  ${sampleHTML ? sec('Sample Data', '👁', sampleHTML, 'var(--color-info)') : ''}

  ${sec('Column Info', '🗂', colsHTML, 'var(--text3)')}

  ${statsHTML ? sec('Descriptive Statistics', '📊', statsHTML, 'var(--color-info)') : ''}

  ${boxImg ? sec('Box Plots', '📦', imgSection(boxImg), 'var(--accent)') : ''}

  ${distGridHTML ? sec('Distributions', '📈', distGridHTML, 'var(--color-success)') : ''}

  ${miImg ? sec('Mutual Information', '🔗', imgSection(miImg, 'Normalized 0–1 · captures non-linear + categorical relationships'), 'var(--color-info)') : ''}

  ${splomImg ? sec('Scatter Plot Matrix', '⊡', imgSection(splomImg, `${(d.splom||{cols:[]}).cols.length} features · pairwise relationships`), 'var(--color-success)') : ''}

  ${d.pca ? sec('PCA 3D Scatter', '🔵',
    `<p style="font-size:0.82rem;color:#64748b;line-height:1.7;padding:0.75rem 1rem;background:rgba(255,255,255,0.02);border-radius:8px;border:1px dashed rgba(255,255,255,0.1)">
      ⓘ PCA 3D scatter uses WebGL and cannot be captured as a static image. Open the live EDA Explorer to interact with the 3D plot.<br>
      <span style="font-size:0.75rem;opacity:0.6">PC1 ${d.pca.explained_variance[0]}% · PC2 ${d.pca.explained_variance[1]}% · PC3 ${d.pca.explained_variance[2]}% explained variance · ${d.pca.coords.length} points</span>
    </p>`, 'var(--accent)') : ''}

  ${corrImg ? sec('Correlation Heatmap', '🔥', imgSection(corrImg, 'Pearson · blue = positive · red = negative'), 'var(--color-danger)') : ''}

  <div class="rpt-footer">
    ${!isPrint ? '<p style="font-size:0.72rem;color:#475569;margin-bottom:0.75rem">To save as PDF: press <kbd style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:1px 6px;font-size:0.7rem">Ctrl+P</kbd> (Windows) or <kbd style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:1px 6px;font-size:0.7rem">⌘+P</kbd> (Mac)</p>' : ''}
    Generated by <a href="https://ml-unified.onrender.com/?mode=eda">EDA Explorer</a> · AIRaML portfolio &nbsp;·&nbsp; ${now}
  </div>
</div>

</body>
