// ── Step 1.5: Data Quality & Preprocessing ────────────────────
function _renderAutoMLStep1b(preselectedTarget) {
  const a = automlAnalysis;
  // Use original (pre-preprocessing) analysis for DQ issue detection so that
  // after Revert the missing/skew/outlier flags reflect the raw dataset.
  const aOrig = _automlOrigAnalysis || a;
  const effectiveTarget = preselectedTarget || a.suggested_target;
  const _acc = document.documentElement.style.getPropertyValue('--active-accent') || '#818cf8';
  // Use aOrig throughout so the column lists, DQ flags, and drop suggestions
  // always reflect the raw uploaded dataset — even after preprocessing has run.
  const catCols = aOrig.columns.filter(c => !c.is_numeric && c.name !== effectiveTarget).map(c => c.name);
  const numCols = aOrig.columns.filter(c => c.is_numeric && c.name !== effectiveTarget).map(c => c.name);

  // High-cardinality text columns (non-numeric, >20 unique) — names, codes, free text
  const highCardCols = aOrig.columns.filter(c =>
    c.name !== effectiveTarget && !c.is_numeric && (c.nunique || 0) > 20
  );
  // Likely numeric ID columns — nearly all unique values (>90% of rows) OR "id" in name
  const likelyIdCols = aOrig.columns.filter(c => {
    if (c.name === effectiveTarget) return false;
    const nm = c.name.toLowerCase();
    const nameHasId = nm === 'id' || nm.endsWith('id') || nm.includes('_id') || nm.startsWith('id_');
    if (nameHasId) return true;
    return c.is_numeric && (c.nunique || 0) / (aOrig.rows || 1) >= 0.9;
  });

  // Detect issues — use original analysis so Revert still shows real data quality
  const hasMissing   = (aOrig.total_missing || 0) > 0 || aOrig.columns.some(c => (c.missing || 0) > 0);
  const hasCat       = catCols.length > 0;
  const hasOutliers  = numCols.some(c => {
    const col = aOrig.columns.find(x => x.name === c);
    if (!col || col.std == null) return false;
    const range = (col.max || 0) - (col.min || 0);
    return col.std > 0 && range / col.std > 6;
  });
  const hasSkewness  = numCols.some(c => {
    const col = aOrig.columns.find(x => x.name === c);
    return col && col.skew != null && Math.abs(col.skew) > 0.75;
  });

  const issues = [];
  if (hasMissing)  issues.push(`<span style="color:${_acc}">${aOrig.total_missing || '?'} missing value(s)</span>`);
  if (hasCat)      issues.push(`<span style="color:var(--text1)">${catCols.length} categorical column(s)</span>`);
  if (hasOutliers) issues.push(`<span style="color:var(--text1)">potential outliers detected</span>`);
  if (hasSkewness) issues.push(`<span style="color:var(--text1)">skewed numeric column(s)</span>`);

  const qualityHTML = issues.length
    ? `<div style="display:flex;flex-wrap:wrap;gap:0.5rem;font-size:0.78rem;margin-top:0.5rem">${issues.map(i => `<span style="padding:0.2rem 0.55rem;border-radius:4px;background:var(--bg-input);border:1px solid var(--border2)">${i}</span>`).join('')}</div>`
    : `<div style="font-size:0.78rem;color:#34d399;margin-top:0.5rem">No major issues detected.</div>`;

  const ordColsHTML = catCols.length ? catCols.map(c =>
    `<label style="display:flex;align-items:center;gap:0.4rem;font-size:0.78rem;cursor:pointer;color:var(--text2)">
      <input type="checkbox" class="aml-ordinal-col" value="${c}" style="accent-color:#818cf8"> ${c}
    </label>`
  ).join('') : '<span style="font-size:0.75rem;color:var(--text3)">None</span>';

  const autoDetected = new Set([...likelyIdCols, ...highCardCols].map(c => c.name));
  const manualCols   = aOrig.columns
    .filter(c => c.name !== effectiveTarget && !autoDetected.has(c.name))
    .map(c => c.name);

  document.getElementById('main').innerHTML = `
    <div class="aml-results-page">
      <div id="amlWizardStepper">${_automlStepsHTML(1, false)}</div>
      <h2 style="font-size:1.3rem;font-weight:800;margin:1rem 0 0.25rem;color:var(--active-accent,#818cf8)">Data Quality &amp; Preprocessing</h2>
      <p style="font-size:0.85rem;color:var(--text2);margin-bottom:0.75rem">
        Analysed <strong style="color:var(--active-accent,#818cf8)">${(aOrig.rows || 0).toLocaleString()} rows</strong> &middot; <strong style="color:var(--active-accent,#818cf8)">${aOrig.columns.length} columns</strong>
      </p>

      <div class="aml-results-grid">

        <!-- LEFT: Dataset summary card -->
        <div class="aml-results-left">
          <div class="aml-results-summary" style="text-align:left;padding:1.4rem 1.25rem">

            <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:1.25rem">
              <div style="width:36px;height:36px;border-radius:50%;background:${_acc}1e;border:1.5px solid ${_acc}4d;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
                  <rect x="2" y="4" width="16" height="13" rx="2" stroke="var(--active-accent,#818cf8)" stroke-width="1.6"/>
                  <line x1="2" y1="8" x2="18" y2="8" stroke="var(--active-accent,#818cf8)" stroke-width="1.2"/>
                  <line x1="7" y1="8" x2="7" y2="17" stroke="var(--active-accent,#818cf8)" stroke-width="1.2"/>
                </svg>
              </div>
              <div>
                <div style="font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3)">Dataset</div>
                <div style="font-size:0.88rem;font-weight:700;color:${_acc}">${_automlDatasetName || 'Untitled'}</div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.5rem">
              <div style="padding:0.55rem 0.65rem;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border)">
                <div style="font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3)">Rows</div>
                <div style="font-size:1.1rem;font-weight:800;color:${_acc}">${(aOrig.rows||0).toLocaleString()}</div>
              </div>
              <div style="padding:0.55rem 0.65rem;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border)">
                <div style="font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3)">Columns</div>
                <div style="font-size:1.1rem;font-weight:800;color:${_acc}">${aOrig.columns.length}</div>
              </div>
            </div>
            <div style="padding:0.55rem 0.65rem;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);margin-bottom:1.1rem">
              <div style="font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:0.15rem">Target Column</div>
              <div style="font-size:0.88rem;font-weight:700;color:${_acc}">${effectiveTarget || '—'}</div>
            </div>

            <div style="font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:0.45rem">Data Quality</div>
            <div style="display:flex;flex-direction:column;gap:0.35rem;margin-bottom:1.25rem">
              ${issues.length
                ? issues.map(i => `<div style="font-size:0.75rem;padding:0.28rem 0.5rem;border-radius:6px;background:var(--bg-input);border:1px solid var(--border2)">${i}</div>`).join('')
                : `<div style="font-size:0.75rem;color:${_acc};padding:0.28rem 0">✓ No major issues detected</div>`}
            </div>

            <div style="font-size:0.82rem;font-weight:600;color:${_acc};margin-bottom:0.6rem">Preprocess before training?</div>
            <div id="amlPrepYesNo" style="display:flex;flex-direction:column;gap:0.45rem">
              <button class="btn btn-primary" onclick="_showAutoMLPrepOptions()" style="font-size:0.82rem">Yes, preprocess</button>
              <button class="btn btn-clear" onclick="_renderAutoMLStep2()" style="font-size:0.82rem">No, skip →</button>
              <button class="btn btn-clear" onclick="_renderAutoMLStep1c()" style="font-size:0.82rem;margin-top:0.25rem">← Back to FE</button>
            </div>
          </div>
        </div>

        <!-- RIGHT: Preprocessing options -->
        <div class="aml-results-right">
          <div id="amlPrepOptions" style="display:none">

            <div style="padding:0.85rem 1rem;border:1px solid ${_acc}55;border-radius:12px;background:${_acc}0d;margin-bottom:1.2rem">
              <div style="font-size:0.8rem;font-weight:700;color:${_acc};margin-bottom:0.35rem">⚠ Columns to consider dropping</div>
              <div style="font-size:0.75rem;color:var(--text2);margin-bottom:0.75rem;line-height:1.5">
                Auto-detected ID/name/code columns. Check to <strong style="color:#f87171">drop</strong>, or add more below:
              </div>
              <div id="amlDropColList" style="display:flex;flex-direction:column;gap:0.4rem">
                ${likelyIdCols.map(c => `
                <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.78rem;cursor:pointer;padding:0.35rem 0.5rem;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border)">
                  <input type="checkbox" class="aml-drop-col" value="${c.name}" checked style="accent-color:#f87171;flex-shrink:0">
                  <span style="color:var(--text1);font-weight:500">${c.name}</span>
                  <span style="margin-left:auto;font-size:0.7rem;color:${_acc}">ID column · ${c.nunique} unique</span>
                </label>`).join('')}
                ${highCardCols.map(c => `
                <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.78rem;cursor:pointer;padding:0.35rem 0.5rem;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border)">
                  <input type="checkbox" class="aml-drop-col" value="${c.name}" checked style="accent-color:#f87171;flex-shrink:0">
                  <span style="color:var(--text1);font-weight:500">${c.name}</span>
                  <span style="margin-left:auto;font-size:0.7rem;color:var(--text3)">text · ${c.nunique} unique</span>
                </label>`).join('')}
              </div>
              <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.6rem">
                <select id="amlDropExtraSelect" class="field-select" style="flex:1;padding:0.2rem 0.5rem;font-size:0.78rem;background:transparent;border-color:var(--border2)">
                  <option value="">+ add column to drop…</option>
                  ${manualCols.map(n => `<option value="${n}">${n}</option>`).join('')}
                </select>
                <button class="btn btn-clear" style="padding:0.25rem 0.7rem;font-size:0.75rem;white-space:nowrap" onclick="_amlAddDropCol()">Add</button>
              </div>
            </div>

            <div style="font-size:0.72rem;font-weight:700;color:${_acc};text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem">Select Preprocessing Options</div>
            <div style="display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.2rem;padding:0.75rem;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border)">

              <label style="display:flex;align-items:flex-start;gap:0.5rem;cursor:pointer;font-size:0.82rem;color:var(--text1)">
                <input type="checkbox" id="amlPrepMissing" ${hasMissing ? 'checked' : ''} onchange="_onMissingMethodChange()" style="accent-color:var(--active-accent,var(--accent));margin-top:2px">
                <span style="flex:1">
                  Handle missing values
                  <div id="amlMissingOpts" style="display:grid;grid-template-columns:auto 1fr;gap:0.3rem 0.5rem;align-items:center;margin-top:0.45rem">
                    <span style="font-size:0.75rem;color:var(--text3)">Numeric</span>
                    <select id="amlPrepMissingNum" class="field-select" style="padding:0.2rem 0.5rem;font-size:0.78rem;background:transparent;border-color:var(--border2)" onchange="_onMissingMethodChange()">
                      <option value="median" selected>Median (recommended)</option>
                      <option value="mean">Mean</option>
                      <option value="mode">Mode</option>
                      <option value="knn">KNN (k=5)</option>
                      <option value="mice">MICE / Iterative</option>
                      <option value="ffill">Forward fill</option>
                      <option value="bfill">Backward fill</option>
                      <option value="constant">Constant (0)</option>
                      <option value="drop">Drop rows</option>
                    </select>
                    <span style="font-size:0.75rem;color:var(--text3)">Categorical</span>
                    <select id="amlPrepMissingCat" class="field-select" style="padding:0.2rem 0.5rem;font-size:0.78rem;background:transparent;border-color:var(--border2)">
                      <option value="most_frequent" selected>Most frequent (recommended)</option>
                      <option value="constant">Constant ("Unknown")</option>
                      <option value="ffill">Forward fill</option>
                      <option value="bfill">Backward fill</option>
                      <option value="drop">Drop rows</option>
                    </select>
                  </div>
                  <div id="amlMissingSlowWarn" style="display:none;font-size:0.73rem;color:#f59e0b;margin-top:0.3rem">&#9888; KNN / MICE are slower on large datasets.</div>
                </span>
              </label>

              <div>
                <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.82rem;color:var(--text1);margin-bottom:0.4rem">
                  Categorical encoding:
                  <select id="amlPrepEncMethod" class="field-select" style="display:inline-block;margin-left:0.5rem;padding:0.2rem 0.5rem;font-size:0.78rem;width:auto;background:transparent;border-color:var(--border2)" onchange="_onEncMethodChange()">
                    <option value="none">None</option>
                    <option value="onehot" ${hasCat ? 'selected' : ''}>One-hot encode (nominal)</option>
                    <option value="ordinal">Ordinal encode</option>
                    <option value="frequency">Frequency encode</option>
                    <option value="target">Target encode</option>
                  </select>
                </label>
                ${!hasCat ? `<div style="margin-left:1.5rem;font-size:0.73rem;color:var(--text3);margin-bottom:0.3rem">ℹ No text/categorical columns detected — encoding will have no effect.</div>` : ''}
                <div id="amlEncHint" style="margin-left:1.5rem;font-size:0.75rem;margin-bottom:0.3rem;display:none"></div>
                <div id="amlOrdinalCols" style="display:none">
                  ${catCols.length ? `<div style="margin-left:1.5rem;margin-top:0.4rem;font-size:0.75rem;color:var(--text3);margin-bottom:0.3rem">Mark which columns are ordinal:</div>
                  <div style="margin-left:1.5rem;display:flex;flex-wrap:wrap;gap:0.4rem 1rem">${ordColsHTML}</div>` : ''}
                </div>
              </div>

              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.82rem;color:var(--text1)">
                <input type="checkbox" id="amlPrepDupes" style="accent-color:var(--active-accent,var(--accent))">
                Remove duplicate rows
              </label>
              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.82rem;color:var(--text1)">
                <input type="checkbox" id="amlPrepOutliers" ${hasOutliers ? 'checked' : ''} style="accent-color:var(--active-accent,var(--accent))">
                Remove outliers (IQR method)
              </label>
              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.82rem;color:var(--text1)">
                <input type="checkbox" id="amlPrepSkew" ${hasSkewness ? 'checked' : ''} style="accent-color:var(--active-accent,var(--accent))">
                Fix skewness (log1p transform on positive columns)
              </label>
              <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.82rem;color:var(--text1)">
                <input type="checkbox" id="amlPrepScale" style="accent-color:var(--active-accent,var(--accent))">
                Standardize numeric features (StandardScaler)
              </label>
            </div>

            <div style="border-top:1px solid var(--border2);padding-top:1rem;margin-bottom:1rem">
              <div style="font-size:0.72rem;font-weight:700;color:${_acc};text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem">Feature Selection</div>
              <div style="display:flex;flex-direction:column;gap:0.6rem">
                <label style="font-size:0.82rem;color:var(--text1);display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
                  Method:
                  <select id="amlFsMethod" class="field-select" style="display:inline-block;margin-left:0.5rem;padding:0.2rem 0.5rem;font-size:0.78rem;width:auto;background:transparent;border-color:var(--border2)" onchange="_onFsMethodChange()">
                    <option value="none">None — skip feature selection</option>
                    <option value="variance">Variance Threshold — drop near-zero variance features</option>
                    <option value="correlation">Correlation Filter — remove highly correlated features</option>
                    <option value="rfe">RFE (Random Forest) — recursive feature elimination</option>
                    <option value="kbest">SelectKBest (Mutual Info) — rank by mutual information with target</option>
                  </select>
                </label>
                <div id="amlFsHint" style="font-size:0.75rem;color:var(--text3);margin-left:1.5rem;display:none"></div>
                <div id="amlFsTopKRow" style="display:none;align-items:center;gap:0.5rem;font-size:0.82rem;color:var(--text1);flex-wrap:wrap">
                  Keep top K features:
                  <input type="number" id="amlFsTopK" class="field-input" value="10" min="1" max="200"
                         style="display:inline-block;margin-left:0.5rem;padding:0.2rem 0.5rem;font-size:0.78rem;width:80px;background:transparent;border-color:var(--border2)">
                </div>
              </div>
            </div>

            <div id="amlPrepErr" style="display:none;font-size:0.8rem;color:#f87171;margin-bottom:0.75rem"></div>
            <div class="action-row" style="margin-top:0">
              <button class="btn btn-clear" onclick="_renderAutoMLStep1c()">← Back</button>
              <button class="btn btn-primary" id="amlPrepApplyBtn" onclick="_applyAutoMLPreprocessing()" style="font-size:0.85rem">Apply Preprocessing</button>
            </div>
            <div id="amlPrepProgress" style="display:none;margin-top:1rem">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.35rem">
                <span style="font-size:0.75rem;color:var(--text2)" id="amlPrepProgLabel">Analyzing data…</span>
                <span style="font-size:0.75rem;color:var(--text3)" id="amlPrepProgPct">0%</span>
              </div>
              <div style="height:5px;border-radius:9999px;background:var(--border);overflow:hidden">
                <div id="amlPrepProgBar" style="height:100%;width:0%;border-radius:9999px;background:var(--active-accent,#818cf8);transition:width 0.5s ease"></div>
              </div>
              <div style="display:flex;gap:0.5rem;margin-top:0.6rem;flex-wrap:wrap" id="amlPrepStepDots"></div>
            </div>
          </div>

          <div id="amlPrepResult" style="display:none"></div>

          <div id="amlPrepSkipRow" style="display:none">
            <div class="action-row" style="margin-top:0.5rem">
              <button class="btn btn-clear" onclick="_renderAutoMLStep1c()">← Back</button>
            </div>
          </div>
        </div>

      </div>
    </div>`;
}

function _amlRevertPreprocessing() {
  if (_automlOrigAnalysis) automlAnalysis = _automlOrigAnalysis;
  if (_automlOrigFile)     automlFile     = _automlOrigFile;
  automlFEB64       = '';
  automlPreFeCols   = [];
  automlPreFeSample = {};
  _renderAutoMLStep1b(_automlTargetCol);
}

function _showAutoMLPrepOptions() {
  document.getElementById('amlPrepYesNo').style.display    = 'none';
  document.getElementById('amlPrepOptions').style.display  = 'block';
  const stepperEl = document.getElementById('amlWizardStepper');
  if (stepperEl) stepperEl.innerHTML = _automlStepsHTML(2, false);
  _onEncMethodChange();
  _onMissingMethodChange();
}

function _amlAddDropCol() {
  const sel = document.getElementById('amlDropExtraSelect');
  const col = sel?.value;
  if (!col) return;
  const list = document.getElementById('amlDropColList');
  if (!list) return;
  const row = document.createElement('label');
  row.style.cssText = 'display:flex;align-items:center;gap:0.5rem;font-size:0.78rem;cursor:pointer;padding:0.35rem 0.5rem;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border)';
  row.innerHTML = `<input type="checkbox" class="aml-drop-col" value="${col}" checked style="accent-color:#f87171;flex-shrink:0">
    <span style="color:var(--text1);font-weight:500">${col}</span>
    <span style="margin-left:auto;font-size:0.7rem;color:var(--text3)">added</span>`;
  list.appendChild(row);
  const opt = sel.querySelector(`option[value="${col}"]`);
  if (opt) opt.remove();
  sel.value = '';
}

function _onMissingMethodChange() {
  const mv_num  = document.getElementById('amlPrepMissingNum')?.value || 'median';
  const warnEl  = document.getElementById('amlMissingSlowWarn');
  const optsEl  = document.getElementById('amlMissingOpts');
  const checked = document.getElementById('amlPrepMissing')?.checked;
  if (optsEl) optsEl.style.display = checked ? 'grid' : 'none';
  if (!warnEl) return;
  warnEl.style.display = (mv_num === 'knn' || mv_num === 'mice') ? 'block' : 'none';
}

function _onEncMethodChange() {
  const method   = document.getElementById('amlPrepEncMethod')?.value || 'none';
  const hintEl   = document.getElementById('amlEncHint');
  const ordEl    = document.getElementById('amlOrdinalCols');
  if (!hintEl || !ordEl) return;

  const hints = {
    none:      { text: '', color: 'var(--text3)' },
    onehot:    { text: 'Creates one binary column per category value. Can expand wide datasets.', color: 'var(--text3)' },
    ordinal:   { text: 'Assigns integer codes to categories. Mark ordinal columns below.', color: 'var(--text3)' },
    frequency: { text: 'Good for high-cardinality columns. Works well with tree models.', color: 'var(--text3)' },
    target:    { text: '⚠ Uses cross-fold smoothing to reduce leakage. Requires a numeric target.', color: 'var(--color-warning)' },
  };

  const h = hints[method] || hints.none;
  if (h.text) {
    hintEl.textContent   = h.text;
    hintEl.style.color   = h.color;
    hintEl.style.display = 'block';
  } else {
    hintEl.style.display = 'none';
  }
  ordEl.style.display = method === 'ordinal' ? 'block' : 'none';
}

function _onFsMethodChange() {
  const method  = document.getElementById('amlFsMethod')?.value || 'none';
  const hintEl  = document.getElementById('amlFsHint');
  const topKRow = document.getElementById('amlFsTopKRow');
  if (!hintEl || !topKRow) return;

  const hints = {
    none:        '',
    variance:    'Removes features with variance < threshold. No target needed.',
    correlation: 'Drops one of each pair of features with correlation > 0.90.',
    rfe:         'Uses Random Forest to recursively eliminate weak features. Slower on large datasets.',
    kbest:       'Ranks features by mutual information score with the target column.',
  };

  const txt = hints[method] || '';
  if (txt) {
    hintEl.textContent   = txt;
    hintEl.style.display = 'block';
  } else {
    hintEl.style.display = 'none';
  }
  topKRow.style.display = method !== 'none' ? 'flex' : 'none';
}

async function _applyAutoMLPreprocessing() {
  const btn     = document.getElementById('amlPrepApplyBtn');
  const errEl   = document.getElementById('amlPrepErr');
  const resEl   = document.getElementById('amlPrepResult');
  const progEl  = document.getElementById('amlPrepProgress');
  const barEl   = document.getElementById('amlPrepProgBar');
  const lblEl   = document.getElementById('amlPrepProgLabel');
  const pctEl   = document.getElementById('amlPrepProgPct');
  const dotsEl  = document.getElementById('amlPrepStepDots');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.style.opacity = '0.5';

  // Animate progress bar through preprocessing stages
  const steps = [
    { pct: 10, label: 'Analyzing data…' },
    { pct: 30, label: 'Handling missing values…' },
    { pct: 55, label: 'Encoding categorical columns…' },
    { pct: 72, label: 'Treating outliers & skewness…' },
    { pct: 85, label: 'Running feature selection…' },
  ];
  progEl.style.display = 'block';
  const stepNames = ['Analyze', 'Impute', 'Encode', 'Outliers', 'Select'];
  dotsEl.innerHTML = stepNames.map((s, i) =>
    `<span id="amlPrepDot${i}" style="font-size:0.68rem;padding:0.2rem 0.55rem;border-radius:9999px;
     background:var(--border);color:var(--text3);transition:all 0.3s">${s}</span>`
  ).join('');

  let stepIdx = 0;
  function advanceStep() {
    if (stepIdx >= steps.length) return;
    const s = steps[stepIdx];
    barEl.style.transition = 'none';
    void barEl.offsetWidth;
    barEl.style.transition = 'width 0.5s ease';
    barEl.style.width = s.pct + '%';
    lblEl.textContent = s.label;
    pctEl.textContent = s.pct + '%';
    const dot = document.getElementById('amlPrepDot' + stepIdx);
    if (dot) {
      dot.style.background = 'var(--active-accent,#818cf8)';
      dot.style.color = '#fff';
    }
    stepIdx++;
  }
  advanceStep();
  const timers = [
    setTimeout(advanceStep, 600),
    setTimeout(advanceStep, 1300),
    setTimeout(advanceStep, 2100),
    setTimeout(advanceStep, 3000),
  ];

  // Use preselected target from Step 0, fall back to analysis suggestion
  const target = _automlTargetCol || automlAnalysis.suggested_target;
  const encMethod   = document.getElementById('amlPrepEncMethod')?.value || 'none';
  const ordinalCols = encMethod === 'ordinal'
    ? [...document.querySelectorAll('.aml-ordinal-col:checked')].map(el => el.value)
    : [];

  const fsMethod = document.getElementById('amlFsMethod')?.value || 'none';
  const fsTopK   = parseInt(document.getElementById('amlFsTopK')?.value || '10', 10);

  const dropCols = [...document.querySelectorAll('.aml-drop-col:checked')].map(el => el.value);

  const options = {
    drop_columns:    dropCols,
    mv_num: document.getElementById('amlPrepMissing').checked
              ? (document.getElementById('amlPrepMissingNum')?.value || 'median') : null,
    mv_cat: document.getElementById('amlPrepMissing').checked
              ? (document.getElementById('amlPrepMissingCat')?.value || 'most_frequent') : null,
    encode_method:   encMethod,
    ordinal_columns: ordinalCols,
    remove_duplicates: document.getElementById('amlPrepDupes').checked,
    remove_outliers: document.getElementById('amlPrepOutliers').checked,
    fix_skewness:    document.getElementById('amlPrepSkew').checked,
    standardize:     document.getElementById('amlPrepScale').checked,
    feature_selection: { method: fsMethod, top_k: fsTopK },
  };

  try {
    // Read file as base64
    const csvB64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload  = e => resolve(btoa(e.target.result));
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.readAsBinaryString(automlFile);
    });

    const res = await fetch(API + '/automl/preprocess', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename:      automlFile.name,
        options,
        target_column: target,
        csv_b64:       csvB64,
        fe_config:     _automlFeatureEng || {},
      }),
    });
    if (!res.ok) { const t = await res.text(); throw new Error(t); }
    const result = await res.json();

    // Complete progress bar
    timers.forEach(clearTimeout);
    barEl.style.background = '#34d399';
    barEl.style.width = '100%';
    lblEl.textContent = 'Done!';
    lblEl.style.color = '#34d399';
    pctEl.textContent = '100%';
    stepNames.forEach((_, i) => {
      const d = document.getElementById('amlPrepDot' + i);
      if (d) { d.style.background = '#34d399'; d.style.color = '#fff'; }
    });
    setTimeout(() => { progEl.style.display = 'none'; }, 1200);
    btn.style.opacity = '1';

    // Save originals before overwriting (used to restore state on Revert)
    if (!_automlOrigAnalysis) _automlOrigAnalysis = automlAnalysis;
    if (!_automlOrigFile)     _automlOrigFile     = automlFile;

    // Save FE transformer (serialized) and pre-FE column list for training
    automlFEB64       = result.fe_b64        || '';
    automlPreFeCols   = result.pre_fe_cols   || [];
    automlPreFeSample = result.pre_fe_sample || {};

    // Update global state
    const csvBytes = atob(result.csv_b64);
    const arr = new Uint8Array(csvBytes.length);
    for (let i = 0; i < csvBytes.length; i++) arr[i] = csvBytes.charCodeAt(i);
    const blob = new Blob([arr], { type: 'text/csv' });
    automlFile     = new File([blob], result.preprocessed_filename, { type: 'text/csv' });
    automlAnalysis = result;  // contains same fields as /analyze response

    // Hide options, show result summary
    document.getElementById('amlPrepOptions').style.display = 'none';
    resEl.style.display = 'block';
    const fsBefore = result.features_before != null ? result.features_before : (result.cols_before - 1);
    const fsAfter  = result.features_after  != null ? result.features_after  : (result.cols_after  - 1);
    const fsLine = (fsMethod !== 'none')
      ? `<div>Features: <strong>${fsBefore} → ${fsAfter} selected</strong></div>` : '';
    const colNote = (() => {
      const parts = [];
      if (result.user_cols_dropped) parts.push(`−${result.user_cols_dropped} dropped`);
      if (result.ohe_cols_added)    parts.push(`+${result.ohe_cols_added} OHE`);
      return parts.length ? ` <span style="color:var(--text3);font-weight:400">(${parts.join(', ')})</span>` : '';
    })();
    // Update stepper: Upload ✓ Configure ✓ → Results active
    const stepperEl = document.getElementById('amlWizardStepper');
    if (stepperEl) stepperEl.innerHTML = _automlStepsHTML(3, false);
    const acc = document.documentElement.style.getPropertyValue('--active-accent') || '#818cf8';
    const rowDiff = result.rows_before - result.rows_after;
    const statCards = [
      { label: 'ROWS',     value: `${result.rows_after.toLocaleString()}`, sub: rowDiff > 0 ? `−${rowDiff.toLocaleString()} removed` : 'no rows removed', color: 'var(--active-accent,#818cf8)' },
      { label: 'COLUMNS',  value: `${result.cols_after}`, sub: [result.user_cols_dropped ? `−${result.user_cols_dropped} dropped` : '', result.ohe_cols_added ? `+${result.ohe_cols_added} OHE` : '', result.fe_cols_added ? `+${result.fe_cols_added} FE` : ''].filter(Boolean).join(', ') || `from ${result.cols_before}`, color: 'var(--active-accent,#818cf8)' },
      { label: 'MISSING',  value: `${result.total_missing}`, sub: result.total_missing === 0 ? 'all resolved' : 'remaining', color: result.total_missing === 0 ? 'var(--active-accent,#818cf8)' : '#fbbf24' },
      ...(fsMethod !== 'none' ? [{ label: 'FEATURES', value: `${fsAfter}`, sub: `selected from ${fsBefore}`, color: 'var(--active-accent,#818cf8)' }] : []),
    ];
    resEl.innerHTML = `
      <div style="padding:1rem 1.1rem 0.75rem;border:1px solid ${acc}66;border-radius:12px;background:${acc}0a;margin-bottom:1.4rem">
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="${acc}" stroke-width="1.5"/><path d="M6 10l3 3 5-5" stroke="${acc}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size:0.78rem;font-weight:700;color:${acc};letter-spacing:0.06em;text-transform:uppercase">Preprocessing Complete</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0.6rem">
          ${statCards.map(s => `
          <div style="padding:0.65rem 0.75rem;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border)">
            <div style="font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:0.25rem">${s.label}</div>
            <div style="font-size:1.35rem;font-weight:800;color:${s.color};line-height:1">${s.value}</div>
            <div style="font-size:0.68rem;color:var(--text3);margin-top:0.2rem">${s.sub}</div>
          </div>`).join('')}
        </div>
        ${(() => {
          const fe = _automlFeatureEng;
          const hasLogSqrt = Object.values(fe.numeric || {}).some(v => v.log1p || v.sqrt || v.yeo_johnson || v.rank || v.outlier_flag || v.missing_flag || (v.bin && v.bin !== 'none'));
          const hasDerived = (fe.derived || []).length > 0;
          const hasPoly    = (fe.poly_cols || []).length >= 2;
          const hasDateFE  = Object.keys(fe.dates || {}).length > 0;
          return (hasLogSqrt || hasDerived || hasPoly || hasDateFE)
            ? `<div style="font-size:0.71rem;color:var(--text3);margin-top:0.75rem;padding-top:0.6rem;border-top:1px solid var(--border2)">
                 ℹ Feature engineering is active — additional columns will be added at training time.
               </div>`
            : '';
        })()}
      </div>
      <div style="font-size:0.85rem;font-weight:600;color:${acc};margin-bottom:0.75rem">Proceed to AutoML training?</div>
      <div class="action-row" style="margin-top:0">
        <button class="btn btn-clear" onclick="_amlRevertPreprocessing()">← Revert</button>
        <button class="btn btn-primary" onclick="_renderAutoMLStep2()">Yes, Configure AutoML →</button>
      </div>`;
  } catch(e) {
    timers.forEach(clearTimeout);
    barEl.style.background = '#f87171';
    barEl.style.width = '100%';
    lblEl.textContent = 'Failed';
    lblEl.style.color = '#f87171';
    pctEl.textContent = '';
    setTimeout(() => { progEl.style.display = 'none'; }, 2000);
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.style.opacity = '1';
  }
}

let _automlFeatureEng    = { numeric: {}, dates: {}, derived: [], poly_cols: [] };
let _automlOrigAnalysis  = null;
let _automlOrigFile      = null;
let automlFEB64          = '';
let automlPreFeCols      = [];
let automlPreFeSample    = {};

function _renderAutoMLStep1c(preserveScroll) {
  const a            = automlAnalysis;
  const effectTarget = _automlTargetCol || a.suggested_target;
  const _acc         = document.documentElement.style.getPropertyValue('--active-accent') || '#a78bfa';
  const allCols      = a.columns || [];
  const numCols      = allCols.filter(c => c.is_numeric && c.name !== effectTarget);
  const catCols      = allCols.filter(c => !c.is_numeric && c.name !== effectTarget);

  // Ensure structure
  if (!_automlFeatureEng.numeric)  _automlFeatureEng.numeric  = {};
  if (!_automlFeatureEng.dates)    _automlFeatureEng.dates    = {};
  if (!Array.isArray(_automlFeatureEng.derived)) _automlFeatureEng.derived = [];

  // ── SECTION 1: Numeric transforms ──────────────────────────────────────
  const numRows = numCols.map(c => {
    const fe  = _automlFeatureEng.numeric[c.name] || {};
    const _nDerived = ['log1p','sqrt','yeo_johnson','rank','outlier_flag','missing_flag'].filter(k => fe[k]).length
      + (fe.bin && fe.bin !== 'none' ? 1 : 0);
    const _derivedBadge = _nDerived > 0
      ? `<span style="font-size:0.62rem;color:var(--text3);margin-left:0.25rem;opacity:0.8">+${_nDerived} derived</span>`
      : '';
    const chips = [
      { t: 'log1p',       label: 'log1p',     tip: 'log(1+x) — heavy right skew' },
      { t: 'sqrt',        label: 'sqrt',       tip: 'Square root — mild right skew' },
      { t: 'yeo_johnson', label: 'Yeo-J',      tip: 'Yeo-Johnson power transform' },
      { t: 'rank',        label: 'rank',       tip: 'Percentile rank (0–1) — outlier-robust' },
      { t: 'outlier_flag',label: 'outlier ⚑',  tip: 'Add is_outlier flag (IQR)' },
      { t: 'missing_flag',label: 'missing ⚑',  tip: 'Add was_missing flag' },
    ].map(ch => {
      const on = !!fe[ch.t];
      return `<button class="aml-fe-chip${on?' selected':''}" data-col="${c.name}" data-t="${ch.t}"
                      title="${ch.tip}"
                      onclick="_toggleFEChipNum(this)"
                      style="font-size:0.66rem;padding:0.18rem 0.5rem;border-radius:20px;
                             border:1px solid var(--border2);cursor:pointer;
                             background:${on ? _acc : 'transparent'};
                             color:${on ? '#fff' : 'var(--text3)'}">${ch.label}</button>`;
    }).join('');

    const binVal = fe.bin || 'none';
    const binN   = fe.bin_n || 5;
    const binCustom = fe.bin_custom || '';
    const customVis = binVal === 'custom' ? '' : 'display:none';
    return `
      <div style="padding:0.55rem 0.65rem;border-radius:8px;border:1px solid var(--border2);
                  background:var(--bg-card);margin-bottom:0.35rem">
        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.4rem">
          <div style="font-size:0.8rem;font-weight:600;color:var(--text);min-width:80px">${c.name}</div>
          <div style="font-size:0.65rem;color:var(--text3)">${c.dtype||'numeric'}</div>
          ${_derivedBadge}
          ${chips}
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
          <span style="font-size:0.65rem;color:var(--text3)">Bin:</span>
          ${['none','quantile','equal_width','custom'].map(m => {
            const lbl = {none:'None',quantile:'Quantile ✓',equal_width:'Equal-width',custom:'Custom'}[m];
            const sel = binVal === m;
            return `<button onclick="_setBinMethod('${c.name}','${m}',this)"
                            style="font-size:0.63rem;padding:0.15rem 0.45rem;border-radius:12px;
                                   border:1px solid var(--border2);cursor:pointer;
                                   background:${sel ? _acc : 'transparent'};
                                   color:${sel ? '#fff' : 'var(--text3)'}">${lbl}</button>`;
          }).join('')}
          <input type="number" min="2" max="20" value="${binN}"
                 onchange="_automlFeatureEng.numeric['${c.name}'] = _automlFeatureEng.numeric['${c.name}']||{}; _automlFeatureEng.numeric['${c.name}'].bin_n = parseInt(this.value)||5"
                 style="width:42px;font-size:0.68rem;padding:0.12rem 0.3rem;border-radius:6px;
                        border:1px solid var(--border2);background:var(--bg-glass);color:var(--text)"
                 title="Number of bins">
          <input type="text" id="binCustom_${c.name}" value="${binCustom}" placeholder="e.g. 0,10,50,100"
                 onchange="_automlFeatureEng.numeric['${c.name}'] = _automlFeatureEng.numeric['${c.name}']||{}; _automlFeatureEng.numeric['${c.name}'].bin_custom = this.value"
                 style="${customVis};font-size:0.68rem;padding:0.12rem 0.4rem;border-radius:6px;
                         border:1px solid var(--border2);background:var(--bg-glass);color:var(--text);width:130px"
                 title="Comma-separated breakpoints">
        </div>
      </div>`;
  }).join('');

  // ── SECTION 2: Date columns ─────────────────────────────────────────────
  const dateRows = catCols.length === 0
    ? `<div style="font-size:0.78rem;color:var(--text3)">No non-numeric columns detected.</div>`
    : catCols.map(c => {
        const isMarked = !!_automlFeatureEng.dates[c.name];
        const dcfg     = _automlFeatureEng.dates[c.name] || {};
        const dateComponents = [
          { k:'year',          label:'Year'         },
          { k:'month',         label:'Month'        },
          { k:'day',           label:'Day'          },
          { k:'dow',           label:'Day of week'  },
          { k:'quarter',       label:'Quarter'      },
          { k:'is_weekend',    label:'Is weekend'   },
          { k:'days_since_min',label:'Days since earliest'},
          { k:'cyclical',      label:'Cyclical encoding (sin/cos)'},
        ];
        const compRows = isMarked ? `
          <div style="margin-top:0.45rem;padding-left:0.5rem;border-left:2px solid ${_acc};
                      display:flex;flex-wrap:wrap;gap:0.3rem 0.8rem">
            ${dateComponents.map(({k, label}) => {
              const checked = !!dcfg[k];
              return `<label style="display:flex;align-items:center;gap:0.3rem;font-size:0.72rem;cursor:pointer">
                <input type="checkbox" ${checked?'checked':''} style="accent-color:${_acc}"
                       onchange="_toggleDateComp('${c.name}','${k}',this.checked)">
                <span style="color:var(--text2)">${label}</span>
              </label>`;
            }).join('')}
            <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.72rem;cursor:pointer">
              <input type="checkbox" ${dcfg.keep_original?'checked':''} style="accent-color:${_acc}"
                     onchange="_toggleDateComp('${c.name}','keep_original',this.checked)">
              <span style="color:var(--text3)">Keep original column</span>
            </label>
          </div>` : '';
        return `
          <div style="padding:0.5rem 0.65rem;border-radius:8px;border:1px solid var(--border2);
                      background:var(--bg-card);margin-bottom:0.3rem">
            <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer">
              <input type="checkbox" ${isMarked?'checked':''} style="accent-color:${_acc}"
                     onchange="_markAsDate('${c.name}',this.checked)">
              <span style="font-size:0.8rem;font-weight:600;color:var(--text)">${c.name}</span>
              <span style="font-size:0.65rem;color:var(--text3)">${c.dtype||'object'}</span>
            </label>
            ${compRows}
          </div>`;
      }).join('');

  // ── SECTION 3: Derived features ─────────────────────────────────────────
  const numColNames = numCols.map(c => c.name);
  const colOpts     = numColNames.map(n => `<option value="${n}">${n}</option>`).join('');
  const derivedRows = _automlFeatureEng.derived.map((d, i) => `
    <div style="display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.3rem">
      <select onchange="_automlFeatureEng.derived[${i}].col_a=this.value"
              style="font-size:0.72rem;padding:0.2rem 0.3rem;border-radius:6px;
                     border:1px solid var(--border2);background:var(--bg-glass);color:var(--text)">
        ${numColNames.map(n => `<option value="${n}"${d.col_a===n?' selected':''}>${n}</option>`).join('')}
      </select>
      <select onchange="_automlFeatureEng.derived[${i}].op=this.value"
              style="font-size:0.72rem;padding:0.2rem 0.3rem;border-radius:6px;
                     border:1px solid var(--border2);background:var(--bg-glass);color:var(--text)">
        <option value="ratio"${d.op==='ratio'?' selected':''}>÷ ratio</option>
        <option value="diff"${d.op==='diff'?' selected':''}>− diff</option>
      </select>
      <select onchange="_automlFeatureEng.derived[${i}].col_b=this.value"
              style="font-size:0.72rem;padding:0.2rem 0.3rem;border-radius:6px;
                     border:1px solid var(--border2);background:var(--bg-glass);color:var(--text)">
        ${numColNames.map(n => `<option value="${n}"${d.col_b===n?' selected':''}>${n}</option>`).join('')}
      </select>
      <button onclick="_automlFeatureEng.derived.splice(${i},1);_renderAutoMLStep1c(true)"
              style="font-size:0.68rem;padding:0.15rem 0.4rem;border-radius:6px;
                     border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer">✕</button>
    </div>`).join('');
  const addDerivedBtn = numColNames.length >= 2
    ? `<button onclick="_addDerivedFeature()" class="btn btn-clear"
               style="font-size:0.72rem;padding:0.2rem 0.6rem;margin-top:0.35rem">+ Add pair</button>`
    : `<div style="font-size:0.72rem;color:var(--text3)">Need ≥ 2 numeric columns.</div>`;

  // ── SECTION 4: Polynomial ───────────────────────────────────────────────
  if (!Array.isArray(_automlFeatureEng.poly_cols)) _automlFeatureEng.poly_cols = [];
  const polySelected = _automlFeatureEng.poly_cols;
  const polyCount    = polySelected.length;
  const polyTerms    = polyCount >= 2 ? Math.round(polyCount * (polyCount - 1) / 2) : 0;
  const polyWarn     = polyCount > 8
    ? `<div style="font-size:0.68rem;color:var(--color-warning,#f87171);margin-top:0.45rem">
         ⚠ ${polyCount} cols selected → ${polyTerms} interaction terms — consider fewer columns</div>`
    : polyCount >= 2
    ? `<div style="font-size:0.68rem;color:var(--text3);margin-top:0.45rem">${polyTerms} interaction term${polyTerms===1?'':'s'} will be added</div>`
    : '';

  const sectionStyle = 'margin-bottom:1.1rem';
  const sectionTitle = `font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${_acc};margin-bottom:0.55rem`;

  const _feScr    = preserveScroll ? document.getElementById('main').scrollTop : 0;
  const _polyScr  = preserveScroll ? (document.getElementById('polyColList')?.scrollTop || 0) : 0;
  document.getElementById('main').innerHTML = `
    <div class="wizard">
      ${_automlStepsHTML(2, false)}
      <h2 style="font-size:1.25rem;font-weight:800;margin-bottom:0.25rem;color:${_acc}">Feature Engineering</h2>
      <p style="font-size:0.8rem;color:var(--text2);margin-bottom:0.7rem">
        Add derived features before training. All transforms are fit on training data only.
      </p>
      <div style="font-size:0.72rem;color:var(--text3);padding:0.4rem 0.65rem;border-radius:8px;
                  border:1px solid var(--border2);background:rgba(255,255,255,0.02);margin-bottom:1rem">
        ℹ FE-derived columns (e.g. log transforms, interaction terms) are added at training time,
          not during preprocessing. The column count on the next step will not reflect them.
      </div>

      <div style="${sectionStyle}">
        <div style="${sectionTitle}">Numeric Transforms</div>
        ${numCols.length === 0
          ? `<div style="font-size:0.78rem;color:var(--text3)">No numeric feature columns.</div>`
          : (() => {
              const _totalDerived = numCols.reduce((acc, c) => {
                const fe = _automlFeatureEng.numeric[c.name] || {};
                return acc
                  + ['log1p','sqrt','yeo_johnson','rank','outlier_flag','missing_flag'].filter(k => fe[k]).length
                  + (fe.bin && fe.bin !== 'none' ? 1 : 0);
              }, 0);
              const _totalSuffix = _totalDerived > 0
                ? `<div style="font-size:0.68rem;color:var(--text3);margin-top:0.4rem;opacity:0.75">
                     Total: <strong style="color:var(--active-accent,var(--accent-from))">${_totalDerived}</strong> derived column${_totalDerived===1?'':'s'} will be added
                   </div>`
                : '';
              return numRows + _totalSuffix;
            })()
        }
      </div>

      <div style="${sectionStyle}">
        <div style="${sectionTitle}">Date Columns</div>
        <div style="font-size:0.72rem;color:var(--text3);margin-bottom:0.45rem">
          Check any column that contains dates to extract time features from it.
        </div>
        ${dateRows}
      </div>

      <div style="${sectionStyle}">
        <div style="${sectionTitle}">Derived Features</div>
        ${derivedRows}
        ${addDerivedBtn}
      </div>

      <div style="${sectionStyle}">
        <div style="${sectionTitle}">Polynomial Interactions (degree 2)</div>
        ${numCols.length < 2
          ? `<div style="font-size:0.78rem;color:var(--text3)">Need ≥ 2 numeric columns.</div>`
          : `<div style="font-size:0.72rem;color:var(--text3);margin-bottom:0.5rem">
               Select columns to include — only pairwise interaction terms (e.g. Age × Fare) will be added.
             </div>
             <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.4rem">
               <button onclick="_polySelectAll()" style="font-size:0.63rem;padding:0.15rem 0.45rem;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer">All</button>
               <button onclick="_polySelectNone()" style="font-size:0.63rem;padding:0.15rem 0.45rem;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer">None</button>
               <span style="font-size:0.65rem;color:var(--text3);margin-left:0.3rem">${polyCount} selected</span>
             </div>
             <div id="polyColList" style="max-height:140px;overflow-y:auto;border:1px solid var(--border2);border-radius:8px;
                         padding:0.35rem 0.6rem;display:flex;flex-direction:column;gap:0.2rem">
               ${numCols.map(c => {
                 const on = polySelected.includes(c.name);
                 return `<label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;
                                      padding:0.18rem 0;font-size:0.78rem">
                   <input type="checkbox" ${on?'checked':''} style="accent-color:${_acc};flex-shrink:0"
                          onchange="_togglePolyCol('${c.name}',this.checked)">
                   <span style="color:${on ? _acc : 'var(--text2)'}">${c.name}</span>
                 </label>`;
               }).join('')}
             </div>
             ${polyWarn}`
        }
      </div>

      <div class="action-row">
        <button class="btn btn-clear" onclick="_renderAutoMLStep0()">← Back</button>
        <button class="btn btn-clear" onclick="_automlFeatureEng={numeric:{},dates:{},derived:[],poly_cols:[]};_renderAutoMLStep1b(_automlTargetCol)">Skip →</button>
        <button class="btn btn-primary" onclick="_renderAutoMLStep1b(_automlTargetCol)">Apply & Preprocess →</button>
      </div>
    </div>`;
  if (preserveScroll) requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('main').scrollTop = _feScr;
    const _pl = document.getElementById('polyColList');
    if (_pl && _polyScr) _pl.scrollTop = _polyScr;
  }));
}

function _toggleFEChipNum(el) {
  const col  = el.dataset.col;
  const type = el.dataset.t;
  if (!_automlFeatureEng.numeric[col]) _automlFeatureEng.numeric[col] = {};
  _automlFeatureEng.numeric[col][type] = !_automlFeatureEng.numeric[col][type];
  _renderAutoMLStep1c(true);
}

function _setBinMethod(col, method, btn) {
  if (!_automlFeatureEng.numeric[col]) _automlFeatureEng.numeric[col] = {};
  _automlFeatureEng.numeric[col].bin = method;
  _renderAutoMLStep1c(true);
}

function _markAsDate(col, checked) {
  if (checked) {
    if (!_automlFeatureEng.dates[col]) {
      _automlFeatureEng.dates[col] = { year: true, month: true, day: false, dow: false, quarter: false, is_weekend: false, days_since_min: false, cyclical: false, keep_original: false };
    }
  } else {
    delete _automlFeatureEng.dates[col];
  }
  _renderAutoMLStep1c(true);
}

function _toggleDateComp(col, key, val) {
  if (!_automlFeatureEng.dates[col]) _automlFeatureEng.dates[col] = {};
  _automlFeatureEng.dates[col][key] = val;
}

function _addDerivedFeature() {
  const a            = automlAnalysis;
  const effectTarget = _automlTargetCol || a.suggested_target;
  const numCols      = (a.columns || []).filter(c => c.is_numeric && c.name !== effectTarget);
  if (numCols.length < 2) return;
  _automlFeatureEng.derived.push({ op: 'ratio', col_a: numCols[0].name, col_b: numCols[1].name });
  _renderAutoMLStep1c(true);
}

function _togglePolyCol(col, checked) {
  if (!Array.isArray(_automlFeatureEng.poly_cols)) _automlFeatureEng.poly_cols = [];
  if (checked) {
    if (!_automlFeatureEng.poly_cols.includes(col)) _automlFeatureEng.poly_cols.push(col);
  } else {
    _automlFeatureEng.poly_cols = _automlFeatureEng.poly_cols.filter(c => c !== col);
  }
  _renderAutoMLStep1c(true);
}

function _polySelectAll() {
  const a = automlAnalysis;
  const effectTarget = _automlTargetCol || a.suggested_target;
  _automlFeatureEng.poly_cols = (a.columns || [])
    .filter(c => c.is_numeric && c.name !== effectTarget)
    .map(c => c.name);
  _renderAutoMLStep1c(true);
}

function _polySelectNone() {
  _automlFeatureEng.poly_cols = [];
  _renderAutoMLStep1c(true);
}

function _renderAutoMLStep2() {
  const a       = automlAnalysis;
  const palette = a.accent_palette || ACCENT_PALETTE_DEFAULT;
  // Prefer target from Step 0, then analysis suggestion
  const effectiveTarget = _automlTargetCol || a.suggested_target;
  const colOpts = a.columns
    .filter(c => c.name !== effectiveTarget)
    .map(c => `<option value="${c.name}">${c.name}</option>`)
    .join('');

let _amlResEst  = null;
let _amlResBase = null; // { rows, nCols, nCatCols } — stored so card can recompute with live FE

function _countFEDerivedCols() {
  const fe = _automlFeatureEng || {};
  let n = 0;
  // Numeric transforms
  for (const cfg of Object.values(fe.numeric || {})) {
    n += ['log1p','sqrt','yeo_johnson','rank','outlier_flag','missing_flag'].filter(k => cfg[k]).length;
    if (cfg.bin && cfg.bin !== 'none') n++;
  }
  // Date features
  for (const dcfg of Object.values(fe.dates || {})) {
    n += ['year','month','day','dow','quarter','is_weekend','days_since_min'].filter(k => dcfg[k]).length;
    if (dcfg.cyclical) n += 2;
  }
  // Interaction terms (ratio etc.)
  n += (fe.derived || []).length;
  // Polynomial pairwise interactions
  const pc = (fe.poly_cols || []).length;
  if (pc >= 2) n += Math.round(pc * (pc - 1) / 2);
  return n;
}

function _toggleOptunaTrials() {
  const checked = document.getElementById('amlOptuna')?.checked;
  const row = document.getElementById('amlOptunaTrialsRow');

function _amlSuggestTask() {
  const col = automlAnalysis.columns.find(c => c.name === document.getElementById('amlTarget').value);
  if (!col) return;

  let isClass, hint;
  if (!col.is_numeric) {
    isClass = true;
    hint = `Text column · ${col.nunique} unique values → Classification`;
  } else if (col.dtype && (col.dtype.startsWith('int') || col.dtype === 'bool')) {
    isClass = col.nunique <= 20;
    hint = isClass
      ? `Integer column · ${col.nunique} unique values → Classification`
      : `Integer column · ${col.nunique} unique values → Regression`;
  } else {
    // float column
    isClass = col.nunique <= 2;
    hint = isClass
      ? `Float column · ${col.nunique} unique values → Classification (binary)`
      : `Continuous float · ${col.nunique} unique values → Regression`;
  }

  document.querySelector(`input[name="amlTask"][value="${isClass ? 'classification' : 'regression'}"]`).checked = true;
  const hintEl = document.getElementById('amlTaskHint');
  if (hintEl) hintEl.textContent = `Auto-detected: ${hint}`;
}

async function runAutoML() {
  const modelName   = document.getElementById('amlModelName').value.trim();
  const targetCol   = document.getElementById('amlTarget').value;
  const taskEl      = document.querySelector('input[name="amlTask"]:checked');
  const accent      = document.documentElement.style.getPropertyValue('--active-accent')
                    || document.getElementById('amlAccent')?.value
                    || '#818cf8';
  const doTune      = document.getElementById('amlOptuna')?.checked || false;
  const nTrialsEl   = document.querySelector('input[name="amlTrials"]:checked');
  const nTrials     = nTrialsEl ? parseInt(nTrialsEl.value) : 20;

  if (!modelName) {
    document.getElementById('amlWizardErr').innerHTML =
      '<div class="js-err-box" style="margin-bottom:1rem">Please enter a model name.</div>';
    return;
  }
  if (!taskEl) return;
  const task = taskEl.value;

  const tuneSubtitle = doTune
    ? `Testing 4 algorithms with 5-fold CV, then tuning the winner with Optuna (${nTrials} trials)`
    : 'Testing Random Forest, XGBoost, LightGBM &amp; CatBoost with 5-fold cross-validation';

  document.getElementById('main').innerHTML = `
    <div class="wizard" style="text-align:center;padding:3rem 1rem">
      ${_automlStepsHTML(3, false)}
      <div style="font-size:1rem;font-weight:700;margin-bottom:1.25rem">
        Running AutoML&hellip;
      </div>
      <div style="font-size:0.8rem;color:var(--text3);margin-bottom:1.5rem">
        ${tuneSubtitle}
      </div>
      ${_progressBarHTML('amlFill','amlMsg','amlPct')}
    </div>`;

  const form = new FormData();
  form.append('file',                automlFile);
  form.append('model_name',          modelName);
  form.append('target_col',          targetCol);
  form.append('task',                task);
  form.append('algorithm',           'AutoML');
  form.append('accent',              accent);
  form.append('feature_engineering', JSON.stringify(_automlFeatureEng || {}));
  form.append('fe_b64',              automlFEB64 || '');
  form.append('pre_fe_cols_json',    JSON.stringify(automlPreFeCols   || []));
  form.append('pre_fe_sample_json',  JSON.stringify(automlPreFeSample || {}));
  form.append('tune',                doTune ? 'true' : 'false');
  form.append('n_trials',            String(nTrials));

  try {
    const res = await fetch(API + '/train', { method: 'POST', body: form });
    if (!res.ok) { const t = await res.text(); throw new Error(t); }

    let result = null;
    for await (const ev of _sseStream(res)) {
      if (ev.error) throw new Error(ev.error);
      if (ev.pct !== undefined) _updateProgressBar('amlFill','amlMsg','amlPct', ev.pct, ev.msg);
      if (ev.result) result = ev.result;
    }
    if (!result) throw new Error('No result received from server.');

    const mr = await fetch(API + '/models');
    allModels = await mr.json();
    renderSidebar();

    // Pre-load activeModel so SHAP/What-If tabs work without navigating away
    const schemaRes = await fetch(`${API}/schemas/${result.id}`).then(r => r.json()).catch(() => null);
    const foundModel = allModels.find(m => m.id === result.id);
    if (foundModel && schemaRes) {
      activeModel = { ...foundModel, schema: schemaRes };
      document.documentElement.style.setProperty('--active-accent', foundModel.accent);
    }

    _lastAutoMLResult = result;
    if (result.automl) _currentAutoMLData = result.automl;
    _renderAutoMLResultsPage(result);

  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="wizard">
        ${_automlStepsHTML(2, false)}
        <h2 style="font-size:1.3rem;font-weight:800;margin-bottom:1rem;color:var(--active-accent,#818cf8)">Configure AutoML</h2>

  }

function drawClusterPlot(canvasId, plotData, nClusters, accent) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas;
  const c   = ctx.getContext('2d');
  const W   = canvas.width, H = canvas.height;
  const PAD = 32;

  const CLUSTER_COLORS = [
    '#818cf8','#38bdf8','#34d399','#fbbf24',
    '#f87171','#fb923c','#a78bfa','#4ade80',
    '#e879f9','#fb7185','#2dd4bf','#facc15',
  ];

  const xs = plotData.map(p => p.x);
  const ys = plotData.map(p => p.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const xRange = xMax - xMin || 1, yRange = yMax - yMin || 1;

  const toX = x => PAD + ((x - xMin) / xRange) * (W - PAD * 2);
  const toY = y => H - PAD - ((y - yMin) / yRange) * (H - PAD * 2);

  c.clearRect(0, 0, W, H);
  plotData.forEach(p => {
    const color = CLUSTER_COLORS[p.cluster % CLUSTER_COLORS.length];
    c.beginPath();
    c.arc(toX(p.x), toY(p.y), 3.5, 0, Math.PI * 2);
    c.fillStyle = color + 'cc';
    c.fill();
  });
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function setAmbientTheme(c1, c2) {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const dim = rgba => rgba.replace(/([\d.]+)\)$/, (_, a) => (parseFloat(a) * 0.45).toFixed(3) + ')');
  const b1 = document.querySelector('.bg-blob-1');
  const b2 = document.querySelector('.bg-blob-2');
  if (b1) b1.style.background = isLight ? dim(c1) : c1;
  if (b2) b2.style.background = isLight ? dim(c2) : c2;
}
function setAmbientFromAccent(hex) {
  setAmbientTheme(hexToRgba(hex, 0.14), hexToRgba(hex, 0.09));
}
const AMBIENT_DEFAULT = ['rgba(99,102,241,0.14)', 'rgba(56,189,248,0.11)'];

function selectVisionModel(el) {

let batchFiles = [];
let batchURLs  = [];

function handleBatchFiles(e) {
  const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
  if (files.length) addBatchFiles(files);
}

function addBatchFiles(files) {
  batchURLs.forEach(u => URL.revokeObjectURL(u));
  batchFiles = files;
  batchURLs  = files.map(f => URL.createObjectURL(f));

  const toolbar = document.getElementById('vBatchToolbar');
  if (toolbar) toolbar.style.display = 'flex';
  const countEl = document.getElementById('vBatchCount');
  if (countEl) countEl.textContent = `${files.length} image${files.length !== 1 ? 's' : ''} selected`;

  renderBatchGrid();
  document.getElementById('vErr').innerHTML = '';
}

function renderBatchGrid() {
  const grid = document.getElementById('vBatchGrid');
  if (!grid) return;
  grid.innerHTML = batchFiles.map((f, i) => `
    <div class="batch-card" id="batch-card-${i}">
      <img src="${batchURLs[i]}" class="batch-card-img" alt="${f.name}">
      <div class="batch-card-body">
        <div class="batch-card-filename">${f.name}</div>
        <div class="batch-card-status" id="batch-status-${i}" style="color:var(--text3);font-size:0.72rem">Ready</div>
      </div>
    </div>`).join('');
}

function clearBatch() {
  batchURLs.forEach(u => URL.revokeObjectURL(u));
  batchFiles = []; batchURLs = [];
  const grid = document.getElementById('vBatchGrid');
  if (grid) grid.innerHTML = '';
  const toolbar = document.getElementById('vBatchToolbar');
  if (toolbar) toolbar.style.display = 'none';
  const progress = document.getElementById('vBatchProgress');
  if (progress) progress.style.display = 'none';
}

function _updateBatchProgress(done, total) {
  const textEl = document.getElementById('vProgressText');
  const barEl  = document.getElementById('vProgressBar');
  if (textEl) textEl.textContent = `${done} / ${total} classified`;
  if (barEl)  barEl.style.width  = `${(done / total * 100).toFixed(0)}%`;
}

function _updateBatchCard(i, state, data) {
  const card   = document.getElementById(`batch-card-${i}`);
  const status = document.getElementById(`batch-status-${i}`);
  if (!card || !status) return;

  if (state === 'running') {
    status.innerHTML = `<span class="spinner" style="width:11px;height:11px;border-width:2px;display:inline-block;vertical-align:middle"></span> Classifying…`;
  } else if (state === 'done') {
    const preds   = data.predictions || [];
    const top     = preds[0];
    const rest    = preds.slice(1, 3);
    const lowConf = data.low_confidence;
    const accent  = lowConf ? '#fbbf24' : '#e879f9';
    card.classList.add(lowConf ? 'batch-card--low' : 'batch-card--done');
    status.innerHTML = `
      <div class="batch-card-top-label">${top ? top.label : '—'}</div>
      <div class="batch-card-top-conf" style="color:${accent}">${top ? (top.confidence*100).toFixed(1)+'%' : ''}</div>
      ${rest.length ? `<div class="batch-card-top2">${rest.map(p => `${p.label} · ${(p.confidence*100).toFixed(1)}%`).join('<br>')}</div>` : ''}`;
  } else {
    card.classList.add('batch-card--error');
    status.innerHTML = `<span style="color:var(--color-danger);font-size:0.7rem">Failed</span>`;
  }
}

async function runBatchClassify() {
  if (!batchFiles.length) return;
  if (!VISION_API) {
    document.getElementById('vErr').innerHTML = `<div class="js-err-box">Vision service not connected.</div>`;
    return;
  }
  const btn      = document.getElementById('vClassifyBtn');
  const errEl    = document.getElementById('vErr');
  const topK     = parseInt(document.getElementById('vTopK').value) || 3;
  const progress = document.getElementById('vBatchProgress');

  btn.disabled  = true;
  btn.innerHTML = 'Classifying…';
  errEl.innerHTML = '';
  if (progress) progress.style.display = 'block';
  _updateBatchProgress(0, batchFiles.length);

  for (let i = 0; i < batchFiles.length; i++) {
    _updateBatchCard(i, 'running');
    const form = new FormData();
    form.append('file',       batchFiles[i]);
    form.append('model_name', visionModel);
    form.append('top_k',      topK);
    try {
      const res = await fetch(`${VISION_API}/classify-image`, { method: 'POST', body: form });
      if (!res.ok) throw new Error(await res.text());
      _updateBatchCard(i, 'done', await res.json());
    } catch {
      _updateBatchCard(i, 'error');
    }
    _updateBatchProgress(i + 1, batchFiles.length);
  }

  btn.disabled  = false;
  btn.innerHTML = 'Classify All →';
}

function renderVisionResult(data) {
  const preds   = data.predictions || [];
  const accent  = '#e879f9';
  const maxConf = preds.length ? preds[0].confidence : 1;
  const lowConf = data.low_confidence;

  const lowConfBanner = lowConf ? `
    <div style="padding:0.65rem 0.9rem;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.3);
                border-radius:8px;color:#fbbf24;font-size:0.82rem;margin-bottom:1rem;line-height:1.5">
      ⚠️ <strong>No confident match found</strong> — top score is only ${(data.top_confidence*100).toFixed(1)}%.
      This image likely doesn't belong to any of the 1,000 ImageNet categories,
      or is too ambiguous for the model to classify reliably.
    </div>` : '';

  const barsHTML = preds.map(p => `
    <div class="proba-row" style="margin-bottom:0.55rem">
      <div class="proba-name" style="width:180px;font-size:0.8rem">
        <span style="color:${accent};font-size:0.65rem;font-weight:700;margin-right:0.3rem">#${p.rank}</span>
        ${p.label}
      </div>
      <div class="proba-bar-wrap">
        <div class="proba-bar-fill" style="width:${(p.confidence/maxConf*100).toFixed(1)}%;background:${lowConf ? '#fbbf24' : accent}"></div>
      </div>
      <div class="proba-pct" style="color:${lowConf ? '#fbbf24' : accent}">${(p.confidence*100).toFixed(1)}%</div>
    </div>`).join('');

  document.getElementById('vResult').innerHTML = `
    <div class="result-state" style="display:block;margin-top:0.5rem">
      <div class="result-accent-bar" style="background:${lowConf ? '#fbbf24' : accent}"></div>
      <div class="result-body">
        ${lowConfBanner}
        <div class="vision-result-layout">
          <div class="vision-result-thumb">
            <img src="${visionImageURL}" class="vision-preview-img" alt="classified image">
            <div style="font-size:0.68rem;color:var(--text3);margin-top:0.4rem">${data.model_label}</div>
          </div>
          <div class="vision-result-preds">
            <div class="proba-section-label" style="margin-bottom:0.75rem">
              ${lowConf ? 'Best guesses (unreliable)' : 'Top Predictions'}
            </div>
            ${barsHTML}
          </div>
        </div>
      </div>
    </div>`;
}

let _imagenetClasses = null;

async function toggleCategoryBrowser() {
  const panel = document.getElementById('vCategoryPanel');
  if (!panel) return;

  if (panel.style.display !== 'none') {
    panel.style.display = 'none';
    document.getElementById('vCategoryBtn').textContent = 'Browse 1,000 categories ▸';
    return;
  }

  document.getElementById('vCategoryBtn').textContent = 'Loading…';
  if (!_imagenetClasses) {
    try {
      const r = await fetch(`${VISION_API}/imagenet-classes`);
      const d = await r.json();
      _imagenetClasses = d.classes || [];
    } catch(e) {
      document.getElementById('vCategoryBtn').textContent = 'Browse 1,000 categories ▸';
      return;
    }
  }

  panel.style.display = 'block';
  document.getElementById('vCategoryBtn').textContent = 'Browse 1,000 categories ▾';
  renderCategoryList('');
}

function renderCategoryList(query) {
  const grid = document.getElementById('vCategoryGrid');
  if (!grid || !_imagenetClasses) return;
  const q = query.toLowerCase();
  const filtered = q
    ? _imagenetClasses.filter(c => c.toLowerCase().includes(q))
    : _imagenetClasses;
  grid.innerHTML = filtered.length
    ? filtered.map((c, i) => `
        <div style="font-size:0.75rem;padding:0.2rem 0.4rem;border-radius:4px;
                    background:var(--border);color:var(--text2);white-space:nowrap;
                    overflow:hidden;text-overflow:ellipsis" title="${c}">
          ${c}
        </div>`).join('')
    : '<div style="color:var(--text3);font-size:0.8rem;grid-column:1/-1">No matches</div>';
  document.getElementById('vCategoryCount').textContent =
    q ? `${filtered.length} of 1,000 matching` : '1,000 categories';
}

let ipImageURL  = null;
let ipOperation = 'grayscale';

const IP_OPERATIONS = [

  ipFile = f;
  if (ipImageURL) URL.revokeObjectURL(ipImageURL);

  const preview = document.getElementById('ipPreviewSection');
  preview.style.display = 'block';

async function runImageProcess() {
  if (!ipFile) return;
  const btn   = document.getElementById('ipApplyBtn');
  const errEl = document.getElementById('ipErr');

  btn.innerHTML = '<span class="spinner"></span> Processing…';
  btn.disabled  = true;
  errEl.innerHTML = '';
  document.getElementById('ipResult').innerHTML = `
    <div style="text-align:center;padding:2rem 1rem;color:var(--text3)">
      <span class="spinner" style="width:20px;height:20px;border-width:3px;display:inline-block"></span>
      <div style="margin-top:0.75rem;font-size:0.82rem">Applying operation…</div>
    </div>`;

  const form = new FormData();
  form.append('file',      ipFile);
  form.append('operation', ipOperation);

  const op = IP_OPERATIONS.find(o => o.id === ipOperation);
  if (op) {
    op.params.forEach(p => {
      const el = document.getElementById(`ipParam_${p.name}`);
      if (el) form.append(p.name, el.value);
    });
  }

/* ── Shared XHR progress helper for vision panels ── */
function _postWithProgress(url, formData, resultId, accent, noteText) {
  return new Promise((resolve, reject) => {
    let pct = 0;
    let inferTid = null;
    let stopped = false;

    const barEl = () => document.getElementById(resultId + 'PBar');
    const lblEl = () => document.getElementById(resultId + 'PLbl');
    const setBar = (p, label) => {
      const b = barEl(); const l = lblEl();
      if (b) b.style.width = Math.round(p) + '%';
      if (l) l.textContent = label + ' · ' + Math.round(p) + '%';
    };

    document.getElementById(resultId).innerHTML = `
      <div style="padding:2.5rem 1.5rem;text-align:center">
        <div id="${resultId}PLbl" style="font-size:0.83rem;color:var(--text2);margin-bottom:0.9rem">Uploading · 0%</div>
        <div style="height:5px;background:var(--border2);border-radius:3px;overflow:hidden;max-width:300px;margin:0 auto">
          <div id="${resultId}PBar" style="height:100%;width:0%;background:${accent};border-radius:3px;transition:width 0.18s ease-out"></div>
        </div>
        <div style="font-size:0.7rem;color:var(--text3);margin-top:0.7rem;opacity:0.75">${noteText}</div>
      </div>`;

    const startInfer = () => {
      const tick = () => {
        if (stopped) return;
        pct = Math.min(90, pct + 0.65);
        setBar(pct, pct < 65 ? 'Running model' : 'Processing');
        if (pct < 90) inferTid = setTimeout(tick, 260);
      };
      pct = 30;
      tick();
    };

    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);

    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        pct = Math.min(28, Math.round((e.loaded / e.total) * 28));
        setBar(pct, 'Uploading');
      }
    });
    xhr.upload.addEventListener('load', () => { setBar(29, 'Uploading'); startInfer(); });

    xhr.addEventListener('load', () => {
      stopped = true; clearTimeout(inferTid); setBar(100, 'Complete');
      resolve({ status: xhr.status, ok: xhr.status >= 200 && xhr.status < 300,
        text: () => Promise.resolve(xhr.responseText),
        json: () => Promise.resolve(JSON.parse(xhr.responseText)) });
    });
    xhr.addEventListener('error',  () => { stopped = true; clearTimeout(inferTid); reject(new Error('Network error')); });
    xhr.addEventListener('abort',  () => { stopped = true; clearTimeout(inferTid); reject(new Error('Request aborted')); });

    xhr.send(formData);
  });
}

let _detRetryCount = 0;
let _detRetryTimer = null;

function cancelDetRetry() {
  if (_detRetryTimer) { clearTimeout(_detRetryTimer); _detRetryTimer = null; }

  document.getElementById('detErr').innerHTML = '';

async function runObjectDetect() {
  if (!detFile) return;
  const btn   = document.getElementById('detRunBtn');
  const errEl = document.getElementById('detErr');
  const conf  = parseInt(document.getElementById('detConf').value) / 100;

  btn.innerHTML = '<span class="spinner"></span> Detecting…';
  btn.disabled  = true;
  errEl.innerHTML = '';

  document.getElementById('detResult').innerHTML = `
    <div style="padding:2.5rem 1.5rem;text-align:center">
      ${_progressBarHTML('detFill','detMsg','detPct')}
      <div style="font-size:0.7rem;color:var(--text3);margin-top:0.7rem;opacity:0.75">First call downloads ~35 MB — may take up to 60 s on free tier</div>
    </div>`;

  const form = new FormData();
  form.append('file',       detFile);
  form.append('model_name', 'tiny_yolov3');
  form.append('confidence', conf);
  form.append('max_dets',   20);

  try {
    const res = await fetch(`${VISION_API}/detect-objects`, { method: 'POST', body: form });
    if (!res.ok) {
      const raw = await res.text();
      let msg;
      try { const j = JSON.parse(raw); msg = j.detail || raw; } catch { msg = raw; }
      if (res.status === 503) { showDetRetry(msg); return; }
      throw new Error(msg);
    }
    let data = null;
    for await (const ev of _sseStream(res)) {
      if (ev.error) throw new Error(ev.error);
      if (ev.pct !== undefined) _updateProgressBar('detFill','detMsg','detPct', ev.pct, ev.msg);
      if (ev.result) data = ev.result;
    }
    if (!data) throw new Error('No result received from server.');
    renderDetectionResult(data);
  } catch(e) {
    document.getElementById('detResult').innerHTML = '';
    errEl.innerHTML = `<div class="js-err-box">${e.message}</div>`;
  } finally {
    btn.innerHTML = 'Detect Objects →';
    btn.disabled  = false;
  }
}

function showDetRetry(msg) {
  const errEl = document.getElementById('detErr');
  const btn   = document.getElementById('detRunBtn');
  btn.innerHTML = 'Detect Objects →'; btn.disabled = false;
  if (_detRetryCount >= 3) {
    _detRetryCount = 0;
    errEl.innerHTML = `<div class="js-err-box">✗ Model unavailable after 3 attempts. Please try again later.</div>`;
    return;
  }
  _detRetryCount++;
  let secs = 20;
  const tick = () => {
    errEl.innerHTML = `<div class="js-warn-box">
      <span>⏳ ${msg} Auto-retrying in ${secs}s… (attempt ${_detRetryCount}/3)</span>
      <button onclick="cancelDetRetry()" style="padding:0.2rem 0.6rem;border:1px solid #fbbf2466;border-radius:6px;background:transparent;color:#fbbf24;cursor:pointer;font-size:0.78rem;flex-shrink:0">Stop</button>
    </div>`;
    if (secs-- > 0) { _detRetryTimer = setTimeout(tick, 1000); } else { runObjectDetect(); }
  };
  tick();
}

function renderDetectionResult(data) {
  const accent = '#38bdf8';
  const dets   = data.detections || [];

  const noneMsg = dets.length === 0 ? `
    <div style="padding:0.65rem 0.9rem;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.3);
                border-radius:8px;color:#fbbf24;font-size:0.82rem;margin-bottom:1rem">
      ⚠️ No objects detected above the confidence threshold. Try lowering it.
    </div>` : '';

  const tagsHTML = dets.map(d => {
    const color = DET_BOX_PALETTE[d.class_id % DET_BOX_PALETTE.length];
    return `<span class="det-tag" style="background:${color}22;border:1px solid ${color}55">
      <span class="det-tag-dot" style="background:${color}"></span>
      ${d.label} <span style="color:${color};font-weight:800">${(d.confidence*100).toFixed(0)}%</span>
    </span>`;
  }).join('');

  document.getElementById('detResult').innerHTML = `
    <div class="result-state" style="display:block;margin-top:0.5rem">
      <div class="result-accent-bar" style="background:${accent}"></div>
      <div class="result-body">
        ${noneMsg}
        <div class="proba-section-label" style="margin-bottom:0.75rem">
          ${data.count} object${data.count !== 1 ? 's' : ''} detected
          &nbsp;·&nbsp; confidence ≥ ${(data.confidence_threshold*100).toFixed(0)}%
          &nbsp;·&nbsp; ${data.orig_width}×${data.orig_height} px
        </div>
        <div class="ip-before-after">
          <div class="ip-image-box">
            <div class="ip-image-label">Original</div>
            <img src="${detImageURL}" class="ip-image-result" alt="original">
          </div>
          <div class="ip-image-box">
            <div class="ip-image-label">Detected</div>
            <img src="${data.image_b64}" class="ip-image-result" alt="detection result">
          </div>
        </div>
        <div style="margin-top:0.75rem">${tagsHTML}</div>
        ${data.count > 0 ? `
        <div style="margin-top:1rem">
          <a href="${data.image_b64}" download="detected_objects.png"
             class="btn btn-clear" style="text-decoration:none;font-size:0.8rem">
            ↓ Download
          </a>
        </div>` : ''}
      </div>
    </div>`;
}
