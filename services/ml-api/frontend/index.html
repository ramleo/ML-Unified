// ── Performance tab (regression: Actual vs Predicted + 95% CI) ─

function _perfScatterSVG(actual, predicted, accent, residStd) {
  const W = 360, H = 280, pad = 44;
  const cW = W - pad - 10, cH = H - pad - 18;
  const allV = [...actual, ...predicted];
  const vMin = Math.min(...allV), vMax = Math.max(...allV), vRng = (vMax - vMin) || 1;
  const xOf = v => pad + (v - vMin) / vRng * cW;
  const yOf = v => pad + (1 - (v - vMin) / vRng) * cH;
  // 95% CI band: ±1.96 * residual_std
  const ci = residStd * 1.96;
  const bandPts = [[vMin, vMin+ci],[vMax, vMax+ci],[vMax, vMax-ci],[vMin, vMin-ci]];
  const bandPath = bandPts.map((p, i) => `${i?'L':'M'}${xOf(p[0]).toFixed(1)},${yOf(p[1]).toFixed(1)}`).join(' ') + 'Z';
  const diagLine = `M${xOf(vMin).toFixed(1)},${yOf(vMin).toFixed(1)} L${xOf(vMax).toFixed(1)},${yOf(vMax).toFixed(1)}`;
  const step = actual.length > 150 ? Math.ceil(actual.length / 150) : 1;
  const dots = actual.filter((_, i) => i % step === 0).map((a, i) => {
    const pi = i * step;
    return `<circle cx="${xOf(a).toFixed(1)}" cy="${yOf(predicted[pi]).toFixed(1)}" r="2.5" fill="${accent}" opacity="0.6"/>`;
  }).join('');
  const ticks = [vMin, (vMin+vMax)/2, vMax].map(v => {
    const lbl = Math.abs(v) >= 1000 ? `${(v/1000).toFixed(1)}k` : v.toFixed(Math.abs(v) >= 10 ? 1 : 2);
    return `<text x="${xOf(v).toFixed(1)}" y="${pad+cH+13}" font-size="9" fill="var(--text3)" text-anchor="middle">${lbl}</text>
            <text x="${pad-5}" y="${yOf(v).toFixed(1)}" font-size="9" fill="var(--text3)" text-anchor="end" dominant-baseline="middle">${lbl}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:480px">
    <path d="${bandPath}" fill="${accent}" opacity="0.1"/>
    <path d="${diagLine}" stroke="${accent}" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${pad+cH}" stroke="var(--border2)" stroke-width="1"/>
    <line x1="${pad}" y1="${pad+cH}" x2="${pad+cW}" y2="${pad+cH}" stroke="var(--border2)" stroke-width="1"/>
    ${ticks}${dots}
    <text x="${pad+cW/2}" y="${H-2}" font-size="9" fill="var(--text3)" text-anchor="middle">Actual</text>
    <text x="10" y="${pad+cH/2}" font-size="9" fill="var(--text3)" text-anchor="middle" transform="rotate(-90,10,${pad+cH/2})">Predicted</text>
  </svg>`;
}

async function loadPerformance() {
  const el = document.getElementById('performanceView');
  if (!el || !activeModel) return;
  el.dataset.loaded = '1';
  el.innerHTML = `<div style="padding:2rem;color:var(--text3);font-size:0.8rem">Loading performance data…</div>`;
  try {
    const res = await fetch(`${API}/models/${activeModel.id}/actuals`);
    if (!res.ok) throw new Error('No performance data — retrain this model to generate it.');
    const d = await res.json();
    const ac = activeModel.accent || 'var(--accent-from)';
    const scatterHTML = _perfScatterSVG(d.actual, d.predicted, ac, d.residual_std);
    const mae  = d.mae  != null ? d.mae.toFixed(3)  : '—';
    const rmse = d.rmse != null ? d.rmse.toFixed(3) : '—';
    const r2   = d.r2   != null ? d.r2.toFixed(3)   : null;
    const ci95 = d.residual_std != null ? (d.residual_std * 1.96).toFixed(3) : '—';
    const chips = [
      `MAE <span>${mae}</span>`,
      `RMSE <span>${rmse}</span>`,
      `95% CI ±<span>${ci95}</span>`,
      ...(r2 ? [`R² <span>${r2}</span>`] : []),
    ].map(h => `<div class="perf-metric-chip">${h}</div>`).join('');
    el.innerHTML = `
      <div class="perf-card">
        <div class="perf-card-title">Actual vs Predicted</div>
        <div class="perf-metrics-row">${chips}</div>
        ${scatterHTML}
        <div style="display:flex;align-items:center;gap:0.6rem;margin-top:0.5rem;font-size:0.65rem;color:var(--text3)">
          <svg width="24" height="10" viewBox="0 0 24 10"><path d="M0 5 L24 5" stroke="${ac}" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/></svg> Perfect prediction line
          <svg width="20" height="10" viewBox="0 0 20 10"><rect x="0" y="2" width="20" height="6" fill="${ac}" opacity="0.18" rx="2"/></svg> 95% confidence band
        </div>
        <div class="perf-ci-note">
          <strong>What does 95% CI mean?</strong> The shaded band shows ±${ci95} around the perfect prediction line.
          If the model's errors are roughly symmetric, about 95 out of 100 new predictions will land inside this band.
          Points far outside the band are cases where the model struggled — worth investigating for outliers or missing features.
        </div>
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="perf-card" style="color:var(--text3);font-size:0.8rem">${e.message}</div>`;
  }
}

function _driftShell() {
  return `
    <div class="drift-mode-bar">
      <button class="drift-mode-btn${_driftMode === 'predictions' ? ' active' : ''}"
              onclick="_switchDriftMode('predictions')">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="3,2 13,8 3,14"/></svg>
        From predictions
      </button>
      <button class="drift-mode-btn${_driftMode === 'upload' ? ' active' : ''}"
              onclick="_switchDriftMode('upload')">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v9M4 6l4-4 4 4"/><path d="M2 13h12"/></svg>
        Upload dataset
      </button>
    </div>
    <div id="driftBody"></div>`;
}

function _switchDriftMode(mode) {
  _driftMode = mode;
  const el = document.getElementById('driftView');
  if (!el) return;
  el.innerHTML = _driftShell();
  if (mode === 'predictions') _loadDriftPredictions();
  else _showDriftUploadZone();
}

async function _loadDriftPredictions() {
  const body = document.getElementById('driftBody');
  if (!body) return;
  body.innerHTML = `<div class="drift-empty"><span class="spinner"></span> Loading…</div>`;
  try {
    const res = await fetch(`${API}/drift/${activeModel.id}`);
    if (!res.ok) throw new Error(res.status);
    body.innerHTML = renderDriftHTML(await res.json());
  } catch {
    body.innerHTML = `<div class="drift-empty">Drift data unavailable.</div>`;
  }
}

function _showDriftUploadZone() {
  const body = document.getElementById('driftBody');
  if (!body) return;
  body.innerHTML = `
    <div class="drift-upload-zone" id="driftUploadZone"
         onclick="document.getElementById('driftFileInput').click()"
         ondragover="event.preventDefault();this.classList.add('drag-over')"
         ondragleave="this.classList.remove('drag-over')"
         ondrop="event.preventDefault();this.classList.remove('drag-over');_handleDriftDrop(event)">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.45"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div class="drift-upload-label">Drop a CSV or click to browse</div>
      <div class="drift-upload-sub">Rows should match the model's input fields</div>
    </div>
    <input type="file" id="driftFileInput" accept=".csv" style="display:none"
           onchange="_handleDriftFile(this.files[0])">`;
}

function _handleDriftDrop(e) {
  const file = e.dataTransfer?.files?.[0];
  if (file) _handleDriftFile(file);
}

async function _handleDriftFile(file) {
  if (!file) return;
  const body = document.getElementById('driftBody');
  if (!body) return;
  body.innerHTML = `<div class="drift-empty"><span class="spinner"></span> Analysing ${file.name}…</div>`;
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch(`${API}/drift/${activeModel.id}/upload`, { method: 'POST', body: form });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    body.innerHTML = renderDriftHTML(data);
  } catch (err) {
    body.innerHTML = `<div class="drift-empty">Could not analyse file — check it matches the model's input columns.</div>`;
  }
}

function renderDriftHTML(data) {
  const accent = activeModel?.accent || 'var(--accent-from)';
  const { n_recent, overall_score, overall_level, features } = data;

  const DRIFT_ICONS = {
    low:    `<span class="drift-icon--low"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l3.5 3.5L13 4"/></svg></span>`,
    medium: `<span class="drift-icon--medium"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9 Q5 5 8 8 Q11 11 14 7"/></svg></span>`,
    high:   `<span class="drift-icon--high"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v6M8 11v2"/><circle cx="8" cy="8" r="7"/></svg></span>`,
  };
  const summaryIcon = DRIFT_ICONS[overall_level] || DRIFT_ICONS.low;
  const summaryText = overall_level === 'high' ? 'High drift detected' :
                      overall_level === 'medium' ? 'Moderate drift' : 'Input within expected range';

  const overallPct = Math.round((overall_score || 0) * 100);
  const summaryHTML = `
    <div class="drift-summary">
      <div class="drift-summary-icon">${summaryIcon}</div>
      <div style="flex:1">
        <div class="drift-summary-label">Overall drift</div>
        <div class="drift-summary-value">${summaryText}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem">
        <span class="drift-badge drift-badge--${overall_level}">${overall_level}</span>
        <span style="font-size:0.62rem;color:var(--text3)">score ${overallPct}%</span>
      </div>
    </div>`;

  // ── Trend sparkline ────────────────────────────────────────────────────────
  const trendHTML = _renderDriftTrend(data.trend || []);

  if (n_recent === 0) {
    return summaryHTML + trendHTML + `<div class="drift-empty">Make a few predictions to see per-feature drift analysis.</div>`;
  }

  // ── Per-feature cards ──────────────────────────────────────────────────────
  const featHTML = features.map(f => {
    const pct = Math.round(f.drift_score * 100);

    // PSI badge
    const psiTag = f.psi != null
      ? `<span class="drift-psi drift-psi--${f.psi_level}" title="Population Stability Index">PSI ${f.psi.toFixed(3)}</span>`
      : '';

    // Null rate warning (only if > 0)
    const nullTag = (f.null_rate > 0)
      ? `<span class="drift-null" title="Missing value rate">
           <svg width="9" height="9" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/><text x="5" y="8" text-anchor="middle" fill="white" font-size="8" font-weight="bold">!</text></svg>
           ${Math.round(f.null_rate * 100)}% null
         </span>`
      : '';

    const topRow = `
      <div class="drift-feature-top">
        <div class="drift-fname">${f.label}${nullTag}</div>
        <span class="drift-badge drift-badge--${f.drift_level}">${f.drift_level}</span>${psiTag}
      </div>
      <div class="drift-score-wrap">
        <div class="drift-score-fill drift-score-fill--${f.drift_level}" style="width:${pct}%"></div>
      </div>`;

    if (f.type === 'numeric') {
      const refLine    = f.ref_mean !== null ? `${f.ref_mean.toFixed(2)} ± ${f.ref_std.toFixed(2)}` : '—';
      const recentLine = f.recent_mean !== null ? `${f.recent_mean.toFixed(2)} ± ${(f.recent_std||0).toFixed(2)}` : '—';

      // KS test line (upload mode only)
      const ksLine = (f.ks_stat != null)
        ? `<div class="drift-ks">KS stat: <strong>${f.ks_stat.toFixed(3)}</strong> · p-value: <strong>${f.ks_pvalue < 0.001 ? '<0.001' : f.ks_pvalue.toFixed(3)}</strong>${f.ks_pvalue <= 0.05 ? ' — significant' : ' — within range'}</div>`
        : '';

      // Distribution histogram
      const histHTML = _renderDriftHistogram(f.histogram, accent);

      return `<div class="drift-feature">
        ${topRow}
        <div class="drift-stats">
          <div class="drift-stat"><div class="drift-stat-label">Expected</div><div class="drift-stat-val">${refLine}</div></div>
          <div class="drift-stat"><div class="drift-stat-label">Recent (${f.n_recent})</div><div class="drift-stat-val">${recentLine}</div></div>
          <div class="drift-stat"><div class="drift-stat-label">Drift score</div><div class="drift-stat-val">${pct}%</div></div>
        </div>
        ${histHTML}
        ${ksLine}
      </div>`;
    } else if (f.high_cardinality) {
      return `<div class="drift-feature">
        ${topRow}
        <div class="drift-cat-note" style="margin-top:0.6rem;font-style:normal;color:var(--text2)">
          High-cardinality column — <strong>${f.n_opts}</strong> unique values in training,
          <strong>${f.n_unique_recent}</strong> in recent data. Per-value drift not shown.
        </div>
      </div>`;
    } else {
      const bars = f.options.map(opt => {
        const refPct    = Math.round((f.ref_dist[opt]    || 0) * 100);
        const recentPct = Math.round((f.recent_dist[opt] || 0) * 100);
        return `<div class="drift-cat-row">
          <div class="drift-cat-name" title="${opt}">${opt}</div>
          <div class="drift-cat-bar-wrap">
            <div class="drift-cat-bar-ref"    style="width:${refPct}%"></div>
            <div class="drift-cat-bar-recent" style="width:${recentPct}%;background:${accent}"></div>
          </div>
          <div class="drift-cat-pct">${recentPct}%</div>
        </div>`;
      }).join('');
      const catNote = f.cat_baseline === 'training'
        ? 'Reference from training data'
        : 'Reference assumes uniform distribution';
      return `<div class="drift-feature">
        ${topRow}
        <div class="drift-cat-bars">${bars}</div>
        <div class="drift-cat-note">${catNote}</div>
      </div>`;
    }
  }).join('');

  const baselineNote = data.baseline === 'training'
    ? 'Numeric baseline from training data'
    : 'Numeric baseline estimated from field ranges';
  const sourceNote = data.source === 'upload'
    ? `${baselineNote} · ${n_recent} row${n_recent === 1 ? '' : 's'} from ${data.filename || 'uploaded file'}`
    : `${baselineNote} · ${n_recent} recent prediction${n_recent === 1 ? '' : 's'} in window`;

  return `
    ${summaryHTML}
    ${trendHTML}
    <div class="drift-features">${featHTML}</div>
    <div class="drift-note">${sourceNote} · PSI &lt; 0.10 stable / 0.10–0.25 caution / &gt; 0.25 unstable</div>`;
}

function _renderDriftHistogram(bins, accent) {
  if (!bins || bins.length === 0) return '';
  const binsHTML = bins.map(b => {
    const rh = Math.round(b.ref_h * 100);
    const ah = Math.round(b.actual_h * 100);
    return `<div class="drift-hist-bin">
      <div class="drift-hist-ref"    style="height:${rh}%"></div>
      <div class="drift-hist-actual" style="height:${ah}%;background:${accent}"></div>
    </div>`;
  }).join('');
  return `
    <div class="drift-hist">${binsHTML}</div>
    <div class="drift-hist-legend">
      <div class="drift-hist-key"><div class="drift-hist-swatch" style="background:var(--border2)"></div>Expected</div>
      <div class="drift-hist-key"><div class="drift-hist-swatch" style="background:${accent}"></div>Actual</div>
    </div>`;
}

function _renderDriftTrend(trend) {
  if (!trend || trend.length < 2) return '';
  const W = 400, H = 36, pad = 6;
  const cW = W - pad * 2, cH = H - pad * 2;
  const n  = trend.length;
  const scores = trend.map(t => t.overall_score || 0);
  const maxS   = Math.max(...scores, 0.01);

  const pts = scores.map((s, i) => ({
    x: pad + (i / (n - 1)) * cW,
    y: pad + (1 - s / maxS) * cH,
  }));

  const linePath = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const fillPath = `${linePath} L${pts[n-1].x.toFixed(1)},${(pad+cH).toFixed(1)} L${pts[0].x.toFixed(1)},${(pad+cH).toFixed(1)} Z`;

  const lastLevel = trend[trend.length - 1]?.overall_level || 'low';
  const lineColor = lastLevel === 'high' ? '#f87171' : lastLevel === 'medium' ? '#fbbf24' : '#34d399';

  return `<div class="drift-trend">
    <div class="drift-trend-label">Drift history (${n} snapshot${n===1?'':'s'})</div>
    <svg class="drift-trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${fillPath}" fill="${lineColor}" opacity="0.12"/>
      <path d="${linePath}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => i === n - 1 ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${lineColor}"/>` : '').join('')}
    </svg>
  </div>`;
}

function selectWhatifFeature(btn, fieldName) {
  document.querySelectorAll('.whatif-chip').forEach(c => c.classList.toggle('active', c === btn));
  runWhatifSweep(fieldName);
}

async function runWhatifSweep(fieldName) {
  const chartEl = document.getElementById('whatifChart');
  if (!chartEl) return;
  chartEl.innerHTML = `<div class="pipe-loading"><span class="spinner"></span> Computing…</div>`;
  const m = activeModel;
  const schema = m.schema;
  const field = schema.fields.find(f => f.name === fieldName);
  if (!field) return;
  const sample = schema.sample || {};
  const base = {};
  schema.fields.forEach(f => { base[f.name] = sample[f.name] ?? null; });

  const sweepVals = field.type === 'select'
    ? field.options.map(o => o.value)
    : (() => {
        const mn = field.min ?? 0, mx = field.max ?? 1, n = 20;
        const vals = Array.from({length: n}, (_, i) => mn + (mx - mn) * i / (n - 1));
        const dec = field.step ? (field.step.toString().split('.')[1] || '').length : 2;
        return vals.map(v => parseFloat(v.toFixed(dec)));
      })();

  try {
    const predictions = await Promise.all(sweepVals.map(async val => {
      const res = await fetch(`${API}/predict/${m.id}`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({...base, [fieldName]: val}),
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      let y;
      if (schema.task === 'classification') {
        const p = data.probabilities || [];
        y = p.length === 2 ? p[1] : Math.max(...p);
      } else {
        y = data.prediction;
      }
      return {x: val, y};
    }));
    chartEl.innerHTML = drawWhatifChart(predictions, field, schema);
  } catch {
    chartEl.innerHTML = `<div class="train-no-data">Sweep failed — try another feature.</div>`;
  }
}

function drawWhatifChart(points, field, schema) {
  const accent = document.documentElement.style.getPropertyValue('--active-accent') || activeModel?.accent || 'var(--accent-from)';
  const isCat  = field.type === 'select';
  const isClf  = schema.task === 'classification';
  const W = 400, H = 130, padL = 46, padR = 12, padT = 16, padB = 34;
  const cW = W - padL - padR, cH = H - padT - padB;

  const ys = points.map(p => p.y);
  const yMin = isClf ? 0 : Math.min(...ys);
  const yMax = isClf ? 1 : Math.max(...ys);
  const yRng = (yMax - yMin) || 1;
  const xOf  = i => isCat ? padL + (i + 0.5) * cW / points.length : padL + (i / (points.length - 1)) * cW;
  const yOf  = v => padT + (1 - (v - yMin) / yRng) * cH;

  const pts = points.map((p, i) => ({...p, sx: xOf(i), sy: yOf(p.y)}));

  // Line path + fill (numeric only)
  const linePath = !isCat
    ? pts.map((p, i) => `${i ? 'L' : 'M'}${p.sx.toFixed(1)},${p.sy.toFixed(1)}`).join(' ') : '';
  const fillPath = !isCat
    ? `${linePath} L${pts[pts.length-1].sx.toFixed(1)},${(padT+cH).toFixed(1)} L${pts[0].sx.toFixed(1)},${(padT+cH).toFixed(1)} Z` : '';

  // Y axis ticks
  const yTicks = isClf
    ? [0, 0.25, 0.5, 0.75, 1].map(v => ({v, label: `${(v*100).toFixed(0)}%`}))
    : [yMin, (yMin+yMax)/2, yMax].map(v => ({v, label: v >= 1000 ? `${(v/1000).toFixed(1)}k` : v.toFixed(v >= 10 ? 0 : 1)}));

  // X axis labels
  const xLabels = isCat
    ? pts.map(p => ({sx: p.sx, label: String(p.x).slice(0, 12)}))
    : [pts[0], pts[Math.floor(pts.length/2)], pts[pts.length-1]].map(p => ({
        sx: p.sx,
        label: field.step >= 1 || !field.step ? Math.round(p.x) : p.x.toFixed(1),
      }));

  // Sample value marker
  const sampleVal = schema.sample?.[field.name];
  const markerX   = (!isCat && sampleVal != null)
    ? padL + ((sampleVal - (field.min ?? 0)) / ((field.max ?? 1) - (field.min ?? 0))) * cW : null;

  // Y axis label
  const yLabel = isClf
    ? (schema.output?.class_names?.[1] ?? 'Positive class') + ' probability'
    : schema.output?.target_col ?? 'Prediction';

  // Cat bars
  const catBars = isCat ? pts.map(p => {
    const bw = cW / pts.length * 0.58;
    const bh = ((p.y - yMin) / yRng) * cH;
    return `<rect x="${(p.sx - bw/2).toFixed(1)}" y="${(padT+cH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${accent}" opacity="0.8"/>`;
  }).join('') : '';

  return `
    <div class="train-curve-meta">
      <span class="train-curve-label">${field.label || field.name}</span>
      <span class="train-curve-range">${yLabel}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" class="train-sparkline" style="height:${H}px">
      <defs>
        <linearGradient id="wg${field.name.replace(/\W/g,'')}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${accent}" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${yTicks.map(t => {
        const sy = yOf(t.v).toFixed(1);
        return `<line x1="${padL}" y1="${sy}" x2="${W-padR}" y2="${sy}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>
                <text x="${padL-5}" y="${sy}" font-size="9" fill="var(--text3)" text-anchor="end" dominant-baseline="middle">${t.label}</text>`;
      }).join('')}
      <line x1="${padL}" y1="${padT+cH}" x2="${W-padR}" y2="${padT+cH}" stroke="var(--border2)" stroke-width="1"/>

// ── Predict ───────────────────────────────────────────────────
async function runPredict() {
  const btn  = document.getElementById('predictBtn');
  const errEl = document.getElementById('errState');
  const emptyEl  = document.getElementById('emptyState');
  const resultEl = document.getElementById('resultState');

  // Collect form data
  const data = {};
  let missing = false;
  document.querySelectorAll('#pForm .inp').forEach(el => {
    const val = el.value.trim();
    if (!val) { missing = true; return; }
    // Coerce numbers
    if (el.type === 'number') {
      data[el.name] = parseFloat(val);
    } else {
      // Try numeric coercion for select options that are numeric
      const num = Number(val);
      data[el.name] = (!isNaN(num) && val !== '') ? num : val;
    }
  });

  if (missing) {
    errEl.textContent = 'Please fill in all fields before predicting.';
    errEl.style.display = 'block';
    emptyEl.style.display  = 'none';
    resultEl.style.display = 'none';
    return;
  }

  // Loading state with shimmer
  btn.innerHTML = '<span class="spinner"></span> Predicting…';
  btn.disabled  = true;
  btn.classList.add('btn-shimmer');
  errEl.style.display = 'none';

  try {
    const res = await fetch(`${API}/predict/${activeModel.id}`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(data),
    });
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const result = await res.json();
    renderResult(result);
    emptyEl.style.display  = 'none';
    resultEl.style.display = 'block';
    resultEl.classList.remove('result-reveal');
    void resultEl.offsetWidth;
    resultEl.classList.add('result-reveal');
    // Success flash on button
    btn.classList.remove('btn-shimmer');
    btn.innerHTML = 'Predict →';
    btn.disabled  = false;
    btn.classList.add('btn-success-flash');
    setTimeout(() => btn.classList.remove('btn-success-flash'), 900);
    // Fetch SHAP asynchronously — don't block the prediction result
    if (activeModel.schema.task !== 'clustering') fetchAndRenderShap(data);
    return;
  } catch(e) {
    errEl.textContent = `Prediction failed: ${e.message}`;
    errEl.style.display = 'block';
    emptyEl.style.display = 'none';
    resultEl.style.display = 'none';
  } finally {
    btn.classList.remove('btn-shimmer');
    btn.innerHTML = 'Predict →';
    btn.disabled  = false;
  }
}

// ── Render result ─────────────────────────────────────────────
function renderResult(result) {
  const m      = activeModel;
  const schema = m.schema;
  const body   = document.getElementById('resultBody');

  if (schema.task === 'classification') {
    const classes     = result.classes || [];
    const classNames  = result.class_names || classes.map(String);
    const proba       = result.probabilities || [];
    const rawPred     = result.prediction;

    // Find display name for prediction
    const predIdx = classes.findIndex(c => String(c) === String(rawPred));
    const displayPred = predIdx >= 0 ? classNames[predIdx] : rawPred;

    // SVG icons per model
    const icons = {
      iris: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${m.accent}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8 2 5 5 5 9c0 4 3 7 7 11 4-4 7-7 7-11 0-4-3-7-7-7z"/><path d="M12 2v20M5 9h14"/></svg>`,
      titanic: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${m.accent}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l1-6h16l1 6"/><path d="M7 11V7l5-3 5 3v4"/><path d="M1 20c2-2 4-3 6-2s4 2 6 0 4-3 6-2"/></svg>`,
      diabetes: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${m.accent}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 015 5c0 5-5 11-5 11S7 12 7 7a5 5 0 015-5z"/><circle cx="12" cy="7" r="2"/></svg>`,
      insurance: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${m.accent}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 5-3 8-7 11C8 19 5 16 5 11V5l7-3z"/><path d="M9 12l2 2 4-4"/></svg>`,
    };
    const icon = icons[m.id] || `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${m.accent}" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>`;

    body.innerHTML = `
      <div class="result-class-main">
        <div class="result-class-icon" style="background:${m.accent}22">
          ${icon}
        </div>
        <div>
          <div class="result-class-label">${schema.output && schema.output.target_col ? schema.output.target_col : 'Prediction'}</div>
          <div class="result-class-value" style="color:${m.accent}">${displayPred}</div>
        </div>
      </div>
      <div class="proba-section">
        <div class="proba-section-header">
          <span class="proba-section-label">Confidence</span>
          <span class="proba-section-sub">probability per class</span>
        </div>
        <div class="proba-rows">
        ${proba.map((p, i) => {
          const winner = i === predIdx;
          const pct = (p*100).toFixed(1);
          return `
          <div class="proba-row${winner ? ' proba-row--winner' : ''}">
            <div class="proba-row-top">
              <div class="proba-name">
                ${classNames[i] || classes[i] || i}
                ${winner ? '<span class="proba-winner-badge">Predicted</span>' : ''}
              </div>
              <div class="proba-pct" style="color:${winner ? m.accent : 'var(--text3)'}">${pct}%</div>
            </div>
            <div class="proba-bar-wrap">
              <div class="proba-bar-fill" data-w="${pct}" data-delay="${i * 80}"
                   style="width:0%;background:${winner ? `linear-gradient(90deg,${m.accent}99,${m.accent})` : `rgba(255,255,255,0.08)`}"></div>
            </div>
          </div>`;
        }).join('')}
        </div>

    `;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('.proba-bar-fill[data-w]').forEach(bar => {
        const delay = parseInt(bar.dataset.delay || '0');
        setTimeout(() => { bar.style.width = bar.dataset.w + '%'; }, delay);
      });
    }));
  } else if (schema.task === 'clustering') {
    const cluster = result.prediction;
    const label   = result.cluster_label || ('Cluster ' + (cluster + 1));
    const total   = (schema.output && schema.output.n_clusters) || result.n_clusters || '?';
    body.innerHTML = `
      <div class="result-cluster-main">
        <div class="result-cluster-badge" style="background:${m.accent}22;border-color:${m.accent}55">
          <div class="result-cluster-icon" style="color:${m.accent}">◆</div>

          <div class="result-cluster-value" style="color:${m.accent}">${label}</div>

        </div>

  } else {

    const output = schema.output || {};
    const unit   = output.unit  || '';
    const label  = output.target_col || output.sublabel || output.label || 'Predicted Value';
    const val    = typeof result.prediction === 'number'
      ? result.prediction.toLocaleString('en-IN', { maximumFractionDigits: 0 })
      : result.prediction;

    const numericVal = typeof result.prediction === 'number' ? result.prediction : null;

    if (numericVal !== null) {
      const el = document.getElementById('regVal');
      if (el) countUp(el, numericVal, unit, 700);
    }
  }
}

// ── SHAP Feature Impact ───────────────────────────────────────
async function fetchAndRenderShap(data) {
  const panel   = document.getElementById('shapPanel');
  const body    = document.getElementById('shapBody');
  if (!panel || !body) return;

  panel.classList.add('visible');
  body.innerHTML = `<div class="shap-loading" style="padding:1rem 0">${_progressBarHTML('shapFill','shapMsg','shapPct')}</div>`;

  try {
    const res = await fetch(`${API}/shap/${activeModel.id}`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(data),
    });
    if (!res.ok) throw new Error(`${res.status}`);

    let shap = null;
    for await (const ev of _sseStream(res)) {
      if (ev.error) throw new Error(ev.error);
      if (ev.pct !== undefined) _updateProgressBar('shapFill','shapMsg','shapPct', ev.pct, ev.msg);
      if (ev.result) shap = ev.result;
    }
    if (shap) renderShap(shap);
    else throw new Error('No SHAP result received.');
  } catch (e) {
    body.innerHTML = `<div class="shap-loading" style="color:var(--text3)">Feature impact unavailable${e.message ? ': ' + e.message : ''}</div>`;
  }
}

function renderShap(shap) {
  const body = document.getElementById('shapBody');
  if (!body) return;

  const features = shap.features || [];
  if (!features.length) {
    body.innerHTML = '<div class="shap-loading">No features to display</div>';
    return;
  }

  const maxAbs = Math.max(...features.map(f => Math.abs(f.shap)), 0.001);

  body.innerHTML = `
    <div class="shap-body">
      ${features.map(f => {
        const isPos  = f.shap >= 0;
        const pct    = Math.min((Math.abs(f.shap) / maxAbs) * 48, 48); // max 48% of half-width
        const barStyle = isPos
          ? `left:50%;width:0%`
          : `right:50%;width:0%`;
        const sign   = isPos ? '+' : '';
        return `
        <div class="shap-row">
          <div class="shap-feat-name" title="${f.label}">${f.label}</div>
          <div class="shap-bar-wrap">
            <div class="shap-bar-center"></div>
            <div class="shap-bar-fill ${isPos ? 'pos' : 'neg'}" data-pct="${pct}" style="${barStyle}"></div>
          </div>
          <div class="shap-val ${isPos ? 'pos' : 'neg'}">${sign}${f.shap.toFixed(3)}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="shap-base">Base value (avg prediction): <strong>${shap.base_value.toFixed(3)}</strong></div>
  `;

  // Animate bars in
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.shap-bar-fill[data-pct]').forEach(bar => {
      bar.style.width = bar.dataset.pct + '%';
    });
  }));
}

async function runCustomShap() {
  const modelFile = document.getElementById('shapModelFile')?.files?.[0];

  const btn       = document.getElementById('shapRunBtn');

  if (!modelFile) { resultEl.innerHTML = '<div class="err-state" style="display:block">Please upload a .pkl model file.</div>'; return; }
  if (!dataFile)  { resultEl.innerHTML = '<div class="err-state" style="display:block">Please upload a CSV data file.</div>'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Computing…';
  resultEl.innerHTML = '';

  const form = new FormData();
  form.append('model_file', modelFile);
  form.append('data_file',  dataFile);

  try {
    const res = await fetch(`${API}/shap/custom/upload`, { method: 'POST', body: form });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
      throw new Error(err.detail || `Server error ${res.status}`);
    }
    const shap = await res.json();

    // Reuse renderShap logic but inject into #shapCustomResult
    const features = shap.features || [];
    const maxAbs = Math.max(...features.map(f => Math.abs(f.shap)), 0.001);

    resultEl.innerHTML = `
      <div class="shap-panel visible" style="margin-top:0">
        <div class="shap-header">
          <span class="shap-title">Feature Impact</span>
          <span class="shap-subtitle">${shap.task} · base ${shap.base_value.toFixed(3)}</span>
        </div>
        <div class="shap-body">
          ${features.map(f => {
            const isPos = f.shap >= 0;
            const pct   = Math.min((Math.abs(f.shap) / maxAbs) * 48, 48);
            const barStyle = isPos ? 'left:50%;width:0%' : 'right:50%;width:0%';
            return `
              <div class="shap-row">
                <div class="shap-feat-name" title="${f.label}">${f.label}</div>
                <div class="shap-bar-wrap">
                  <div class="shap-bar-center"></div>

                </div>
                <div class="shap-val ${isPos?'pos':'neg'}">${isPos?'+':''}${f.shap.toFixed(3)}</div>

        </div>
        <div class="shap-base">Base value: <strong>${shap.base_value.toFixed(3)}</strong></div>
      </div>`;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('#shapCustomResult .shap-bar-fill[data-pct]').forEach(bar => {
        bar.style.width = bar.dataset.pct + '%';
      });
    }));
  } catch (e) {
    resultEl.innerHTML = `<div class="err-state" style="display:block">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Compute Feature Impact →';
  }
}

  // Sync --active-accent with the initially selected swatch

// ── Analyze CSV ───────────────────────────────────────────────
async function analyzeCSV() {
  document.getElementById('main').innerHTML = `
    <div class="wizard" style="text-align:center;padding:3rem 1rem">
      ${wizardStepsHTML(1, false)}
      <div style="font-size:2.5rem;margin-bottom:1rem">&#x1F50D;</div>
      <div style="font-size:1rem;font-weight:700;margin-bottom:0.5rem">Analysing your dataset&hellip;</div>
      <div id="analyzeSubMsg" style="font-size:0.82rem;color:var(--text3);margin-bottom:1.5rem">Reading columns and detecting types</div>
      <span class="spinner" style="width:22px;height:22px;border-width:3px"></span>
    </div>`;
  const wake = setTimeout(() => {
    const el = document.getElementById('analyzeSubMsg');
    if (el) el.textContent = 'Waking up server — this can take up to 60 s on the free tier…';
  }, 5000);
  const form = new FormData();
  form.append('file', wizardFile);
  try {
    const res = await fetch(API + '/analyze', { method: 'POST', body: form });
    clearTimeout(wake);
    if (!res.ok) { const t = await res.text(); throw new Error(t); }
    wizardAnalysis = await res.json();
    renderWizardStep2();
  } catch(e) {
    clearTimeout(wake);
    document.getElementById('main').innerHTML = `
      <div class="wizard" style="text-align:center;padding:3rem 1rem">
        ${wizardStepsHTML(1, false)}
        <div style="font-size:2rem;margin-bottom:1rem">&#x26A0;</div>
        <div style="font-size:0.95rem;font-weight:700;margin-bottom:0.5rem;color:#f87171">Analysis failed</div>
        <div style="font-size:0.82rem;color:var(--text3);margin-bottom:1.5rem;max-width:360px;margin-left:auto;margin-right:auto">${e.message}</div>
        <button class="btn btn-clear" onclick="renderWizardStep1()">← Try again</button>
      </div>`;
  }
}

// ── SSE streaming helpers ─────────────────────────────────────
async function* _sseStream(response) {
  const reader  = response.body.getReader();
  const decoder = new TextDecoder();
  let   buffer  = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (line.startsWith('data: ')) {
        try { yield JSON.parse(line.slice(6)); } catch {}
      }
    }
  }
  if (buffer.startsWith('data: ')) {
    try { yield JSON.parse(buffer.slice(6)); } catch {}
  }
}

// ── AutoML report ─────────────────────────────────────────────
let _currentAutoMLData = null;

function _renderExplanationDashboard(explanation, cv_results, feature_importance, accent, winner, can_upgrade, isReg, selection_metric, winner_metrics, vizData) {
  let exp;
  if (typeof explanation === 'string') {
    exp = { why_won: explanation, score_analysis: '', key_drivers: '', recommendations: [], actionable_insights: [] };
  } else if (explanation && typeof explanation === 'object') {
    exp = explanation;
  } else {
    exp = { why_won: '', score_analysis: '', key_drivers: '', recommendations: [], actionable_insights: [] };
  }
  const recs     = Array.isArray(exp.recommendations)     ? exp.recommendations     : [];
  const insights = Array.isArray(exp.actionable_insights) ? exp.actionable_insights : [];
  const wm  = winner_metrics || {};
  const viz = vizData || {};

  // ── Confusion matrix (classification) ────────────────────────
  function _confusionMatrixSVG(cm, classNames, ac) {
    if (!cm || !cm.length) return '<div style="font-size:0.74rem;color:var(--text3)">Run a new analysis to see confusion matrix</div>';
    const n    = cm.length;
    const show = Math.min(n, 5);
    const names = (classNames || []).slice(0, show);
    const W = 320, pad = 50, cell = (W - pad) / show;
    const maxVal = Math.max(...cm.flat());
    const rows = cm.slice(0, show).map((row, i) =>
      row.slice(0, show).map((v, j) => {
        const isDiag = i === j;
        const intensity = maxVal > 0 ? v / maxVal : 0;
        const bg = isDiag
          ? `${ac}${Math.round(30 + intensity * 180).toString(16).padStart(2,'0')}`
          : `rgba(255,255,255,${(intensity * 0.25).toFixed(2)})`;
        const tx = isDiag ? ac : (intensity > 0.4 ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)');
        const x = pad + j * cell, y = pad + i * cell;
        return `<rect x="${x}" y="${y}" width="${cell-2}" height="${cell-2}" rx="3" fill="${bg}"/>
                <text x="${x + cell/2 - 1}" y="${y + cell/2}" font-size="${cell > 40 ? 11 : 9}" font-weight="700" fill="${tx}" text-anchor="middle" dominant-baseline="middle">${v}</text>`;
      }).join('')
    ).join('');
    const xLabels = names.map((nm, j) =>
      `<text x="${pad + j*cell + cell/2 - 1}" y="${pad - 7}" font-size="9" fill="var(--text3)" text-anchor="middle">${String(nm).slice(0,8)}</text>`
    ).join('');
    const yLabels = names.map((nm, i) =>
      `<text x="${pad - 5}" y="${pad + i*cell + cell/2}" font-size="9" fill="var(--text3)" text-anchor="end" dominant-baseline="middle">${String(nm).slice(0,8)}</text>`
    ).join('');
    const H = pad + show * cell + 8;
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
      <text x="2" y="${pad + show*cell/2}" font-size="9" fill="var(--text3)" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90,10,${pad+show*cell/2})">Actual</text>
      <text x="${pad + show*cell/2}" y="${H}" font-size="9" fill="var(--text3)" text-anchor="middle">Predicted</text>
      ${xLabels}${yLabels}${rows}
    </svg>`;
  }

  // ── Predicted vs Actual scatter (regression) ──────────────────
  function _scatterSVG(actual, predicted, ac) {
    if (!actual || !actual.length) return '<div style="font-size:0.74rem;color:var(--text3)">Run a new analysis to see scatter plot</div>';
    const W = 320, H = 240, pad = 40;
    const cW = W - pad - 8, cH = H - pad - 14;
    const allV  = [...actual, ...predicted];
    const vMin  = Math.min(...allV), vMax = Math.max(...allV), vRng = (vMax - vMin) || 1;
    const xOf   = v => pad + (v - vMin) / vRng * cW;
    const yOf   = v => pad + (1 - (v - vMin) / vRng) * cH;
    // ±1 RMSE band
    const resid = actual.map((a, i) => predicted[i] - a);
    const rmse  = Math.sqrt(resid.reduce((s, r) => s + r*r, 0) / resid.length);
    const bandPts = [[vMin, vMin+rmse],[vMax, vMax+rmse],[vMax, vMax-rmse],[vMin, vMin-rmse]];
    const bandPath = bandPts.map((p, i) => `${i?'L':'M'}${xOf(p[0]).toFixed(1)},${yOf(p[1]).toFixed(1)}`).join(' ') + 'Z';
    // Perfect diagonal
    const diagLine = `M${xOf(vMin).toFixed(1)},${yOf(vMin).toFixed(1)} L${xOf(vMax).toFixed(1)},${yOf(vMax).toFixed(1)}`;
    // Points (sample if > 100 to keep SVG light)
    const step   = actual.length > 100 ? Math.ceil(actual.length / 100) : 1;
    const dots   = actual.filter((_, i) => i % step === 0).map((a, i) => {
      const pi = i * step;
      return `<circle cx="${xOf(a).toFixed(1)}" cy="${yOf(predicted[pi]).toFixed(1)}" r="2.2" fill="${ac}" opacity="0.65"/>`;
    }).join('');
    // Axis ticks
    const ticks = [vMin, (vMin+vMax)/2, vMax].map(v => {
      const lbl = Math.abs(v) >= 1000 ? `${(v/1000).toFixed(1)}k` : v.toFixed(v >= 10 ? 0 : 1);
      return `<text x="${xOf(v).toFixed(1)}" y="${pad+cH+11}" font-size="8" fill="var(--text3)" text-anchor="middle">${lbl}</text>
              <text x="${pad-4}" y="${yOf(v).toFixed(1)}" font-size="8" fill="var(--text3)" text-anchor="end" dominant-baseline="middle">${lbl}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
      <path d="${bandPath}" fill="${ac}" opacity="0.08"/>
      <path d="${diagLine}" stroke="${ac}" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${pad+cH}" stroke="var(--border2)" stroke-width="1"/>
      <line x1="${pad}" y1="${pad+cH}" x2="${pad+cW}" y2="${pad+cH}" stroke="var(--border2)" stroke-width="1"/>
      ${ticks}${dots}
      <text x="${pad+cW/2}" y="${H-1}" font-size="8" fill="var(--text3)" text-anchor="middle">Actual</text>
      <text x="8" y="${pad+cH/2}" font-size="8" fill="var(--text3)" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90,8,${pad+cH/2})">Predicted</text>
    </svg>`;
  }

  // ── Learning curve ────────────────────────────────────────────
  function _learningCurveSVG(lc, ac, reg) {
    if (!lc || !lc.train_sizes || !lc.train_sizes.length) return '<div style="font-size:0.74rem;color:var(--text3)">Run a new analysis to see learning curve</div>';
    const W = 320, H = 200, padL = 40, padR = 8, padT = 12, padB = 26;
    const cW = W - padL - padR, cH = H - padT - padB;
    const allV = [...lc.train_scores, ...lc.val_scores];
    const yMin = Math.min(...allV) * 0.97, yMax = Math.max(...allV) * 1.02, yRng = (yMax - yMin) || 1;
    const n = lc.train_sizes.length;
    const xOf = i => padL + (i / (n - 1)) * cW;
    const yOf = v => padT + (1 - (v - yMin) / yRng) * cH;
    const trainPath = lc.train_scores.map((v, i) => `${i?'L':'M'}${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    const valPath   = lc.val_scores.map((v, i) => `${i?'L':'M'}${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    const fillPath  = [...lc.train_scores.map((v, i) => `${i?'L':'M'}${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`),
                       ...[...lc.val_scores].reverse().map((v, i) => `L${xOf(n-1-i).toFixed(1)},${yOf(v).toFixed(1)}`), 'Z'].join(' ');
    const yTicks = [yMin, (yMin+yMax)/2, yMax].map(v => {
      const lbl = reg ? v.toFixed(2) : (v*100).toFixed(0)+'%';
      const sy  = yOf(v).toFixed(1);
      return `<line x1="${padL}" y1="${sy}" x2="${W-padR}" y2="${sy}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>
              <text x="${padL-4}" y="${sy}" font-size="8" fill="var(--text3)" text-anchor="end" dominant-baseline="middle">${lbl}</text>`;
    }).join('');
    const xLabels = lc.train_sizes.map((s, i) =>
      `<text x="${xOf(i).toFixed(1)}" y="${padT+cH+13}" font-size="8" fill="var(--text3)" text-anchor="middle">${s}</text>`
    ).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
      ${yTicks}
      <path d="${fillPath}" fill="${ac}" opacity="0.07"/>
      <path d="${trainPath}" fill="none" stroke="${ac}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${valPath}"   fill="none" stroke="${ac}" stroke-width="1.8" stroke-dasharray="5,3" stroke-linecap="round" opacity="0.65"/>
      ${xLabels}
    </svg>
    <div style="display:flex;gap:1rem;margin-top:0.3rem">
      <div style="display:flex;align-items:center;gap:0.3rem"><div style="width:14px;height:2px;background:${ac};border-radius:1px"></div><span style="font-size:0.65rem;color:var(--text3)">Train</span></div>
      <div style="display:flex;align-items:center;gap:0.3rem"><div style="width:14px;height:2px;background:${ac};opacity:0.6;border-radius:1px;border-top:1px dashed ${ac}"></div><span style="font-size:0.65rem;color:var(--text3)">Validation</span></div>
    </div>`;
  }

  // ── Winner model metrics ──────────────────────────────────────
  function _metricCard(lbl, val, fullWidth) {
    return `<div style="padding:0.5rem 0.65rem;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);${fullWidth?'grid-column:1/-1':''}">
      <div style="font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3)">${lbl}</div>
      <div style="font-size:1rem;font-weight:800;color:${accent};margin-top:0.1rem">${val}</div>
    </div>`;
  }
  const metricsHTML = isReg ? (() => {
    const entries = [
      ['MAE',       wm.mae       != null ? wm.mae.toFixed(3)       : '—'],
      ['RMSE',      wm.rmse      != null ? wm.rmse.toFixed(3)      : '—'],
      ['MAPE',      wm.mape      != null ? (wm.mape*100).toFixed(1)+'%' : '—'],
      ['Max Error', wm.max_error != null ? wm.max_error.toFixed(3) : '—'],
      ['Median AE', wm.median_ae != null ? wm.median_ae.toFixed(3) : '—'],
      ...(wm.r2 != null ? [['R²', wm.r2.toFixed(3)]] : []),
    ];
    // 2-col grid, last card spans full if odd count
    return entries.map((e, i) => _metricCard(e[0], e[1], entries.length % 2 !== 0 && i === entries.length - 1)).join('');
  })() : (() => {
    const base = [
      ['Accuracy',  wm.accuracy    != null ? (wm.accuracy*100).toFixed(1)+'%'    : '—'],
      ['F1 Score',  wm.f1_weighted != null ? (wm.f1_weighted*100).toFixed(1)+'%' : '—'],
      ['Precision', wm.precision   != null ? (wm.precision*100).toFixed(1)+'%'   : '—'],
      ['Recall',    wm.recall      != null ? (wm.recall*100).toFixed(1)+'%'      : '—'],
    ];
    const rocCard = wm.roc_auc != null ? _metricCard('ROC-AUC', wm.roc_auc.toFixed(3), true) : '';
    return base.map(e => _metricCard(e[0], e[1], false)).join('') + rocCard;
  })();

  // ── Left column ───────────────────────────────────────────────
  const leftCol = `
    <div class="aml-exp-left">
      ${exp.why_won ? `<div class="aml-exp-panel">
        <div class="aml-exp-panel-title">Why It Won</div>
        <div class="aml-exp-panel-body">${exp.why_won}</div>
      </div>` : ''}
      ${exp.score_analysis ? `<div class="aml-exp-panel">
        <div class="aml-exp-panel-title">Score Analysis</div>
        <div class="aml-exp-panel-body">${exp.score_analysis}</div>
      </div>` : ''}
      ${exp.key_drivers ? `<div class="aml-exp-panel">
        <div class="aml-exp-panel-title">Key Drivers</div>
        <div class="aml-exp-panel-body">${exp.key_drivers}</div>
      </div>` : ''}
      ${recs.length > 0 ? `<div class="aml-exp-panel">
        <div class="aml-exp-panel-title">Recommendations</div>
        <div class="aml-exp-panel-body"><ul class="aml-exp-recs">${recs.map(r => `<li>${r}</li>`).join('')}</ul></div>
      </div>` : ''}
    </div>`;

  // ── Right column ──────────────────────────────────────────────
  const vizTitle   = isReg ? 'Predicted vs Actual' : 'Confusion Matrix';
  const vizSubtitle= isReg ? `Diagonal band = ±1 RMSE · dashed line = perfect prediction` : `Diagonal = correct · off-diagonal = errors`;
  const vizContent = isReg
    ? _scatterSVG(viz.scatter_actual, viz.scatter_predicted, accent)
    : _confusionMatrixSVG(viz.confusion_matrix, viz.class_names, accent);

  const lcFoldsUsed = viz.learning_curve?.cv_folds || viz.lc_cv_folds || 5;
  const lcTitle    = `Learning Curve · ${viz.learning_curve?.metric_label || (isReg ? 'MAE' : 'F1')}`;
  const lcSubtitle = `Solid = train · dashed = validation · 5 sizes · ${lcFoldsUsed}-fold CV`;
  const lcSkipReason = viz.lc_skip_reason;

  function _lcInterpret(lc, reg) {
    if (!lc || !lc.val_scores || lc.val_scores.length < 2) return null;
    const n     = lc.val_scores.length;
    const vLast = lc.val_scores[n - 1];
    const tLast = lc.train_scores[n - 1];
    const maxTrainSize = lc.train_sizes ? lc.train_sizes[n - 1] : null;

    // Gap: relative difference between val and train (always positive when overfitting)
    // Use max(val,train) as denominator so neither extreme dominates
    const gap       = reg ? (vLast - tLast) / (Math.max(vLast, tLast) || 1)
                          : (tLast - vLast) / (Math.max(tLast, vLast) || 1);
    const isOverfit = gap > 0.2;

    // Still improving? Compare second half of curve vs midpoint, not just last 2 points
    // More robust on noisy small datasets
    const midIdx   = Math.floor(n / 2);
    const vMid     = lc.val_scores[midIdx];
    const improving = reg ? (vLast < vMid * 0.98)   // MAE still dropping >2% from midpoint
                          : (vLast > vMid * 1.02);   // accuracy still rising >2% from midpoint

    let msg = '';
    if (isOverfit) {
      msg += 'The model is <strong>overfitting</strong> — training performance is much better than validation, meaning it has memorised the training data rather than learning general patterns. ';
      if (improving) {
        msg += '<strong>Adding more training data should help</strong> — the validation score is still improving, which means the model can still generalise better with more examples.';
      } else {
        msg += 'Validation has stopped improving — <strong>adding more data is unlikely to fix this</strong>. Try reducing feature engineering transforms or removing low-quality features.';
      }
    } else {
      msg += 'Train and validation scores are close — the model <strong>generalises well</strong> to unseen data. ';
      if (improving) {
        msg += 'Validation is still improving as training size increases — <strong>adding more data is likely to push performance higher</strong>.';
      } else {
        msg += 'Validation has plateaued — <strong>adding more data will not significantly improve performance</strong>. The model has learned as much as it can from the current feature set.';
      }
    }
    if (maxTrainSize !== null && maxTrainSize < 100) {
      msg += ' <em style="color:var(--text3)">(Note: only ' + maxTrainSize + ' training samples — interpret with caution, results may not be stable.)</em>';
    }
    return msg;
  }

  const lcInterpret = !lcSkipReason ? _lcInterpret(viz.learning_curve, isReg) : null;
  const lcContent  = lcSkipReason
    ? `<div style="padding:1.1rem 0.75rem;border-radius:8px;border:1px dashed var(--border2);
                   text-align:center;color:var(--text3);font-size:0.75rem;margin-top:0.4rem">
         <div style="font-size:1.1rem;margin-bottom:0.4rem">⚠️</div>
         <div style="font-weight:600;margin-bottom:0.25rem;color:var(--color-warning)">Learning Curve Unavailable</div>
         <div>${lcSkipReason}</div>
       </div>`
    : `${_learningCurveSVG(viz.learning_curve, accent, isReg)}
       <div style="font-size:0.62rem;color:var(--text3);margin-top:0.4rem">
         5 training sizes · ${lcFoldsUsed}-fold CV · gap between lines = overfitting
       </div>
       ${lcInterpret ? `<div style="font-size:0.72rem;color:var(--text2);margin-top:0.6rem;line-height:1.6;padding:0.5rem 0.65rem;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border2)">${lcInterpret}</div>` : ''}`;

  const rightCol = `
    <div class="aml-exp-right">
      <div class="aml-exp-panel">
        <div class="aml-exp-panel-title">${vizTitle}</div>
        <div style="font-size:0.67rem;color:var(--text3);margin-bottom:0.55rem">${vizSubtitle}</div>
        ${vizContent}
      </div>
      <div class="aml-exp-panel">
        <div class="aml-exp-panel-title">Winner Model Metrics</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;margin-top:0.4rem">
          ${metricsHTML}
        </div>
      </div>
      <div class="aml-exp-panel">
        <div class="aml-exp-panel-title">${lcTitle}</div>
        <div style="font-size:0.67rem;color:var(--text3);margin-bottom:0.45rem">${lcSubtitle}</div>
        ${lcContent}
      </div>
    </div>`;

  // ── Actionable Insights (full-width below) ────────────────────
  const insightIcons = ['💡', '🎯', '⚡', '🔍'];
  const insightsHTML = insights.length > 0 ? `
    <div style="margin-top:1rem;padding-top:0.85rem;border-top:1px solid var(--border2)">
      <div style="font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${accent};margin-bottom:0.65rem">Actionable Insights</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0.65rem">
        ${insights.map((ins, i) => `
        <div style="padding:0.75rem 0.8rem;border-radius:10px;background:rgba(255,255,255,0.025);border:1px solid var(--border2)">
          <div style="font-size:0.74rem;font-weight:700;color:${accent};margin-bottom:0.3rem">${insightIcons[i % 4]} ${ins.title || ''}</div>
          <div style="font-size:0.72rem;color:var(--text2);line-height:1.55">${ins.detail || ''}</div>
        </div>`).join('')}
      </div>
    </div>` : '';

  return `<div class="aml-exp-dashboard">${leftCol}${rightCol}</div>${insightsHTML}`;
}

function _renderAutoMLReport(automl, accent) {

          winner_metrics, confusion_matrix, class_names,
          scatter_actual, scatter_predicted, learning_curve,
          optuna_params, optuna_best_score, optuna_n_trials } = automl;
  const isReg = selection_metric === 'MAE';

  const scores  = cv_results.map(r => r.score);
  const maxS    = Math.max(...scores);
  const minS    = Math.min(...scores);
  const rangeS  = (maxS - minS) || maxS || 1;
  const winRow  = cv_results.find(r => r.algorithm === winner);
  const bestVal = winRow ? winRow.score : 0;
  const bestDisplay = isReg ? bestVal.toFixed(2) : (bestVal * 100).toFixed(1) + '%';
  const taskLabel   = isReg ? 'Regression' : 'Classification';

  const algoBars = cv_results.map((r, i) => {
    const isWin      = r.algorithm === winner;
    const targetPct  = isReg
      ? (50 + 50 * (maxS - r.score) / rangeS).toFixed(1)
      : (r.score / maxS * 100).toFixed(1);
    const val        = isReg ? r.score.toFixed(2) : (r.score * 100).toFixed(1) + '%';
    const fillStyle  = isWin
      ? `background:linear-gradient(90deg,${accent},${accent}bb)`
      : `background:var(--border2);filter:brightness(1.5)`;
    const pill = isWin
      ? `<span class="aml-winner-pill" style="background:${accent}20;color:${accent};border-color:${accent}50">WINNER</span>`

        <span class="aml-algo-name${isWin ? ' aml-win' : ''}">${r.algorithm}</span>

      </div>
      <div class="aml-algo-track">
        <div class="aml-algo-fill" data-target="${targetPct}" data-delay="${i * 150}"

  const fiBars = (feature_importance || []).slice(0, 8).map((f, i) => {

  return `<div class="aml-dashboard" id="amlReport">

    ${is_imbalanced ? `

      <span style="font-size:1rem;flex-shrink:0">⚠</span>

      <div class="aml-stat">

        <div class="aml-stat-val">${(n_rows || 0).toLocaleString()}</div>

    <div class="aml-charts">

function _animateAutoMLBars() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('#amlReport [data-target]').forEach(bar => {
      const delay  = parseInt(bar.dataset.delay || '0');
      const target = bar.dataset.target + '%';
      setTimeout(() => { bar.style.width = target; }, delay);
    });
  }));
}

function _toggleFeatureInfo(btn) {
  const box = btn.nextElementSibling;
  const open = box.style.display !== 'none';
  box.style.display = open ? 'none' : 'block';
  btn.querySelector('.fi-arrow').textContent = open ? '▸' : '▴';
}

async function _amlShowTab(tab, btn) {
  document.querySelectorAll('.aml-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'shap')        await _amlRenderShap();
  else if (tab === 'whatif') _amlRenderWhatif();
}

async function _amlRenderShap() {
  if (!activeModel) return;
  const body = document.getElementById('amlTabBody');
  if (!body) return;
  body.innerHTML = `<div style="padding:1rem 0">${_progressBarHTML('amlSFill','amlSMsg','amlSPct')}</div>`;
  const sample = activeModel.schema.sample || {};
  try {
    const res = await fetch(`${API}/shap/${activeModel.id}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(sample),
    });
    if (!res.ok) throw new Error(res.status);
    let shap = null;
    for await (const ev of _sseStream(res)) {
      if (ev.error) throw new Error(ev.error);
      if (ev.pct !== undefined) _updateProgressBar('amlSFill','amlSMsg','amlSPct', ev.pct, ev.msg);
      if (ev.result) shap = ev.result;
    }
    if (!shap) throw new Error('No result');
    const maxAbs = Math.max(...shap.features.map(f => Math.abs(f.shap)), 0.001);
    const _shapNOrig    = shap.features.length;
    const _shapNTotal   = _currentAutoMLData?.n_input_cols ?? _shapNOrig;
    const _shapNDerived = _shapNTotal - _shapNOrig;
    const _shapInfoHTML = `
      <div style="margin-top:0.85rem">
        <button onclick="_toggleFeatureInfo(this)"
                style="background:none;border:none;color:var(--active-accent,var(--accent-from));cursor:pointer;font-size:0.72rem;padding:0;display:flex;align-items:center;gap:0.3rem">
          <span class="fi-arrow">▸</span> Why only ${_shapNOrig} features?
        </button>
        <div style="display:none;margin-top:0.5rem;font-size:0.72rem;color:var(--text2);line-height:1.6;
                    padding:0.5rem 0.65rem;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border2)">
          Your original dataset had <strong>${_shapNOrig} input columns</strong>.${_shapNDerived > 0
            ? ` Feature engineering automatically created <strong>${_shapNDerived} additional columns</strong> from them (rank transforms, bins, interaction terms) — all <strong>${_shapNTotal} were used in training</strong>.
               In this chart, each derived column's contribution is <strong>merged into its parent bar</strong> — for example, Age_rank's impact is added to Age's bar, Fare_rank's to Fare's bar.
               This gives you the <strong>total influence of each original feature</strong>, including all its transforms combined.`
            : ` All ${_shapNOrig} are shown here.`}
        </div>
      </div>`;
    body.innerHTML = `
      ${_shapInfoHTML}
      <div class="shap-body">
        ${shap.features.map(f => {
          const isPos = f.shap >= 0;
          const pct = Math.min((Math.abs(f.shap) / maxAbs) * 48, 48);
          return `<div class="shap-row">
            <div class="shap-feat-name" title="${f.label}">${f.label}</div>
            <div class="shap-bar-wrap">
              <div class="shap-bar-center"></div>
              <div class="shap-bar-fill ${isPos?'pos':'neg'}" data-pct="${pct}"
                   style="${isPos?'left:50%;width:0%':'right:50%;width:0%'}"></div>
            </div>
            <div class="shap-val ${isPos?'pos':'neg'}">${isPos?'+':''}${f.shap.toFixed(3)}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="shap-base">Base value (avg prediction): <strong>${shap.base_value.toFixed(3)}</strong></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('#amlTabBody .shap-bar-fill[data-pct]').forEach(b => {
        b.style.width = b.dataset.pct + '%';
      });
    }));
  } catch(e) {
    body.innerHTML = `<div style="padding:1rem;color:var(--text3)">SHAP unavailable: ${e.message}</div>`;
  }
}

function _amlRenderWhatif() {
  if (!activeModel) return;
  const body = document.getElementById('amlTabBody');
  if (!body) return;
  const fields = (activeModel.schema.fields || []).filter(f => f.type !== 'hidden' && f.name);
  if (!fields.length) { body.innerHTML = '<div style="padding:1rem;color:var(--text3)">No fields available.</div>'; return; }
  const def = fields[0];
  const _wiNOrig    = fields.length;
  const _wiNTotal   = _currentAutoMLData?.n_input_cols ?? _wiNOrig;
  const _wiNDerived = _wiNTotal - _wiNOrig;
  const _wiInfoHTML = _wiNDerived > 0 ? `
    <div style="margin-top:0.6rem;margin-bottom:0.5rem">
      <button onclick="_toggleFeatureInfo(this)"
              style="background:none;border:none;color:var(--active-accent,var(--accent-from));cursor:pointer;font-size:0.72rem;padding:0;display:flex;align-items:center;gap:0.3rem">
        <span class="fi-arrow">▸</span> Why only ${_wiNOrig} features?
      </button>
      <div style="display:none;margin-top:0.5rem;font-size:0.72rem;color:var(--text2);line-height:1.6;
                  padding:0.5rem 0.65rem;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border2)">
        Your original dataset had <strong>${_wiNOrig} input columns</strong>. Feature engineering created
        <strong>${_wiNDerived} additional columns</strong> from them (e.g. Age_rank from Age, Fare_rank from Fare, interaction terms).
        These derived columns <strong>cannot be swept independently</strong> — Age_rank is always computed from Age.
        If you changed Age_rank without changing Age, you would create an impossible scenario: Age=25 but a rank of 0.95,
        which only occurs when Age is near its maximum. The model has never seen such contradictory data, so its prediction
        would be meaningless. Instead, when you sweep Age here, <strong>all derived columns update automatically</strong>
        in the background — keeping every prediction realistic.
      </div>
    </div>` : '';
  body.innerHTML = `
    <div style="padding:1rem 0 0">
      <div class="whatif-desc">Hold all other inputs at sample values — see how changing one feature shifts the prediction.</div>
      ${_wiInfoHTML}
      <div class="whatif-chips" id="amlWhatifChips">
        ${fields.map(f => `<button class="whatif-chip${f.name===def.name?' active':''}"
          onclick="selectAmlWhatifFeature(this,'${f.name}')">${f.label||f.name}</button>`).join('')}
      </div>
      <div class="train-card" id="amlWhatifChart"></div>
    </div>`;
  runAmlWhatifSweep(def.name);
}

function selectAmlWhatifFeature(btn, fieldName) {
  document.querySelectorAll('#amlWhatifChips .whatif-chip').forEach(c => c.classList.toggle('active', c === btn));
  runAmlWhatifSweep(fieldName);
}

async function runAmlWhatifSweep(fieldName) {
  const chartEl = document.getElementById('amlWhatifChart');
  if (!chartEl || !activeModel) return;
  chartEl.innerHTML = `<div class="pipe-loading"><span class="spinner"></span> Computing…</div>`;
  const m = activeModel, schema = m.schema;
  const field = schema.fields.find(f => f.name === fieldName);
  if (!field) return;
  const sample = schema.sample || {};
  const base = {};
  schema.fields.forEach(f => { base[f.name] = sample[f.name] ?? null; });
  const sweepVals = field.type === 'select'
    ? field.options.map(o => o.value)
    : (() => {
        const mn = field.min ?? 0, mx = field.max ?? 1, n = 20;
        const vals = Array.from({length: n}, (_, i) => mn + (mx - mn) * i / (n - 1));
        const dec = field.step ? (field.step.toString().split('.')[1] || '').length : 2;
        return vals.map(v => parseFloat(v.toFixed(dec)));
      })();
  try {
    const predictions = await Promise.all(sweepVals.map(async val => {
      const res = await fetch(`${API}/predict/${m.id}`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({...base, [fieldName]: val}),
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      let y = schema.task === 'classification'
        ? (data.probabilities?.length === 2 ? data.probabilities[1] : Math.max(...(data.probabilities||[0])))
        : data.prediction;
      return {x: val, y};
    }));
    chartEl.innerHTML = drawWhatifChart(predictions, field, schema);
  } catch {
    chartEl.innerHTML = `<div class="train-no-data">Sweep failed — try another feature.</div>`;
  }
}

async function getAIExplanation() {
  const key = (document.getElementById('amlApiKey')?.value || '').trim();
  const errEl = document.getElementById('amlKeyErr');
  if (!key) {
    if (errEl) errEl.style.display = 'block';
    return;
  }
  if (errEl) errEl.style.display = 'none';
  const btn = document.querySelector('#amlKeyRow button');
  const progEl  = document.getElementById('amlKeyProg');
  const progBar = document.getElementById('amlProgBar');
  const progPct = document.getElementById('amlProgPct');
  const progLbl = document.getElementById('amlProgLabel');
  if (btn) { btn.disabled = true; btn.textContent = 'Get AI Explanation'; }
  if (progEl) progEl.style.display = 'none';
  if (progBar) { progBar.style.transition = 'none'; progBar.style.width = '0%'; progBar.style.background = 'var(--active-accent,#818cf8)'; }
  if (progPct) progPct.textContent = '0%';
  void progBar?.offsetWidth;
  if (progBar) progBar.style.transition = 'width 0.4s ease';
  if (progEl) progEl.style.display = 'block';
  let _pct = 0;
  const _labels = ['Sending context…', 'Model is thinking…', 'Generating AI explanation…', 'Finalising AI explanation…'];
  const _progTimer = setInterval(() => {
    const step = _pct < 30 ? 8 : _pct < 60 ? 5 : _pct < 80 ? 2 : 0.5;
    _pct = Math.min(_pct + step, 85);
    if (progBar) progBar.style.width = _pct + '%';
    if (progPct) progPct.textContent = Math.round(_pct) + '%';
    if (progLbl) progLbl.textContent = _labels[_pct < 25 ? 0 : _pct < 55 ? 1 : _pct < 75 ? 2 : 3];
  }, 400);
  try {
    const res = await fetch(API + '/explain', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ automl_data: _currentAutoMLData, user_api_key: key, provider: document.getElementById('amlProvider')?.value || 'anthropic' }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const isAI = data.source === 'user_key';
    try {
      const expEl = document.getElementById('amlExplanation');
      if (expEl && _currentAutoMLData) {
        const { cv_results, feature_importance, winner, selection_metric, winner_metrics,
                confusion_matrix, class_names, scatter_actual, scatter_predicted, learning_curve } = _currentAutoMLData;
        const isReg = selection_metric === 'MAE';
        const accent = document.documentElement.style.getPropertyValue('--active-accent') || '#818cf8';
        expEl.innerHTML = _renderExplanationDashboard(data.explanation, cv_results, feature_importance, accent, winner, false, isReg, selection_metric, winner_metrics, {confusion_matrix, class_names, scatter_actual, scatter_predicted, learning_curve, lc_skip_reason: _currentAutoMLData.lc_skip_reason, lc_cv_folds: _currentAutoMLData.lc_cv_folds});
        _animateAutoMLBars();
      }
    } catch(renderErr) {
      console.error('Explanation render error:', renderErr);
    }
    const badge = document.querySelector('.aml-source-badge');
    if (badge && isAI) { badge.textContent = 'AI'; badge.classList.add('aml-ai'); }
    clearInterval(_progTimer);
    if (progBar) progBar.style.width = '100%';
    if (progPct) progPct.textContent = '100%';
    if (progLbl) progLbl.textContent = isAI ? 'Done!' : 'Completed';
    setTimeout(() => { if (progEl) progEl.style.display = 'none'; }, 1200);
    if (btn) { btn.disabled = false; btn.textContent = isAI ? 'Regenerate' : 'Try Again'; }
  } catch(e) {
    clearInterval(_progTimer);
    if (progBar) progBar.style.width = '100%';
    if (progBar) progBar.style.background = '#f87171';
    if (progPct) progPct.textContent = 'Error';
    if (progLbl) progLbl.textContent = 'Request failed';
    setTimeout(() => { if (progEl) progEl.style.display = 'none'; }, 2000);
    if (btn) { btn.disabled = false; btn.textContent = 'Try Again'; }
    if (errEl) { errEl.textContent = 'Request failed — check your API key and try again.'; errEl.style.display = 'block'; }
  }
}
