<script>
// ── Vision standalone stubs ──────────────────────────────────
// No sidebar or mobile bottom tabs on this standalone page.
let _mobileVisionPanel = 'classifier';
function syncBottomTab(tab) {}  // no-op — no mobile bottom tabs in standalone vision page

// ── Vision / Image Classification ────────────────────────────────
let visionFile     = null;
let visionModel    = 'mobilenetv2';
let visionImageURL = null;

const VISION_MODEL_META = {
  mobilenetv2: { label: 'MobileNetV2',    desc: 'Fast & lightweight (14 MB)' },
  resnet50:    { label: 'ResNet50',        desc: 'Classic deep residual (98 MB)' },
  squeezenet:  { label: 'SqueezeNet 1.1', desc: 'Tiny & fast (5 MB)' },
  googlenet:   { label: 'GoogLeNet',      desc: 'Multi-scale Inception (28 MB)' },
};


function selectVision() {
  _track('tool_open', { tool: 'vision' });
  document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('vbtn-classifier');
  if (btn) btn.classList.add('active');
  setAmbientTheme('rgba(232,121,249,0.16)', 'rgba(168,85,247,0.10)');
  _mobileVisionPanel = 'classifier'; syncBottomTab('vision');
  renderImageClassifierPanel();
}

function renderImageClassifierPanel() {
  batchFiles = [];
  batchURLs  = [];

  const chipHTML = Object.entries(VISION_MODEL_META).map(([id, m]) => `
    <button class="vision-model-chip${id === visionModel ? ' selected' : ''}"
            data-model="${id}" onclick="selectVisionModel(this)">
      <div class="vmchip-label">${m.label}</div>
      <div class="vmchip-desc">${m.desc}</div>
    </button>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="vision-panel">
      <div class="u-header">
        <div class="model-eyebrow" style="color:#e879f9">Vision &middot; Image Classification</div>
        <div class="u-title">Image Classifier</div>
        <div class="u-subtitle">Upload one or more images — classify against 1,000 ImageNet categories using four pre-trained models.</div>
      </div>

      <div class="wizard-section">
        <label class="wizard-label">Pre-trained Model</label>
        <div class="vision-model-grid">${chipHTML}</div>
      </div>

      <div class="u-param-row" style="margin-bottom:1.25rem">
        <label class="wizard-label">Top predictions per image</label>
        <input type="number" class="field-input" id="vTopK" value="3" min="1" max="10" step="1" style="width:70px">
      </div>

      <div class="upload-zone" id="vUploadZone">
        <input type="file" id="vImageInput" accept="image/*" multiple onchange="handleBatchFiles(event)">
        <div class="upload-zone-icon"><svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="4" y="9" width="36" height="27" rx="5" stroke="#818cf8" stroke-width="1.5" opacity="0.55"/><circle cx="15" cy="19" r="3.8" stroke="#fbbf24" stroke-width="1.4" opacity="0.8"/><path d="M4 30l11-10 8 7 5-5 12 14" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/></svg></div>
        <div class="upload-zone-text">Click to browse or drag &amp; drop</div>
        <div class="upload-zone-sub">JPEG · PNG · WebP · multiple images supported</div>
      </div>

      <div id="vErr" style="margin-top:0.5rem"></div>

      <!-- Toolbar: shown after files selected -->
      <div id="vBatchToolbar" style="display:none;margin:1rem 0;align-items:center;gap:1rem;flex-wrap:wrap">
        <button class="btn btn-primary" id="vClassifyBtn" onclick="runBatchClassify()">Classify All →</button>
        <span id="vBatchCount" style="font-size:0.82rem;color:var(--text3)"></span>
        <button onclick="clearBatch()"
                style="background:none;border:none;color:var(--text3);font-size:0.8rem;cursor:pointer;padding:0.25rem 0.5rem">
          ✕ Clear
        </button>
      </div>

      <!-- Progress -->
      <div id="vBatchProgress" style="display:none" class="batch-progress-wrap">
        <div style="display:flex;justify-content:space-between">
          <span id="vProgressText" style="font-size:0.75rem;color:var(--text3)">0 / 0 classified</span>
        </div>
        <div class="batch-progress-bar-bg">
          <div class="batch-progress-bar-fill" id="vProgressBar"></div>
        </div>
      </div>

      <!-- Batch grid -->
      <div class="batch-grid" id="vBatchGrid"></div>

      <!-- Category browser -->
      <div style="margin-top:2rem;border-top:1px solid var(--border);padding-top:1.25rem">
        <button id="vCategoryBtn" onclick="toggleCategoryBrowser()"
                style="background:none;border:none;color:var(--text3);font-size:0.8rem;
                       cursor:pointer;padding:0;font-weight:600">
          Browse 1,000 categories ▸
        </button>
        <div id="vCategoryPanel" style="display:none;margin-top:0.75rem">
          <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:0.6rem">
            <input type="text" class="field-input" placeholder="Search categories…"
                   oninput="renderCategoryList(this.value)"
                   style="flex:1;font-size:0.82rem;padding:0.4rem 0.65rem">
            <span id="vCategoryCount" style="font-size:0.72rem;color:var(--text3);white-space:nowrap">1,000 categories</span>
          </div>
          <div id="vCategoryGrid"
               style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
                      gap:0.3rem;max-height:260px;overflow-y:auto;padding:0.5rem;
                      background:var(--bg-input);border:1px solid var(--border2);border-radius:10px">
          </div>
        </div>
      </div>
    </div>`;

  const zone = document.getElementById('vUploadZone');
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (files.length) addBatchFiles(files);
  });
}

function selectVisionModel(el) {
  document.querySelectorAll('.vision-model-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  visionModel = el.dataset.model;
}

let batchFiles = [];
let batchURLs  = [];

function handleBatchFiles(e) {
  const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
  if (files.length) addBatchFiles(files);
}

function addBatchFiles(files) {
  batchURLs.forEach(u => URL.revokeObjectURL(u));
  batchFiles = files;
  batchURLs  = files.map(f => URL.createObjectURL(f));

  const toolbar = document.getElementById('vBatchToolbar');
  if (toolbar) toolbar.style.display = 'flex';
  const countEl = document.getElementById('vBatchCount');
  if (countEl) countEl.textContent = `${files.length} image${files.length !== 1 ? 's' : ''} selected`;

  renderBatchGrid();
  document.getElementById('vErr').innerHTML = '';
  _track('tool_open', { tool: 'vision', action: 'upload_image' });
}

function renderBatchGrid() {
  const grid = document.getElementById('vBatchGrid');
  if (!grid) return;
  grid.innerHTML = batchFiles.map((f, i) => `
    <div class="batch-card" id="batch-card-${i}">
      <img src="${batchURLs[i]}" class="batch-card-img" alt="${f.name}">
      <div class="batch-card-body">
        <div class="batch-card-filename">${f.name}</div>
        <div class="batch-card-status" id="batch-status-${i}" style="color:var(--text3);font-size:0.72rem">Ready</div>
      </div>
    </div>`).join('');
}

function clearBatch() {
  batchURLs.forEach(u => URL.revokeObjectURL(u));
  batchFiles = []; batchURLs = [];
  const grid = document.getElementById('vBatchGrid');
  if (grid) grid.innerHTML = '';
  const toolbar = document.getElementById('vBatchToolbar');
  if (toolbar) toolbar.style.display = 'none';
  const progress = document.getElementById('vBatchProgress');
  if (progress) progress.style.display = 'none';
}

function _updateBatchProgress(done, total) {
  const textEl = document.getElementById('vProgressText');
  const barEl  = document.getElementById('vProgressBar');
  if (textEl) textEl.textContent = `${done} / ${total} classified`;
  if (barEl)  barEl.style.width  = `${(done / total * 100).toFixed(0)}%`;
}

function _updateBatchCard(i, state, data) {
  const card   = document.getElementById(`batch-card-${i}`);
  const status = document.getElementById(`batch-status-${i}`);
  if (!card || !status) return;

  if (state === 'running') {
    status.innerHTML = `<span class="spinner" style="width:11px;height:11px;border-width:2px;display:inline-block;vertical-align:middle"></span> Classifying…`;
  } else if (state === 'done') {
    const preds   = data.predictions || [];
    const top     = preds[0];
    const rest    = preds.slice(1, 3);
    const lowConf = data.low_confidence;
    const accent  = lowConf ? '#fbbf24' : '#e879f9';
    card.classList.add(lowConf ? 'batch-card--low' : 'batch-card--done');
    status.innerHTML = `
      <div class="batch-card-top-label">${top ? top.label : '—'}</div>
      <div class="batch-card-top-conf" style="color:${accent}">${top ? (top.confidence*100).toFixed(1)+'%' : ''}</div>
      ${rest.length ? `<div class="batch-card-top2">${rest.map(p => `${p.label} · ${(p.confidence*100).toFixed(1)}%`).join('<br>')}</div>` : ''}`;
  } else {
    card.classList.add('batch-card--error');
    status.innerHTML = `<span style="color:var(--color-danger);font-size:0.7rem">Failed</span>`;
  }
}

async function runBatchClassify() {
  if (!batchFiles.length) return;
  if (!VISION_API) {
    document.getElementById('vErr').innerHTML = `<div class="js-err-box">Vision service not connected.</div>`;
    return;
  }
  const btn      = document.getElementById('vClassifyBtn');
  const errEl    = document.getElementById('vErr');
  const topK     = parseInt(document.getElementById('vTopK').value) || 3;
  const progress = document.getElementById('vBatchProgress');

  btn.disabled  = true;
  btn.innerHTML = 'Classifying…';
  errEl.innerHTML = '';
  if (progress) progress.style.display = 'block';
  _updateBatchProgress(0, batchFiles.length);

  for (let i = 0; i < batchFiles.length; i++) {
    _updateBatchCard(i, 'running');
    const form = new FormData();
    form.append('file',       batchFiles[i]);
    form.append('model_name', visionModel);
    form.append('top_k',      topK);
    try {
      const res = await fetch(`${VISION_API}/classify-image`, { method: 'POST', body: form });
      if (!res.ok) throw new Error(await res.text());
      const cData = await res.json();
      const topPred = cData.predictions?.[0];
      _track('query_run', { tool: 'vision:classify', success: true });
      _track('query_run', { tool: 'vision', action: 'classify', model: visionModel || '', top_label: topPred?.label || '', confidence: topPred?.confidence ?? null });
      _updateBatchCard(i, 'done', cData);
    } catch (err) {
      _track('error', { tool: 'vision', action: 'classify', status_code: err?.status || 0 });
      _updateBatchCard(i, 'error');
    }
    _updateBatchProgress(i + 1, batchFiles.length);
  }

  btn.disabled  = false;
  btn.innerHTML = 'Classify All →';
}

/* ── Shared XHR progress helper for vision panels ── */
function _postWithProgress(url, formData, resultId, accent, noteText) {
  return new Promise((resolve, reject) => {
    let pct = 0;
    let inferTid = null;
    let stopped = false;

    const barEl = () => document.getElementById(resultId + 'PBar');
    const lblEl = () => document.getElementById(resultId + 'PLbl');
    const setBar = (p, label) => {
      const b = barEl(); const l = lblEl();
      if (b) b.style.width = Math.round(p) + '%';
      if (l) l.textContent = label + ' · ' + Math.round(p) + '%';
    };

    document.getElementById(resultId).innerHTML = `
      <div style="padding:2.5rem 1.5rem;text-align:center">
        <div id="${resultId}PLbl" style="font-size:0.83rem;color:var(--text2);margin-bottom:0.9rem">Uploading · 0%</div>
        <div style="height:5px;background:var(--border2);border-radius:3px;overflow:hidden;max-width:300px;margin:0 auto">
          <div id="${resultId}PBar" style="height:100%;width:0%;background:${accent};border-radius:3px;transition:width 0.18s ease-out"></div>
        </div>
        <div style="font-size:0.7rem;color:var(--text3);margin-top:0.7rem;opacity:0.75">${noteText}</div>
      </div>`;

    const startInfer = () => {
      const tick = () => {
        if (stopped) return;
        pct = Math.min(90, pct + 0.65);
        setBar(pct, pct < 65 ? 'Running model' : 'Processing');
        if (pct < 90) inferTid = setTimeout(tick, 260);
      };
      pct = 30;
      tick();
    };

    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);

    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        pct = Math.min(28, Math.round((e.loaded / e.total) * 28));
        setBar(pct, 'Uploading');
      }
    });
    xhr.upload.addEventListener('load', () => { setBar(29, 'Uploading'); startInfer(); });

    xhr.addEventListener('load', () => {
      stopped = true; clearTimeout(inferTid); setBar(100, 'Complete');
      resolve({ status: xhr.status, ok: xhr.status >= 200 && xhr.status < 300,
        text: () => Promise.resolve(xhr.responseText),
        json: () => Promise.resolve(JSON.parse(xhr.responseText)) });
    });
    xhr.addEventListener('error',  () => { stopped = true; clearTimeout(inferTid); reject(new Error('Network error')); });
    xhr.addEventListener('abort',  () => { stopped = true; clearTimeout(inferTid); reject(new Error('Request aborted')); });

    xhr.send(formData);
  });
}

let _detRetryCount = 0;
let _detRetryTimer = null;

function cancelDetRetry() {
  if (_detRetryTimer) { clearTimeout(_detRetryTimer); _detRetryTimer = null; }
  _detRetryCount = 0;
  document.getElementById('detErr').innerHTML = '';
}

async function runObjectDetect() {
  if (!detFile) return;
  const btn   = document.getElementById('detRunBtn');
  const errEl = document.getElementById('detErr');
  const conf  = parseInt(document.getElementById('detConf').value) / 100;

  btn.innerHTML = '<span class="spinner"></span> Detecting…';
  btn.disabled  = true;
  errEl.innerHTML = '';

  document.getElementById('detResult').innerHTML = `
    <div style="padding:2.5rem 1.5rem;text-align:center">
      ${_progressBarHTML('detFill','detMsg','detPct')}
      <div style="font-size:0.7rem;color:var(--text3);margin-top:0.7rem;opacity:0.75">First call downloads ~35 MB — may take up to 60 s on free tier</div>
    </div>`;

  const form = new FormData();
  form.append('file',       detFile);
  form.append('model_name', 'tiny_yolov3');
  form.append('confidence', conf);
  form.append('max_dets',   20);

  try {
    const res = await fetch(`${VISION_API}/detect-objects`, { method: 'POST', body: form });
    if (!res.ok) {
      const raw = await res.text();
      let msg;
      try { const j = JSON.parse(raw); msg = j.detail || raw; } catch { msg = raw; }
      if (res.status === 503) { showDetRetry(msg); return; }
      throw new Error(msg);
    }
    let data = null;
    for await (const ev of _sseStream(res)) {
      if (ev.error) throw new Error(ev.error);
      if (ev.pct !== undefined) _updateProgressBar('detFill','detMsg','detPct', ev.pct, ev.msg);
      if (ev.result) data = ev.result;
    }
    if (!data) throw new Error('No result received from server.');
    _track('query_run', { tool: 'vision:detect', success: true });
    renderDetectionResult(data);
    _track('query_run', { tool: 'vision', action: 'detect', model: data?.model_name || 'tiny_yolov3', objects_found: data?.count || 0 });
  } catch(e) {
    _track('error', { tool: 'vision', action: 'detect', status_code: e?.status || 0 });
    document.getElementById('detResult').innerHTML = '';
    errEl.innerHTML = `<div class="js-err-box">${e.message}</div>`;
  } finally {
    btn.innerHTML = 'Detect Objects →';
    btn.disabled  = false;
  }
}

function showDetRetry(msg) {
  const errEl = document.getElementById('detErr');
  const btn   = document.getElementById('detRunBtn');
  btn.innerHTML = 'Detect Objects →'; btn.disabled = false;
  if (_detRetryCount >= 3) {
    _detRetryCount = 0;
    errEl.innerHTML = `<div class="js-err-box">✗ Model unavailable after 3 attempts. Please try again later.</div>`;
    return;
  }
  _detRetryCount++;
  let secs = 20;
  const tick = () => {
    errEl.innerHTML = `<div class="js-warn-box">
      <span>⏳ ${msg} Auto-retrying in ${secs}s… (attempt ${_detRetryCount}/3)</span>
      <button onclick="cancelDetRetry()" style="padding:0.2rem 0.6rem;border:1px solid #fbbf2466;border-radius:6px;background:transparent;color:#fbbf24;cursor:pointer;font-size:0.78rem;flex-shrink:0">Stop</button>
    </div>`;
    if (secs-- > 0) { _detRetryTimer = setTimeout(tick, 1000); } else { runObjectDetect(); }
  };
  tick();
}

function renderDetectionResult(data) {
  const accent = '#38bdf8';
  const dets   = data.detections || [];

  const noneMsg = dets.length === 0 ? `
    <div style="padding:0.65rem 0.9rem;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.3);
                border-radius:8px;color:#fbbf24;font-size:0.82rem;margin-bottom:1rem">
      ⚠️ No objects detected above the confidence threshold. Try lowering it.
    </div>` : '';

  const tagsHTML = dets.map(d => {
    const color = DET_BOX_PALETTE[d.class_id % DET_BOX_PALETTE.length];
    return `<span class="det-tag" style="background:${color}22;border:1px solid ${color}55">
      <span class="det-tag-dot" style="background:${color}"></span>
      ${d.label} <span style="color:${color};font-weight:800">${(d.confidence*100).toFixed(0)}%</span>
    </span>`;
  }).join('');

  document.getElementById('detResult').innerHTML = `
    <div class="result-state" style="display:block;margin-top:0.5rem">
      <div class="result-accent-bar" style="background:${accent}"></div>
      <div class="result-body">
        ${noneMsg}
        <div class="proba-section-label" style="margin-bottom:0.75rem">
          ${data.count} object${data.count !== 1 ? 's' : ''} detected
          &nbsp;·&nbsp; confidence ≥ ${(data.confidence_threshold*100).toFixed(0)}%
          &nbsp;·&nbsp; ${data.orig_width}×${data.orig_height} px
        </div>
        <div class="ip-before-after">
          <div class="ip-image-box">
            <div class="ip-image-label">Original</div>
            <img src="${detImageURL}" class="ip-image-result" alt="original">
          </div>
          <div class="ip-image-box">
            <div class="ip-image-label">Detected</div>
            <img src="${data.image_b64}" class="ip-image-result" alt="detection result">
          </div>
        </div>
        <div style="margin-top:0.75rem">${tagsHTML}</div>
        ${data.count > 0 ? `
        <div style="margin-top:1rem">
          <a href="${data.image_b64}" download="detected_objects.png"
             class="btn btn-clear" style="text-decoration:none;font-size:0.8rem">
            ↓ Download
          </a>
        </div>` : ''}
      </div>
    </div>`;
}

function handleSegFile(e) { const f = e.target.files[0]; if (f) setSegFile(f); }

function setSegFile(f) {
  segFile = f;
  if (segImageURL) URL.revokeObjectURL(segImageURL);
  segImageURL = URL.createObjectURL(f);

  const prev = document.getElementById('segPreviewSection');
  prev.style.display = 'block';
  document.getElementById('segPreviewImg').src = segImageURL;
  document.getElementById('segFileName').textContent = `📄 ${f.name}  (${(f.size/1024).toFixed(1)} KB)`;

  const btn = document.getElementById('segRunBtn');
  btn.disabled = false; btn.style.opacity = '1';
  document.getElementById('segResult').innerHTML = '';
  document.getElementById('segErr').innerHTML    = '';
}

let _segRetryCount = 0;
let _segRetryTimer = null;

function cancelSegRetry() {
  if (_segRetryTimer) { clearTimeout(_segRetryTimer); _segRetryTimer = null; }
  _segRetryCount = 0;
  document.getElementById('segErr').innerHTML = '';
}

async function runSegmentation() {
  if (!segFile) return;
  const btn   = document.getElementById('segRunBtn');
  const errEl = document.getElementById('segErr');
  const model = document.querySelector('input[name="segModel"]:checked')?.value || 'segformer_b0';

  btn.innerHTML = '<span class="spinner"></span> Segmenting…';
  btn.disabled  = true;
  errEl.innerHTML = '';

  const form = new FormData();
  form.append('file',       segFile);
  form.append('model_name', model);

  // color_segmentation is fast plain-JSON — no SSE progress needed
  if (model === 'color_segmentation') {
    document.getElementById('segResult').innerHTML = `
      <div style="padding:2.5rem 1.5rem;text-align:center">
        ${_progressBarHTML('segFill','segMsg','segPct')}
      </div>`;
    _updateProgressBar('segFill','segMsg','segPct', 50, 'Analyzing colors');
    try {
      const res = await fetch(`${VISION_API}/segment-image`, { method: 'POST', body: form });
      if (!res.ok) {
        const raw = await res.text();
        let msg; try { msg = JSON.parse(raw).detail || raw; } catch { msg = raw; }
        if (res.status === 503) { showSegRetry(msg); return; }
        throw new Error(msg);
      }
      const data = await res.json();
      renderSegmentationResult(data);
      _track('query_run', { tool: 'vision', action: 'segment', model: model || '' });
    } catch(e) {
      _track('error', { tool: 'vision', action: 'segment', status_code: e?.status || 0 });
      document.getElementById('segResult').innerHTML = '';
      errEl.innerHTML = `<div class="js-err-box">${e.message}</div>`;
    } finally {
      btn.innerHTML = 'Segment Image →'; btn.disabled = false;
    }
    return;
  }

  document.getElementById('segResult').innerHTML = `
    <div style="padding:2.5rem 1.5rem;text-align:center">
      ${_progressBarHTML('segFill','segMsg','segPct')}
      <div style="font-size:0.7rem;color:var(--text3);margin-top:0.7rem;opacity:0.75">First call downloads ~4.4 MB — may take ~30 s on free tier cold start</div>
    </div>`;

  try {
    const res = await fetch(`${VISION_API}/segment-image`, { method: 'POST', body: form });
    if (!res.ok) {
      const raw = await res.text();
      let msg;
      try { const j = JSON.parse(raw); msg = j.detail || raw; } catch { msg = raw; }
      if (res.status === 503) { showSegRetry(msg); return; }
      throw new Error(msg);
    }
    let data = null;
    for await (const ev of _sseStream(res)) {
      if (ev.error) throw new Error(ev.error);
      if (ev.pct !== undefined) _updateProgressBar('segFill','segMsg','segPct', ev.pct, ev.msg);
      if (ev.result) data = ev.result;
    }
    if (!data) throw new Error('No result received from server.');
    renderSegmentationResult(data);
    _track('query_run', { tool: 'vision', action: 'segment', model: model || '' });
  } catch(e) {
    _track('error', { tool: 'vision', action: 'segment', status_code: e?.status || 0 });
    document.getElementById('segResult').innerHTML = '';
    errEl.innerHTML = `<div class="js-err-box">${e.message}</div>`;
  } finally {
    btn.innerHTML = 'Segment Image →';
    btn.disabled  = false;
  }
}

function showSegRetry(msg) {
  const errEl = document.getElementById('segErr');
  const btn   = document.getElementById('segRunBtn');
  btn.innerHTML = 'Segment Image →'; btn.disabled = false;
  if (_segRetryCount >= 3) {
    _segRetryCount = 0;
    errEl.innerHTML = `<div class="js-err-box">✗ Model unavailable after 3 attempts. Please try again later.</div>`;
    return;
  }
  _segRetryCount++;
  let secs = 30;
  const tick = () => {
    errEl.innerHTML = `<div class="js-warn-box">
      <span>⏳ Vision service is warming up — please try again in ~30 seconds. Auto-retrying in ${secs}s… (attempt ${_segRetryCount}/3)</span>

    </div>`;
    if (secs-- > 0) { _segRetryTimer = setTimeout(tick, 1000); } else { runSegmentation(); }
  };
  tick();
}
