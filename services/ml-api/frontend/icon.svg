<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Neural node: centre circle -->
  <circle cx="16" cy="16" r="3.2" fill="url(#glyph)"/>

  <!-- Satellite nodes -->
  <circle cx="16" cy="6"  r="2" fill="url(#glyph)" opacity="0.9"/>
  <circle cx="26" cy="16" r="2" fill="url(#glyph)" opacity="0.9"/>
  <circle cx="16" cy="26" r="2" fill="url(#glyph)" opacity="0.9"/>
  <circle cx="6"  cy="16" r="2" fill="url(#glyph)" opacity="0.9"/>

  <!-- Diagonal nodes -->
  <circle cx="23" cy="9"  r="1.4" fill="#818cf8" opacity="0.7"/>
  <circle cx="23" cy="23" r="1.4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="9"  cy="23" r="1.4" fill="#34d399" opacity="0.7"/>
  <circle cx="9"  cy="9"  r="1.4" fill="#818cf8" opacity="0.7"/>

  <!-- Connection lines -->
  <line x1="16" y1="16" x2="16" y2="8"  stroke="#818cf8" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="16" x2="24" y2="16" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="16" x2="16" y2="24" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="16" x2="8"  y2="16" stroke="#818cf8" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="16" x2="22" y2="10" stroke="#818cf8" stroke-width="0.8" opacity="0.35"/>
  <line x1="16" y1="16" x2="22" y2="22" stroke="#38bdf8" stroke-width="0.8" opacity="0.35"/>
  <line x1="16" y1="16" x2="10" y2="22" stroke="#34d399" stroke-width="0.8" opacity="0.35"/>
  <line x1="16" y1="16" x2="10" y2="10" stroke="#818cf8" stroke-width="0.8" opacity="0.35"/>
</svg>
