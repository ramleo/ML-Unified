[pytest]
# Unit tests live in services/*/tests/ — run ONE service at a time:
#     pytest services/ml-api/tests/
#     pytest services/ml-vision/tests/
# `pytest services/` is refused by the root conftest.py, which explains why:
# the services share the module names 'app' and 'shared', so a combined run
# tests the wrong code. CI runs them as separate steps for the same reason.
# E2E tests live in tests/e2e/ — run them with pytest tests/e2e/
testpaths = tests/e2e
# Suppress noisy third-party deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
